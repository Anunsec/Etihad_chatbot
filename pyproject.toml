[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etihad-travel-assistant"
version = "0.1.0"
description = "Local policy-grounded airline assistant using FastAPI, Streamlit, LangChain, LangGraph, and LangSmith."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "streamlit>=1.42",
  "httpx>=0.28",
  "requests>=2.32",
  "redis>=5.2",
  "chromadb>=1.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.20",
  "PyJWT>=2.10",
  "pwdlib[argon2]>=0.2",
  "langchain[mcp]>=1.4.0",
  "langchain-openai>=1.0.0",
  "fastmcp>=4.0.1,<5",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "langsmith>=0.3",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[project.scripts]
etihad-api = "etihad_assistant.api:run"
etihad-mcp = "etihad_assistant.mcp_server:run"
etihad-index-policies = "etihad_assistant.ingestion:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etihad_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

