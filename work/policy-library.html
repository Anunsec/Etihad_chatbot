	var accordiondata = JSON.parse("{\x22aemdata\x22:{\x22mostRecentLabel\x22:\x22Most recent\x22,\x22updatedText\x22:\x22Updated\x22,\x22accordions\x22:[{\x22heading\x22:\x22GDS entries for SSRs \x26 Ancillaries\x22,\x22description\x22:\x22<p><b>Policy<\/b><\/p>\\n<p>A Special Service Request (SSR) enables you to offer guests more choice on board. They include:<\/p>\\n<ul>\\n<li>Different types of meal, such as diabetic or low\u002Dcalorie.<\/li>\\n<li>Special assistance (such as wheelchairs).<\/li>\\n<li>Baggage handling requests.<\/li>\\n<li>Unaccompanied Minor service for children travelling alone.<\/li>\\n<li>Codes to notify the crew about certain passengers e.g. a VIP, a deportee or someone who has impaired hearing.<\/li>\\n<li>Codes to notify the crew about situations e.g. an animal in the hold or sporting equipment.<\/li>\\n<li><a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/GDS\u002DEntry\u002Dfor\u002Da\u002DStretcher\u002DPassenger.pdf\\\x22 target=\\\x22_blank\\\x22>GDS entry for a Stretcher Passenger<\/a><\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p>SSRs are subject to availability. Please review the full GDS list:<\/p>\\n<ul>\\n<li><a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/Sabre%20GDS%20Trade%20Entry%20Guides.pdf\\\x22 target=\\\x22_blank\\\x22>Sabre\x26nbsp;GDS Trade Entry Guides<\/a><\/li>\\n<li><a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/amadeus\u002Dgds\u002Dtrade\u002Dentry\u002Dguides\u002D07apr2023\u002Dv2.pdf\\\x22 target=\\\x22_blank\\\x22>Amadeus GDS Trade Entry Guides<\/a><\/li>\\n<li><a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/Axcess%20GDS%20Trade%20Entry%20Guides.pdf\\\x22 target=\\\x22_blank\\\x22>Axcess GDS Trade Entry Guides<\/a><\/li>\\n<li><a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/Gailileo%20GDS%20Trade%20Entry%20Guides.pdf\\\x22 target=\\\x22_blank\\\x22>Gailileo GDS Trade Entry Guides<\/a><\/li>\\n<li><a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/Travelsky%20GDS%20Trade%20Entry%20Guides.pdf\\\x22 target=\\\x22_blank\\\x22>Travelsky GDS Trade Entry Guides<\/a><\/li>\\n<li><a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/etihad\u002Dchauffeur\u002Dgds\u002Dentries.pdf\\\x22 target=\\\x22_blank\\\x22>Etihad Chauffeur GDS entries<\/a><\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p>Click <a href=\\\x22\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/pss\/emds%20\u002D%20gds%20\u002D07mar23.pdf\\\x22 target=\\\x22_blank\\\x22>here<\/a> to view GDS ancillary guides.<\/p>\\n<p>GDS entries for\x26nbsp;<a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/gds\u002Dentries\u002Dfor\u002Dexcess\u002Dbaggage.pdf\\\x22 target=\\\x22_blank\\\x22>Excess Baggage<\/a><\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Lounge ancillary purchase through Travel Agencies<\/b><\/p>\\n<p>Effective\x26nbsp;<b>17 June 2025<\/b>, travel agencies will be able to sell the following Business lounge products via their own GDS. This will support in fulfilling guests’ requests at the time of booking.<\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x2287%\\\x22>\\n<tbody><tr><td width=\\\x229%\\\x22 valign=\\\x22top\\\x22><p><b>SSR<\/b><\/p>\\n<\/td>\\n<td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p><b>RFISC<\/b><\/p>\\n<\/td>\\n<td width=\\\x2279%\\\x22 valign=\\\x22top\\\x22><p><b>Description<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x229%\\\x22 valign=\\\x22top\\\x22><p>LBZA<\/p>\\n<\/td>\\n<td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p>EBZ2<\/p>\\n<\/td>\\n<td width=\\\x2279%\\\x22 valign=\\\x22top\\\x22><p>Business Lounge up to 4 hours (for economy class guests)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x229%\\\x22 valign=\\\x22top\\\x22><p>LOJV<\/p>\\n<\/td>\\n<td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p>E0BX<\/p>\\n<\/td>\\n<td width=\\\x2279%\\\x22 valign=\\\x22top\\\x22><p>Business Lounge for JValue guests<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>GDS entries for\x26nbsp; <a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/lounge\u002Dancillary\u002Dgds\u002Dentries.pdf\\\x22 title=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/lounge\u002Dancillary\u002Dgds\u002Dentries.pdf\\\x22 target=\\\x22_blank\\\x22>Lounge Ancillary<\/a>.<\/p>\x22,\x22lastmodified\x22:\x2226\u002D02\u002D2026\x22},{\x22heading\x22:\x22A note about booking\x22,\x22description\x22:\x22<p><a href=\\\x22https:\/\/www.etihadhub.com\/en\u002Dae\/policy\u002Dlibrary\\\x22><\/a><b>Global Service fee<\/b><\/p>\\n<p>A flat fee of USD 30 will be charged irrespective of point of sale for any services through the City Ticketing Office.\x26nbsp;<\/p>\\n<p>This includes:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; New bookings<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Changes to existing bookings<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Refunds<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Duplicate segments\/Duplicate PNRs<\/b><\/p>\\n<p>Travel service providers must not create itineraries that are operationally impossible within a single booking or across the bookings. This includes holding concurrent flights during the same travel period where it is not feasible for the passenger to travel simultaneously. Such bookings will get cancelled by the airline, and<\/p>\\n<p>An Agency Debit Memo (ADM) of USD 20 per passenger, per segment, will be issued to the travel agency responsible.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Hidden Group<\/b><\/p>\\n<p>Multiple un\u002Dticketed individual bookings created on the same flight\/ Travel date\/ RBD by the same agency as a large group will be treated as violated bookings and will be canceled within 48 hours of detection if not ticketed.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Fare rules<\/b><\/p>\\n<p>You must adhere to all ticketing and fare rules and ensure that the booking is either ticketed or cancelled before the expiry date of the ticketing time limit.<\/p>\\n<p>Etihad Airways reserves the right to use an automatic cancellation of the segments when ticketing has not occurred within the ticketing time limit.<\/p>\\n<p>The ticket Time Limit will be based on the Point of Sale and is automatically generated at the time the PNR is issued.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Fictitious\/speculative booking\/Training\/Test bookings \x26amp; ticket numbers<\/b><\/p>\\n<p>Creating fictitious, test, or passive bookings—or any combination of these—to meet GDS productivity targets is a violation of standard industry practices. This also includes duplicating bookings across multiple GDS platforms to meet quotas or gain incentives.<\/p>\\n<p>Furthermore, the use of fictitious names or ticket numbers to hold space, or making reservations under false identities, is strictly prohibited as it adversely impacts inventory availability.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Etihad Airways actively monitors such activities. Bookings containing fictitious names or ticket numbers will be screened and once identified, are subject to automatic cancellation. Violations will result in an Agency Debit Memo (ADM) of USD 20 per passenger, per segment, issued to the responsible travel agency.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Inactive segments<\/b><\/p>\\n<p>When a reservation is impacted by a schedule change, ticketing time limit, flight cancellation, or other circumstances, Etihad Airways sends a notification directly to the original booking agent’s GDS queue. This notification outlines the changes and instructs the agent to update the Passenger Name Record (PNR) accordingly, including the removal of inactive segments.<\/p>\\n<p>Any changes resulting in inactive itinerary segments must be addressed at least 24 hours before departure. This includes cancelling ticketed or un\u002Dticketed segments with status codes such as UN, NO, HX, WK, WL. If not, the airline will cancel it, and an Agency Debit Memo (ADM) of USD 20 per passenger, per segment, will be issued to the travel agency responsible.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>A note about booking\x26nbsp;\x26nbsp;<\/b><\/p>\\n<p>Etihad Airways reserves the right to audit all booking transactions to identify non\u002Dcompliant practices and may issue invoices to recover costs associated with excessive GDS usage. Continued non\u002Dcompliance by a travel agency may result in further action, including restricting the agency’s access to the specific GDS used to manipulate Etihad Airways’ inventory.<\/p>\\n<p>These principles, rules, and instructions are supplementary to the rights granted to each carrier under the ARC Agent Reporting Agreement (ARA) and the IATA Passenger Sales Agency Agreement, as amended from time to time.<\/p>\\n<p>By continuing to operate under the ARC ARA or the IATA Passenger Sales Agency Agreement, each agent acknowledges and agrees to comply with these policies.<\/p>\\n<p>We would like to extend our sincere thanks to all our trade partners for their continued support of Etihad Airways. We trust that everyone recognizes the importance of best practice in seat inventory management, which benefits all stakeholders. For any further information or assistance, please contact your local Etihad Airways Sales and Account Management team<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Consequences for policy violations<\/b><\/p>\\n<p>Damages: Etihad Airways reserves the right to hold the travel service provider responsible and liable for any losses and damages due to violation of this policy by the relevant travel service providers.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>ADM Fee Structure applicable for Revenue Integrity violation of policy.<\/b><\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Policy<\/b><\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Charges (in US$)<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Inactive Segments<\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>US$20 per passenger\/per segment for uncancelled segments<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Waitlist segments<\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>US$20 per passenger\/per segment for excessive waitlist<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Duplicate segments on the same bookings and Duplicate PNRs<\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>US$20 per passenger\/per segment<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Fictitious\/Speculative bookings\/Test bookings\/ training PNRs<\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>US$20 per passenger\/per segment<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>E\u002DTicket Validation (Invalid Ticket)<\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>US$20 per passenger\/per segment<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Married Segment abuse<\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Etihad Airways will raise the ADM of USD 200 in the Economy Cabin and USD 400 in the Business and First cabins per passenger for ticketed bookings that are not made in compliance with the Married segment abuse policy.<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Point of commencement abuse<\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Etihad Airways will raise the ADM of USD 200 in the Economy Cabin and USD 400 in the Business and First cabins per passenger for ticketed bookings that are not made in compliance with the\x26nbsp;Point of commencement abuse policy.<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Inventory Abuse<\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Etihad Airways will raise the ADM of USD500 per passenger for ticketed\/Un\u002Dticketed bookings that are not made in compliance with the Inventory abuse<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p><b>\x26nbsp;<\/b><a href=\\\x22https:\/\/www.etihadhub.com\/en\u002Dae\/policy\u002Dlibrary\\\x22><\/a><\/p>\x22,\x22lastmodified\x22:\x2202\u002D07\u002D2026\x22},{\x22heading\x22:\x22Point of commencement, Married segments and Inventory violation\x22,\x22description\x22:\x22<p>Etihad Airways follows a <b>Point of Commencement (POC)<\/b>–based availability model.<\/p>\\n<p>POC evaluates availability based on the journey’s origin (starting point). As a result, availability is determined by the initial point of travel rather than the physical location of the user.<\/p>\\n<p>Therefore, for any given itinerary, the same availability is displayed globally, regardless of where the request is made.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>What is Point of Commencement abuse?<\/b><\/p>\\n<p><br>\\nAll bookings on Etihad Airways flights must be made in the correct sequence, aligned with the passengers’ intended journey. Bookings made with the sole intention of bypassing Etihad’s inventory—such as securing seats in booking classes that are unavailable at the time of reservation—will be considered a violation of the Point of Commencement policy. Un\u002Dticketed bookings will be cancelled immediately, while ADM will be raised for the ticketed bookings. The agency will be held accountable for any inconvenience caused to guests, and an Agency Debit Memo (ADM) of $200 per passenger in Economy Class and $400 per passenger in First and Business Class will be issued against the ticketing agency.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Point of commencement<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22><b>●\x26nbsp; \x26nbsp;Points to remember for Point of Commencement violation:<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 80px;\\\x22>o\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;Booking out of Sequence is not allowed (Inbound booked first \x26amp; outbound booked later)<\/p>\\n<p style=\\\x22margin\u002Dleft: 80px;\\\x22>o\x26nbsp; \x26nbsp;\x26nbsp;Booking a Dummy Segment is not allowed<\/p>\\n<p style=\\\x22margin\u002Dleft: 80px;\\\x22>o\x26nbsp; \x26nbsp;\x26nbsp;After PNR is created, if any changes to the point of commencement, then entire itinerary to be cancelled and rebook as per intended itinerary.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Married segments<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>As per Etihad Airways’ booking policy, all connecting flight segments must be booked from a single availability display covering the complete journey from origin to destination. These flights segments are designated as <b>married segments<\/b>.<\/p>\\n<p>Married segments must remain intact throughout the booking lifecycle and cannot be manipulated independently. Any modification, rebooking, or cancellation must be applied simultaneously across all linked segments to ensure the journey remains synchronized and compliant<\/p>\\n<p>Strict adherence to married segment logic is essential to avoid violation and ADMs. \x26nbsp;Agency Debit Memo (ADM) of $200 per passenger in Economy and $400 per passenger in First and Business will be issued against the ticketing agency<b><\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Inventory violation<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Ad hoc violations where the Inventory has been misused.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>1)\x26nbsp;\x26nbsp;\x26nbsp; Managed to get the seats on a close RBD<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>2)\x26nbsp;\x26nbsp;\x26nbsp; Blocking seats only for the fare quotation<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>\x26nbsp;<\/b><\/p>\\n<p><b>All un\u002Dticketed violated PNRs will be identified and cancelled by Etihad Revenue Integrity. ADMs will be issued against the ticketed PNRs, with the following charges applied:<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22><b>●\x26nbsp; \x26nbsp;USD 500 per guest across the cabins.\x26nbsp;<\/b><\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2217\u002D07\u002D2026\x22},{\x22heading\x22:\x22Ancillary Time Limit\x22,\x22description\x22:\x22<p>We’ve made some changes to the amount of time your guests must pay for ancillaries, including seats and extra bags.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22><b>●\x26nbsp; \x26nbsp;<\/b>If you book an ancillary item, make sure to issue an Electronic Miscellaneous document (EMD) straight away. If you do not issue an EMD to fulfil the payment, the ancillary will be automatically cancelled.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22><b>●\x26nbsp; \x26nbsp;<\/b>Ancillaries booked within 48 hours of the flight departure, time limit to issue the EMD is 01 hour after the service is booked.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22><b>●\x26nbsp; \x26nbsp;<\/b>If ancillaries are booked more than 48 hours prior to flight departure, then time limit is 03 hours to issue the EMDs.<\/p>\x22,\x22lastmodified\x22:\x2217\u002D07\u002D2026\x22},{\x22heading\x22:\x22Space churning\x22,\x22description\x22:\x22<p><b>Space churning<\/b><\/p>\\n<p>Excessive and repeated booking and cancelling of space is often done to:<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\u002D Multiple PNRs creation<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\u002D Cancel and\/or rebook of the same guest, flight, class, date, or route to extend ticket time limit, to circumvent the fare rule, excessive inventory control, or to achieve GDS productivity targets.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>The above practices are strictly prohibited and will be invoiced on a per segment basis.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Churning policy:<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2219%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>\x26nbsp;Churn count<\/b><\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>\x26nbsp;Action<\/b><\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>\x26nbsp;SSR remarks<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2219%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>At 2<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Warning<\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>CHURNING QUOTA REACHED FOR (SEGMENT)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2219%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>At 3<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Freeze TTL<\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002DNIL\u002D<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2219%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>At 4 or more<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Cancellation<\/p>\\n<\/td>\\n<td width=\\\x2264%\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>SEGMENT CANCELLED AS CHURNING QUOTA REACHED<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\x22,\x22lastmodified\x22:\x2228\u002D02\u002D2025\x22},{\x22heading\x22:\x22Electronic Miscellaneous Documents (EMD) \x22,\x22description\x22:\x22<p>Electronic Miscellaneous Documents (EMDs) provide a single solution for agents to collect and track all additional fees associated with a booking.\x26nbsp;<\/p>\\n<p>With an EMD, an agent can:<\/p>\\n<ul>\\n<li><p>Accept various payments, such as excess baggage charges, miscellaneous charges, penalty fees, air transportation, group deposits and rebooking fees<\/p>\\n<\/li>\\n<li><p>Issue an electronic document by email or print\x26nbsp;\x26nbsp;<\/p>\\n<\/li>\\n<li><p>Automatically integrate miscellaneous charges into invoices, sales reports, back\u002Doffice accounting and external systems<\/p>\\n<p>\x26nbsp;<\/p>\\n<\/li>\\n<\/ul>\\n<p>A chargeable service (SSR) must be added to a booking and priced before an EMD can be issued. EMDs are based on the Reason\u002DFor\u002DIssuance\u002DCode (RFIC), which determines the group of services it belongs to. Please refer to Appendix A (below).<\/p>\\n<p><b>Standalone and Associated EMDs<\/b><\/p>\\n<p>Please refer to the below table for further information on the two types of EMDs available: Standalone EMD (EMD\u002DS) and Associated EMD (EMD\u002DA):<\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22>\\n<tbody><tr><td><p><b>Standalone EMD(EMD\u002DS)<\/b><\/p>\\n<\/td>\\n<td><p><b>Associated EMD (EMD\u002DA)<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td><p>\x26nbsp;<\/p>\\n<p>●\x26nbsp; \x26nbsp; A standalone EMD is issued for a residual value or the collection of miscellaneous charges that are not lifted with an e\u002Dticket coupon, e.g., group deposit or change service fees<\/p>\\n<p>●\x26nbsp; \x26nbsp; The standalone EMD can consist of a single or multiple value coupons<\/p>\\n<p>●\x26nbsp; \x26nbsp; It can contain a reference to an e\u002D ticket<\/p>\\n<p>●\x26nbsp; \x26nbsp; It can be consumed at issuance or used at different stages<\/p>\\n<p>●\x26nbsp; \x26nbsp; Once issued, it has no further interaction with the airline systems (reservation systems and DCS)<\/p>\\n<p>\x26nbsp;<\/p>\\n<\/td>\\n<td><p>●\x26nbsp; \x26nbsp; An associated EMD is issued for ancillaries that are lifted (considered used) at the same time as the e\u002Dticket coupon e.g., excess baggage, seats or upgrades<\/p>\\n<p>●\x26nbsp; \x26nbsp; The associated EMD can consist of a single or multiple value coupons that are directly linked to individual flight coupons<\/p>\\n<p>●\x26nbsp; \x26nbsp; Each EMD coupon that is associated to an e\u002Dticket is referenced in the e\u002Dticket record<\/p>\\n<p>●\x26nbsp; \x26nbsp; The carrier and the routing of the EMD\u002DA and the e\u002Dticket coupons must match<\/p>\\n<p>●\x26nbsp; \x26nbsp; An EMD\u002DA can be automatically or manually associated or disassociated<\/p>\\n<p>●\x26nbsp; \x26nbsp; Only airline agents can manually associate and disassociate EMD\u002DAs<\/p>\\n<p>●\x26nbsp; \x26nbsp; The EMD\u002DA\x27s final usage depends on the e\u002Dticket coupon it is associated to, provided that it does not become disassociated<\/p>\\n<p>●\x26nbsp; \x26nbsp; The status of the associated EMD value coupons and the e\u002Dticket coupons must remain synchronised<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p><b>EMD coupon structure<\/b><\/p>\\n<p>An EMD may contain up to 16 coupons, where up to four coupons can have the same EMD number. However, if an EMD contains more than four coupons, another EMD must be issued (up to four consecutive EMD numbers).<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Appendix A: Chargeable ancillaries<\/b><\/p>\\n<p>Electronic Miscellaneous Document (EMD) is issued as an accountable document to track the charges and use of chargeable ancillaries and services.<br>\\n<\/p>\\n<p>Click <a href=\\\x22\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/pss\/emds%20\u002D%20gds%20\u002D07mar23.pdf\\\x22 target=\\\x22_blank\\\x22>here<\/a> to view the list of chargeable SSRs used by Etihad Airways<\/p>\\n<p><i><b>*EMD Type: <\/b>Associated (A) \/ Standalone (S)<\/i><\/p>\\n<p><i><b>Seats<\/b>: Multiple price point have been introduced for the chargeable seat products in Economy cabin e.g. Economy Standard seat, Economy space, Bulkhead seat. The seat prices are differentiated based on seat locations like window, middle \x26amp; aisle.<\/i><\/p>\x22,\x22lastmodified\x22:\x2208\u002D05\u002D2025\x22},{\x22heading\x22:\x22Hidden Group  \x22,\x22description\x22:\x22<p>Multiple un\u002Dticketed individual bookings created on the same flight\/Travel date\/RBD by the same agency as a large group will be treated as violated bookings and will be canceled within 24 hours of detection.<\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2210%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Agency<\/b><\/p>\\n<\/td>\\n<td width=\\\x2210%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>PNRs<\/b><\/p>\\n     <script>

	var accordiondata = JSON.parse("{\x22aemdata\x22:{\x22mostRecentLabel\x22:\x22Most recent\x22,\x22updatedText\x22:\x22Updated\x22,\x22accordions\x22:[{\x22heading\x22:\x22Etihad GTAA Addendum\x22,\x22description\x22:\x22<p style=\\\x22text\u002Dalign: center;\\\x22><b>Etihad Addendum to the IATA PSAA and ARC Agreement<\/b><\/p>\\n<p>As of January 2025<\/p>\\n<p><br>\\n<b>Introduction<\/b><\/p>\\n<p>Your travel agency, including affiliated agency locations under common control that are accredited by the International Air Transport Association (“IATA”) or Airlines Reporting Corporation (“<b>ARC<\/b>”) (collectively, “<b>Agent<\/b>”) has entered into the IATA Passenger Sales Agency Agreement (the “<b>IATA PSAA<\/b>”) or with respect to travel agency location(s) in the United States the Agent Reporting Agreement (the “ARC Agreement”) whereby Agent has been appointed (“<b>Agent’s Appointment<\/b>”) to act as an agent for Etihad Airways (“<b>Etihad<\/b>”) in the sale of air transportation. The terms and conditions governing the agent\u002Dprincipal relationship between Agent and Etihad are set forth below and in the IATA PSAA and\/or ARC Agreement applicable to each travel agency location and any other agreement entered into by Etihad and Agent (such agreements, together with this Addendum, being referred to collectively as the “<b>Agreement<\/b>”). Agent acknowledges and affirms that Agent’s continued sale of Etihad’s products and services will evidence our mutual agreement to this Addendum. To the extent that Agent engages employee, sub\u002Dagents, services vendors or other third\u002Dparty contractors to support Agent’s activities within the scope of the Agent’s Appointment, Agent will be responsible to Etihad for their full compliance with this Addendum. The terms and conditions of this Addendum apply to all the tickets issued using Etihad’s ticket stock.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>1.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Appointment<\/b><\/p>\\n<p>Etihad may independently review any of Agent’s locations, including those under Agent’s common control that are accredited by ARC or IATA (“<b>Agency Locations<\/b>”). The review may include the right for Etihad to enter any Agency Location upon reasonable notice to determine that Agent’s operations comply with Etihad’s requirements for its agents in the sale of Etihad products and services, which includes: (1) inspecting Agent’s books and records relating to sales of Etihad’s products and services and to ensure Agent’s compliance with the provisions of the Agreement; and (2) auditing Agent’s books and records to detect or establish Agent’s abuse of, or failure to comply with, any terms of the Agreement including Etihad’s Policies, Rules concerning sale of travel on Etihad, agency free and reduced rate travel, agency incentives, promotional or override programmes, or Agent ticket fraud. Agent agrees that Etihad may use information obtained from IATA or ARC to evaluate the credit\u002Dworthiness of Agent and Agent’s employees and owners.<\/p>\\n<p>Without limitation, and in its sole discretion and at any time, Etihad may, upon written notice to Agent, limit, suspend or terminate the Agent’s Appointment, including immediately terminating the appointment of any Agency Location or Agent’s Appointment. If any Agency Location is suspended or terminated, Agent may not act in any agency capacity for the sale of Etihad’s products and services from the terminated location. If Agent’s Appointment is terminated, Agent may not act in any agency capacity whatsoever for the sale of Etihad’s products and services.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>2.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Compliance with Etihad’s Rules, Terms and Conditions<\/b><\/p>\\n<p>a)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; General: Agent will strictly adhere to Etihad’s current instructions, rules, regulations, requirements, conditions of sale or carriage, tariffs, and procedures (the “<b>Rules<\/b>”) and its and polices either published at the following link: https:\/\/www.etihadhub.com\/en\u002Dae\/policy\u002Dlibrary or otherwise provided to the Agent (together the “<b>Policies<\/b>”) in booking any reservation or issuing, reissuing, selling, exchanging, refunding, canceling or reporting any ticket calling for transportation on Etihad. Agent will not assist or facilitate or encourage any violation of the Rules or Policies by any of the Agent’s customers. Agent will ensure that its systems, processes and sales practices accurately display and convey all information relating to Etihad’s products and services as presented by Etihad, including with respect to the display, offer, booking, ticketing or sale of Etihad’s products and services. Agent will also comply with all laws and regulations applicable to its activities under the Agreement. Failure to comply may subject Agent to debit memos from Etihad for any deficiency or any loss incurred by Etihad by reason of the violation \x26nbsp;and the suspension, limitation or termination of Agent’s Appointment.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>b)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Order of Precedence: In the event of any conflicts between this Addendum, the IATA PSAA or ARC Agreement, or applicable law or regulation, the conflict shall be resolved by giving priority as follows:<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; i.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; applicable law or regulation;<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; ii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; this Addendum;<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; iii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; the IATA PSAA and ARC Agreement.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>c)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Proper Disclosure of Fares, Charges and Terms and Conditions: Agent advertising Etihad fares as available for purchase through Agent must at all times include all applicable taxes, airport charges, and all other levies, charges and fees (“<b>Required Fees<\/b>”) that are known at the time of advertising. Any Required Fees communicated to the Agent by Etihad may not be altered by the Agent. Charges for optional products and services must be clearly presented as such, and should be applied only if the customer affirmatively elects to purchase such product or service (i.e. no pre\u002Dchecked boxes for optional charges). Agents may not impose charges for services that Etihad provides to its customers without charge, such as online check\u002Din. Agents also may not impose additional charges in addition to Etihad’s fees for any paid Etihad service, such as excess baggage. If the Agent collects a fee from the customer for the booking, such fee must be clearly disclosed as separate from Etihad’s fares and the Required Fees, in a way that makes it clear that the fee is being collected by the Agent and not Etihad (for example, labeled as “[Agent Name] Booking Fee”). The fare as published by Etihad must always be separately displayed. All Etihad terms and conditions and applicable fare rules and restrictions must be communicated by the Agent to the customer prior to booking. Any additional terms and conditions imposed by the Agent must be clearly disclosed to the customer, in a way that makes it clear that such terms and conditions are not set or endorsed by Etihad. To ensure customers are provided accurate information, any description of Etihad’s product offering must include a link to source of the information on etihad.com. This includes information about baggage fees, onboard product offering, seat maps, financial products and awards.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>d)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; No Bias: Agent may in no event impose service fees, discounts, or other fees for Etihad fares that are higher than those imposed by the agent on any other carrier’s fares. Agent must ensure that its systems, processes and sales practices accurately display and convey all information relating to Etihad’s products and services as presented by Etihad. Agent’s systems, processes and practices may automate a customer’s preferences for air carrier, but must not otherwise involve any form of bias against Etihad’s products and services, or its chosen technology for distribution, or alter the presentation of the information as provided by Etihad.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>e)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Prohibition of Abusive Booking Practices: Agent acknowledges that Space Churning, Duplicate, Impossible\/Illogical Bookings and other Fraudulent, Fictitious, or Abusive Bookings, violate Etihad’s Rules (See Etihad’s ADM Policy for further information on other Fraudulent or Abusive Booking practices). Circumventing journey controls to obtain sold out inventory is also prohibited. Furthermore, since Etihad is not a participant in other carriers’ private agreements and since Etihad does not honour other airlines’ discount codes, Agent agrees that other airlines’ private or contracted fares or ticket designators may not be ticketed using Etihad’s ticket stock. Agent acknowledges that if it engages in these practices or sells or issues a ticket used for any of these purposes, Agent will be subject to (1) debit memos, (2) the suspension, limitation or termination of Agent’s Appointment, and (3) other remedies available to Etihad.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>f)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Fraud and Misrepresentations: Agent will not engage in any fraudulent activity, including altering flight coupons for non\u002Dqualifying discount travel, backdating tickets, or selling no\u002Dcash\u002Dvalue coupons, discounts, or upgrades. Fraudulent activity also includes intentionally withholding, false advertising, or misrepresenting information regarding Etihad products and services, such as information regarding availability and pricing.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>g)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Re\u002DDistribution: Agent’s Appointment is for purposes of the Agent marketing and selling Etihad’s products and services directly to customers for those products and services. Agent’s Appointment is specific to Agent, and does not include any authority for Agent to act as an intermediary for further distribution of Etihad’s products and services via other intermediaries and sales agents. For example, Agent may not (1) offer or distribute Etihad products and services as part of a service provided by Agent that is re\u002Dbranded so that it appears to customers to be a search, booking or ticketing service from a third party, (2) distribute, display or otherwise provide direct or indirect access to any Etihad Data (or any portion thereof) to any other party, including without limitation any Metasearch Site, or (3) receive any referral, web page click\u002Dthrough or link from any Metasearch Site that is attributable to any Etihad fare in connection with any search result on the Metasearch Site. Agents also may not place or otherwise have any advertising link on any Metasearch Site in connection with any Etihad fare. A “Metasearch Site” is an Internet website that obtains fare data from various travel services companies, aggregates such fare data and displays search results in response to user queries, and includes links for booking the selected itineraries on other websites (i.e. not on the Metasearch Site). Any such re\u002Ddistribution arrangement is only permitted pursuant to a separate agreement signed by authorised representatives of both Agent and Etihad. In addition, if Agent uses or works with a non\u002Daccredited entity in making a booking, then Agent acknowledges and agrees that Etihad reserves the right to reject the booking in Etihad’s sole discretion and that Agent nonetheless remains fully responsible to Etihad in all respects for any bookings made by third parties and ticketed via Agent’s Appointment.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>h)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Passives: Etihad generally allows the use of passive segments, except in the case of satisfying productivity requirements of distribution intermediaries or to circumvent fare rules, provided that the Agent agrees to pay for the charges incurred by the passive segments.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>i)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Etihad treats all customers fairly without discrimination and provides equal access to services and support as required by applicable law. If Etihad offers a product or service on a complimentary basis or otherwise without additional cost to the customer (subject to eligibility and availability) including and not limited to wheelchair access, seat reservation, special meals, Etihad shuttle services, Etihad Chauffeur; all such services and products must remain complimentary to the customer and the Trade Partner must not receive any financial reward from the customer in any form in respect of such product or service unless agreed with Etihad. The Trade Partner shall inform the customer that such product or service is provided by Etihad is on a complimentary basis\/ without additional cost to the customer.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>j)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; When the Agent (outside of Etihad approved codesharing and interlining agreements) offers the customer, a combination of Etihad flights with flights with other airlines or\/and other modes of transportation (rail, bus, ferry etc.) (known as “<b>Virtual Interlining<\/b>”) the Trade Partner must:<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; i.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; issue the Etihad operating segments only on Etihad ticket stock and other operating carriers on separate tickets; as well as on separate PNR\/booking(s).<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; ii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; clearly communicate in writing to the customer that Etihad is not responsible and may not be held liable for non\u002D Etihad operated segments of their journey.<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; iii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; advise the customer that Etihad has no liability for any amendments, cancellations, operational disruptions, or schedule changes for non\u002DEtihad operated segments of their journey and the connection to and from non\u002DEtihad operated segments and Etihad segments.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>k)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; The Agent acknowledges and agrees that IATA Resolution 890X requires the Agent to obtain the consent of Etihad (as the “<b>Airline<\/b>”), to make use of an “<b>Agent Card<\/b>”, which includes but is not limited to Virtual Credit Cards to pay for orders. \x26nbsp;Etihad encourages the use of established alternatives, such as direct bank transfers, charge cards or IATA’s BSP instead to avoid potential additional charges from Etihad (such charges are available upon on request or are otherwise published by Etihad).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>l)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; <b>Use of Etihad’s Identification Plate<\/b><\/p>\\n<p>Etihad’s validation plate is Etihad’s sole property, and Agent will surrender it immediately upon demand by Etihad, ARC or IATA. Agent shall not use Etihad’s validation plate (i) to circumvent termination or in the absence of appointment by Etihad or (ii) to issue electronic tickets or any other traffic documents for transportation on any airline that has refused to appoint, or has terminated its appointment of, Agent. Further, Agent will not issue tickets for transportation on Etihad on behalf of any other travel agency location for which Etihad has refused or terminated its appointment, including any of the Agency Locations. Agent will not use Etihad\x27s validation to issue tickets for transportation on carriers that do not maintain a ticketing and baggage interline agreement with Etihad.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>m)\x26nbsp;\x26nbsp;\x26nbsp; \x26nbsp;<b>Debit Memos<\/b><\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; i.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Issuance of Debit Memos: If Agent is in violation of the Agreement or the Rules, Etihad may issue a debit memo to Agent for any deficiency or any loss incurred by Etihad as a result of the violation, including, without limitation an amount equal to the cost of the ticket, the difference between the applicable fare and the fare actually used, service provider and intermediary fees, lost revenue from spoiled inventory, and\/or an administrative service charge, all as Etihad deems appropriate and Etihad may immediately suspend, limit or terminate the Agency Location or Agent’s Appointment upon notice to Agent. Agent acknowledges that Etihad’s damages for Agent’s failure to comply may be uncertain or difficult to ascertain or prove and that Etihad’s administrative service charges are a reasonable estimate of some or all of Etihad’s loss due to the Agent’s improper acts in these situations. Etihad also retains all rights and remedies available to it under this Agreement or at law or in equity.<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; ii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Payment of Debit Memos: Agent agrees to pay or reconcile all debit memos and debit memo fees issued by Etihad within 30 days of the date of issuance.<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; iii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Administrative Processing Fees: Etihad reserves the right to assess, and Agent agrees to pay, an administrative processing fee to be included as part of any debit memo issued to Agent. Etihad also reserves the right to assess, and Agent agrees to pay, an additional administrative processing fee to cover administrative expenses in connection with an audit or review of a request by Agent for reinstatement of Agent’s Appointment following the suspension, limitation or termination for any reason by Etihad. Etihad’s acceptance of any administrative fees does not obligate Etihad to act, or refrain from taking any action, nor does it waive, release, amend, or modify this Agreement, or any rights or obligations of Agent or Etihad.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>n)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; \x26nbsp;<b>Etihad Data<\/b><\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; i.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Data Ownership and Unauthorized Activities: Agent acknowledges that (i) Etihad makes an extensive investment of time, money and specialized resources to create, develop, collect, organize and maintain content and data (including pre\u002Dbooking and post\u002Dbooking data) about Etihad’s products, services and facilities, (ii) such content and data constitute Etihad’s valuable property, and (iii) unauthorised distribution or remarketing of such Etihad content and data is improper and unlawful. Some examples of such unauthorised distribution or remarketing of Etihad content and data include: (1) accessing etihad.com by the use of any automated or electronic devices commonly known in the Internet industry as robots or spiders, or by the use of other electronic search devices; (2) soliciting, facilitating, encouraging or agreeing to provide access to or otherwise remarket or redistribute, or take affirmative steps to allow or permit such access to, or remarketing or redistribution of, any Etihad content or data to any third party, through any process, including screen scraping, spiders, web “bots” or other device, software or system; (3) licensing, selling, or otherwise providing to any person or entity any software or other device that is capable of accessing Etihad content or data from any source; or (4) assisting, aiding, or abetting in any way the unauthorised access of etihad.com, or the distribution or display of Etihad content or data obtained or derived from etihad.com or any other website or any other source, by any third party. Agent shall not engage in any of the above examples, or any other unauthorised distribution or remarketing of Etihad content or data, without the prior written authorisation of Etihad. If Agent learns that any third party is accessing, distributing, or displaying Etihad content or data in any way obtained via Agent, including Agent’s website, without Etihad’s written authorisation, Agent shall promptly inform Etihad and take all commercially reasonable measures, including commercial, technological, or legal measures, to prevent the unauthorised access, display, or distribution of Etihad content or data.<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; ii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Etihad’s Intellectual Property: Etihad grants Agent a limited, royalty free, non\u002Dtransferable, non\u002Dexclusive permission to use certain Etihad intellectual property, specifically the trademarks “ETIHAD”, “ETIHAD AIRWAYS” (“<b>Etihad Marks<\/b>”) solely for the purpose of identifying Agent as an authorised agent of Etihad. In using the Etihad Marks, Agent agrees that Etihad owns the Etihad Marks, and that Agent will not harm the Etihad Marks or Etihad’s ownership of the Etihad Marks or in any way contest or deny the validity of, or the right or title of Etihad in or to, the Etihad Marks. Agent acknowledges and understands that it has no right or permission to use the Etihad Marks for any purpose not expressly stated in these terms and conditions, and that any unauthorised use of the Etihad Marks will constitute an infringement of Etihad’s rights. Agent understands that it has no right or permission pursuant to this Addendum to use any other intellectual property owned by Etihad or its affiliated entities. Agent further agrees that it will not purchase, use, or register any domain names or keywords or search terms that are identical or similar to, or contain (in whole or in part), any of the Etihad Marks.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>o)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; \x26nbsp;<b>Confidentiality, Privacy and Data Security<\/b><\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; i.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Confidentiality: Agent will keep confidential and not disclose to any third party the following confidential information of Etihad: (i) any fare programmes and commission arrangements that may be agreed between Etihad and Agent; (ii) any and all post\u002Dbooking data, including all PNRs and orders, that cover Etihad products and services; and (iii) any other Etihad Data that Etihad designates as confidential or is otherwise reasonably identifiable as confidential or proprietary information (“<b>Confidential Information<\/b>”). However, Etihad consents to Agent disclosing commission arrangements and payments to customers when this information is requested by the customer. Agent may also disclose Confidential Information to Agent’s directors, officers, employees, agents, contractors and third\u002Dparty suppliers if such persons are bound by equivalent confidentiality commitments and have a legitimate need to know such information in order for the Agent to perform its obligations to Etihad. In addition, this Section will not prohibit Agent from making disclosures required by law or judicial process after making reasonable efforts to resist disclosure and notify Etihad. This provision will survive the suspension, limitation or termination or expiration of Agent’s Appointment.<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; ii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Privacy: For purposes of these instructions, “<b>personal data<\/b>” means information that identifies or could be used to identify a particular individual, such as name, mailing address, telephone number, email address, frequent flier number, government issued identification number, credit card or other payment data, date of birth, driver’s license number, account number or user name, PIN, or password. Agent will cause all of the Agent’s privacy policies to inform customers that their personal data will be disclosed to airlines (and third parties in accordance with the airline’s privacy policy). The Agent shall give its customers notice, and if required under applicable law obtain the customer’s consent, to such disclosure, transfer and processing of personal data. Etihad is an independent data controller within the meaning of the E.U. General Data Protection Regulation. To the extent Etihad Data includes personal data, including as disclosed by the Agent, Etihad will handle such personal data in accordance with Etihad’s privacy policy and in accordance with applicable local laws and regulations.<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; iii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Data Security: Agent will establish, implement, maintain, and use reasonable physical, technical and administrative safeguards for Etihad Data in Agent’s possession or under Agent’s control in order to protect the same from unauthorized disclosure, access, use, destruction, loss, damage or alteration. Such safeguards will be in compliance with all applicable laws and regulations, including any privacy or data protection statutes in the United Arab Emirates, United States, United Kingdom and European Union, and will be no less rigorous than (i) industry standard practices in the transportation and related services industry, and (ii) reasonable security procedures and practices appropriate to the nature of such Etihad Data (the “<b>Security Requirements<\/b>”). In addition, Agent shall require any of Agent’s employees, agents or contractors with access to Etihad Data (such employees, agents or contractors the “<b>Agent’s Employees<\/b>”) to adhere to the Security Requirements. Agent agrees that the controls used to safeguard Etihad Data in Agent’s possession will take into account the sensitivity of such Etihad Data. Agent and Agent’s Employees shall implement and enforce, at a minimum, the following controls, provided, however, that the implementation and enforcement of such controls shall not relieve Agent and Agent’s Employees of their duties to adhere to the Security Requirements:<\/p>\\n<p>a.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Periodically (and no less than quarterly) review user access rights for any users granted access to the Etihad Data and systems and maintain records of such reviews;<\/p>\\n<p>b.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Where applicable, conduct periodic security reviews and independent assessments that include independent penetration tests and vulnerability assessments of the Agent’s systems and software that is directly or indirectly connected to or integrated with Etihad’s systems (including the internal reservation system and Etihad’s NDC API) or any third\u002Dparty systems (such Agent’s systems, software, or third\u002Dparty systems, the “<b>Agent Software<\/b>”). Agent shall maintain reports of such assessments and the corresponding remediation plans and present such reports to Etihad’s appointed audit personnel (whether Etihad’s internal security or a third\u002Dparty supplier) for reasonable assurance purposes;<\/p>\\n<p>c.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Encrypt all Etihad Data, whether at rest or in transit, using strong, well\u002Dknown, industry\u002Dstandard and commonly used encryption mechanisms and protocols;<\/p>\\n<p>d.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Where applicable, embed secure coding techniques and application security testing during every release version of any Agent Software;<\/p>\\n<p>e.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Implement appropriate logging and monitoring of security events at the application and infrastructure level to support timely detection of and response to security events and incidents;<\/p>\\n<p>f.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Where applicable, the Agent Software must support role\u002Dbased access control, industry\u002Drecognized password policies, and multifactor authentication;<\/p>\\n<p>g.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Agent shall have a well\u002Ddefined, implemented, maintained and regularly\u002Dtested cyber security incident response plan;<\/p>\\n<p>h.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; The Agent Software shall be protected with appropriate security solutions which shall include, at a minimum, a firewall, intrusion prevention systems, bot protection, web application firewall and DDOS protection;<\/p>\\n<p>i.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; The Agent Software and operating infrastructure shall be appropriately protected against malware infections, monitored for security vulnerabilities, and regularly patched with the latest available security patches and updates to maintain a defined level of security hygiene and malware protection that is at least industry standard;<\/p>\\n<p>j.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Agent shall perform relevant and applicable mandatory security clearances and background verification and criminal record checks during the recruitment of employees; and<\/p>\\n<p>k.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Agent shall conduct security due diligence and assessment on a periodic basis on any contractors and third\u002Dparty suppliers, and shall require any contractors or third\u002Dparty suppliers that have access to the Agent Software or Etihad Data to sign confidentiality and data protection agreements no less protective of Etihad Data than the provisions of this Section 6.<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; iv.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; PCI\u002DDSS Compliance: Agent will comply with the current Payment Card Industry Data Security Standard, and VISA, MasterCard and any other applicable payment card network bylaws, rules and operating regulations and applicable laws or regulations regarding the collection, storage, use and sharing of Etihad Data, including without limitation (1) creation and maintenance of a secure network to protect cardholder data; (2) use of all technical and procedural measures reasonably necessary to protect cardholder data it maintains or controls; (3) creation and implementation of secure measures to limit access to cardholder data; (4) monitoring access to cardholder data it maintains or controls; and (5) creation and implementation of an information security policy that ensures Agent personnel compliance with the foregoing. Agent accepts responsibility for the security of payment card data, cardholder data, or sensitive authentication data processed on behalf of Etihad. Agent represents and warrants ongoing compliance with the most current Payment Card Industry Data Security Standard and shall provide certification of compliance with this requirement upon request from Etihad.<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; v.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Remediation: Following any Security Incident, Agent must notify Etihad within 48 hours of becoming aware of the Security Incident. Agent and Etihad will work in good faith regarding remediation efforts that may be necessary and reasonable. At Etihad’s sole discretion, Agent shall (i) either undertake remediation efforts for a Security Incident at its sole expense and in line with security best practices or reimburse Etihad for Etihad’s reasonable costs and expenses in connection with taking remediation efforts for a Security Incident and (ii) provide assurances satisfactory to Etihad that such Security Incidents will not recur. Agent shall indemnify and hold harmless Etihad and its officers and employees from and against any and all allegations, claims, demands, costs, expenses (including attorneys\x27 fees and disbursements), losses, liabilities, penalties, fines, settlements or damages arising out of or relating to any Security Incident that occurs in relation to Etihad Data that was in the possession or control of Agent or Agent’s employees or contractors at the time of the Security Incident. “<b>Security Incident<\/b>” means (i) the loss, misappropriation or misuse (by any means) of Etihad Data; (ii) the inadvertent, unauthorized, and \/ or unlawful processing, distribution, alteration, corruption, sale, rental, or destruction of Etihad Data; or (iii) any other act or omission that compromises or threatens to compromise the security, confidentiality, or integrity of Etihad Data.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>p)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; \x26nbsp;<b>Agent Incentive, Promotional, Override, Private and Corporate Programmes<\/b><\/p>\\n<p>Agent shall comply with Etihad’s Rules, Policies and any specific contractual requirements concerning agency incentives, promotions, overrides or Private and Corporate Fares with Etihad in which Agent participates or has an interest. Etihad’s incentives, promotions, overrides or Private and Corporate Fares are determined in Etihad’s sole discretion. Failure to comply subjects Agent to (1) forfeiture and repayment to Etihad of all sums paid by Etihad to Agent or the value received by Agent, (2) suspension, limitation or termination of Agent’s right to participate in or receive all or a part of any agency incentives, promotions, overrides or Private and Corporate Fares and (3) suspension, limitation or termination of Agent’s Appointment.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>q)\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; \x26nbsp;Miscellaneous<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; i.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Prior Agreements: This Agreement supersedes any prior version of this Addendum between Etihad and Agent.<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; ii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Waiver: Any waiver or modification of any of the terms of this Addendum must be in writing from Etihad. Etihad may amend or modify this Addendum at any time. Agent agrees that failure of or delay by Etihad to require strict performance or to enforce any provision of this Addendum, or a previous waiver or forbearance by Etihad, will in no way be construed as, or constitute, a continuing waiver by Etihad of any Rule or any provision of this Addendum.<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; iii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Severability: IN THE EUROPEAN UNION, THE GOVERNING LAW WILL BE THE LAW OF THE COUNTRY IN WHICH THE AGENT IS LOCATED, AND EACH OF AGENTS HEREBY SUBMITS AND CONSENTS TO THE EXCLUSIVE JURISDICTION OF THE COURTS OF SUCH COUNTRY FOR ALL DISPUTES;<\/p>\\n<p>(d)\x26nbsp;\x26nbsp;\x26nbsp; FOR AGENTS LOCATED IN ANY COUNTRY OTHER THAN THOSE COVERED BY SUBSECTIONS (I) TO (IV), THE GOVERNING LAW WILL BE THE LAWS OF ENGLAND AND WALES, AND EACH OF SUCH AGENTS HEREBY SUBMITS AND CONSENTS TO EXCLUSIVE JURISDICTION OF THE HIGH COURT OF LONDON FOR ALL DISPUTES.<\/p>\\n<p>(e)\x26nbsp;\x26nbsp;\x26nbsp; AGENT WAIVES ANY CLAIM OF LACK OF JURISDICTION OR FORUM NON CONVENIENS.<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2209\u002D07\u002D2026\x22}],\x22defaultsortoption\x22:\x22mostrecent\x22,\x22dropdownlabel\x22:\x22Sort by\x22,\x22dateFormatLang\x22:\x22false\x22,\x22dropdownValueText\x22:\x22Select\x22,\x22alphabeticalSortLabel\x22:\x22Alphabetical (A\u002DZ)\x22,\x22isDefaultSortEnabled\x22:\x22false\x22,\x22monthTransaltion\x22:[{\x22value\x22:\x22January\x22,\x22key\x22:\x221\x22},{\x22value\x22:\x22February\x22,\x22key\x22:\x222\x22},{\x22value\x22:\x22March\x22,\x22key\x22:\x223\x22},{\x22value\x22:\x22April\x22,\x22key\x22:\x224\x22},{\x22value\x22:\x22May\x22,\x22key\x22:\x225\x22},{\x22value\x22:\x22June\x22,\x22key\x22:\x226\x22},{\x22value\x22:\x22July\x22,\x22key\x22:\x227\x22},{\x22value\x22:\x22August\x22,\x22key\x22:\x228\x22},{\x22value\x22:\x22September\x22,\x22key\x22:\x229\x22},{\x22value\x22:\x22October\x22,\x22key\x22:\x2210\x22},{\x22value\x22:\x22November\x22,\x22key\x22:\x2211\x22},{\x22value\x22:\x22December\x22,\x22key\x22:\x2212\x22}]}}");

        <script type="text/javascript">
           
            function loadPromotionIntcid(cb) {
                
                var links = document.querySelectorAll('.promotion-link a');

                if (window.digitalData
                    && window.digitalData.page
                    && window.digitalData.page.pageInfo
                    && typeof window.digitalData.page.pageInfo.pageInternalCampaignCode == "object") {
                    for (var i = 0; i < links.length; i++) {
                        if (links[i]
                            && links[i].hasAttribute('data-intcid')
                            && links[i].getAttribute('data-intcid') != "") {
                            window.digitalData.page.pageInfo.pageInternalCampaignCode.push(links[i].getAttribute('data-intcid'));
                        }
                    }
                    if (typeof cb == "function") {
                        cb();
                    }
                }
            }
       
            let digitalDataObj = {
	 		"user": {
					/*"userDetail": {
						"ffpIdHash": '',
						"emailIdHash": '',
						"guestTier": '',
						"etihadGuestID": ''
					}*/
					"userDetail": {
						"ffp": '',
						"email": '',
						"eliteTierName": '',
						"etihadGuestID": ''
					},
					loginStatus:'anonymous',
					loginMessage: ''
				}
			};
			
			 window.addEventListener('load', function () {
					loadPromotionIntcid(function () {
						createAnalyticsData();
					});
				});
            
            const updateDigitalDataValues = (setIntervalForLoginCookie, isLoginFlow = false,sessionObject) => {
					if (isLoginFlow) {
						if (Object.keys(sessionObject).length !== 0) {
							/* Populate digital data for logged in user */
							/*digitalDataObj.user.userDetail.ffpIdHash = sessionObject.ffp;
							digitalDataObj.user.userDetail.emailIdHash = sessionObject.email;
							digitalDataObj.user.userDetail.guestTier = sessionObject.eliteTierName;*/
							
							digitalDataObj.user.userDetail.ffp = sessionObject.ffp;
							digitalDataObj.user.userDetail.email = sessionObject.email;
							digitalDataObj.user.userDetail.eliteTierName = sessionObject.eliteTierName;
							digitalDataObj.user.userDetail.etihadGuestID = sessionObject.etihadGuestID;
							digitalDataObj.user.loginStatus = sessionObject.errCode === '' ? 'logged-in' : '';
							digitalDataObj.user.loginMessage = sessionObject.errCode;
							if (setIntervalForLoginCookie) {
								window.digitalData = window.digitalData || {};
								window.digitalData.user = Object.assign(window.digitalData.user, digitalDataObj.user);
								let launch_event = document.createEvent('CustomEvent');
								launch_event.initCustomEvent('aa_page_view', true, true, window.digitalData);
								document.body.dispatchEvent(launch_event);
								return true;
							}
						}
					} else {
						window.digitalData = window.digitalData || {};
						window.digitalData.user = Object.assign(window.digitalData.user, digitalDataObj.user);
						let launch_event = document.createEvent('CustomEvent');
						launch_event.initCustomEvent('aa_page_view', true, true, window.digitalData);
						document.body.dispatchEvent(launch_event);
						if (setIntervalForLoginCookie) {
							return true;
						}
					}
						
				}
			let createAnalyticsData = () => {
				const cookieName = window.configValues && window.configValues.guestLoginAppHashCookieNameV2
					? window.configValues.guestLoginAppHashCookieNameV2
					: null;
				let sessionObject = JSON.parse(sessionStorage.getItem('loginAnalyticsData'));


				let intervalCount = 1;
				const maxIntervalCount = 10;
				const hashVal = window.location.hash.substring(1);
				const setLoginTimeInterval = () => {
					const setIntervalForLoginCookie = setInterval(() => {
						let clearTimeInterval = false;
						if (sessionObject === null || sessionObject === undefined ) {
							sessionObject = JSON.parse(sessionStorage.getItem('loginAnalyticsData'));

						}
						if (intervalCount > maxIntervalCount) {
							/* push digitalData to window with anonymous user info and dispatch */
							 clearTimeInterval = updateDigitalDataValues(setIntervalForLoginCookie, false, sessionObject);

						} else if (document.cookie.match(RegExp('(?:^|;\\s*)' + cookieName + '=([^;]*)')) !== null && sessionObject !== null && Object.keys(sessionObject).length !== 0) {
							/* push digitalData to window with logged in user info */
							 clearTimeInterval = updateDigitalDataValues(setIntervalForLoginCookie, true, sessionObject);
						}
						if (clearTimeInterval) {
								clearInterval(setIntervalForLoginCookie);
							}
						intervalCount = intervalCount + 1;
					}, 1000);
				}
				/* check if query / hash parameter is present in the URL */
				if (location.search.indexOf('initiateLogin=true') >= 0 || hashVal.includes('initiateLogin=true')) {
					setLoginTimeInterval();
				} else {
					if (document.cookie.match(RegExp('(?:^|;\\s*)' + cookieName + '=([^;]*)')) !== null) {
						/* push digitalData to window with logged in user info */
						setLoginTimeInterval();
					} else {
						/* push digitalData to window with default anonymous user info and dispatch */
						updateDigitalDataValues(null, false, sessionObject);
					}
				}

			
			}
        </script>
