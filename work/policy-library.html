lign: center;\\\x22>To\/from Bali (DPS)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Bali (DPS)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Malaysia<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Kuala Lumpur (KUL)<\/p>\\n<p style=\\\x22text\u002Dalign: center;\\\x22>(only trained service dogs below 8 kg are permitted)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Maldives<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Male (MLE)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Male (MLE)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>South Africa<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Johannesburg (JNB)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Johannesburg (JNB)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Spain<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Palma di Mallorca (PMI)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Taiwan<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Taipei (TPE)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To Taipei (TPE)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To Taipei (TPE)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Thailand<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Krabi (KBV)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Krabi (KBV)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Krabi (KBV)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>UK<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To all stations<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>USA<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To all stations<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Vietnam<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Hanoi (HAN)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Hanoi (HAN)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Hanoi (HAN)<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p><b>Special requirements:<\/b><\/p>\\n<p><b>\x26nbsp;<\/b><\/p>\\n<p><b>1.\x26nbsp;\x26nbsp;\x26nbsp; Malaysia:<\/b><\/p>\\n<p>For guests travelling with Pets (PETC) and service dogs to\/from Malaysia, the below conditions apply:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Only small size pets and service dogs (up to 8kg) are permitted<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Pets and service dogs must always be kept in a cage<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Airport authorities reserve the right to stop pets and service dogs from passing through the airport terminal if they display inappropriate behavior<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>2.\x26nbsp;\x26nbsp;\x26nbsp; Bahrain:<\/b><\/p>\\n<p>Bahrain airports will only accept pets that do not exceed 6Kg (including the carrier)<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>3.\x26nbsp;\x26nbsp;\x26nbsp; Ireland:<\/b><\/p>\\n<p>Pre\u002Dnotification of any PETC into Ireland must be sent at least 24 hours in advance of arrival\x26nbsp;via email to\x26nbsp;<a href=\\\x22mailto:petmove@agriculture.gov.ie\\\x22 target=\\\x22_blank\\\x22>petmove@agriculture.gov.ie<\/a>.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>To book, please contact Etihad Cargo:<\/p>\\n<p>Email: <a href=\\\x22mailto:LiveAnimals@etihad.ae\\\x22>LiveAnimals@etihad.ae<\/a><\/p>\\n<p>Phone: 800 2535 (within UAE) \/ +971 2 599 0099 (overseas)<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>b)\x26nbsp;\x26nbsp;Service Animals (dogs only):<\/b><\/p>\\n<p>This policy is applicable to service animals. A service animal is defined as a dog, regardless of breed or type, which is individually trained to do work or perform tasks for the benefit of a qualified individual with a disability, including a physical, sensory, psychiatric, intellectual, or other mental disability.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>The following are not considered as service animals:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>1.\x26nbsp;\x26nbsp;\x26nbsp; Animal species other than dogs<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>2.\x26nbsp;\x26nbsp;\x26nbsp; Emotional support animals<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>3.\x26nbsp;\x26nbsp;\x26nbsp; Comfort animals<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>4.\x26nbsp;\x26nbsp;\x26nbsp; Companionship animals<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>5.\x26nbsp;\x26nbsp;\x26nbsp; Service animals in training<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Service animals will be accepted free of charge only if they are certified by ADI or IGDF accredited organizations. Only exceptions are guests travelling to\/from the USA due to legal requirements.<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Trained service animals must be trained to behave properly in public. The dog must be harnessed, leashed or tethered at all times. They will not be accepted in the cabin if they display any form of disruptive behaviour which may include:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Growling<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Biting<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Jumping on other guests or staff<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Relieving at the gate or cabin<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Causing damage to the cabin e.g. eating of the seatback<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Guest must request and provide necessary documents to the Contact Centre no later than 48 hours prior to intended travel<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; There is no weight limitation for service animal except for Malaysia (up to 8kg)<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; The carriage of a service animal in the cabin is permitted on direct EY routes to, from and via Abu Dhabi (i.e. direct transfer)<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; It is permitted for a passenger to travel with one (1) service animal in the cabin<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; On any flight with falcon(s) travelling in the cabin, a service animal shall not travel in the same travel class as the falcon(s)<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; The guest shall provide an absorbent mat to be placed on the floor where the animal will be located and sufficient additional material for the duration of the flight(s) and, where applicable, transfer time<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Where possible, the guest travelling with a service dog should be allocated a bulkhead row and a window seat. Seat will be provided free of charge for a guest travelling with a service animal (SSR SVAN). A guest travelling with a service dog must not be seated in any of the following locations:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Emergency exit rows<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; One row forward and aft of over\u002Dwing exit rows<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Service dogs shall remain leashed, harnessed, or otherwise tied at all times.\x26nbsp;<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; There is no charge for the carriage of a service animal in the cabin<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<div><b>\x26nbsp;Pets and\x26nbsp;Service Animals<\/b><\/div>\\n<p>Details are available on the ey.com website. Alternately, guests can call the Contact Centre to enquire regarding travel with a pet or service animal.<\/p>\\n<p>Upon receiving a request for carriage of pet in cabin, Guest Contact Centre shall ask some qualifying questions to the guest due to restrictions which may disqualify the carriage of the animal. If any of the below requirements are not met, the guest shall immediately be advised that their animal does not meet the requirements for carriage and to contact Cargo Contact Centre (CCC).<\/p>\\n<p>i.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Is the animal a trained service dog? If yes, then the Live Animal in Cabin Information Form must be sent to the guest.<\/p>\\n<p>ii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; For pet cats and dogs, is the animal aged over 16 weeks? If no, then the pet will be rejected (not applicable to service animals)<\/p>\\n<p>iii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; What is the breed of the pet? If the breed is on banned list, then the pet will be rejected (not applicable to service animals)<\/p>\\n<p>iv.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; What is the weight of the pet including the container? If more than 8 kg, the pet will be rejected (not applicable to service animals except for Malaysia)<\/p>\\n<p>v.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; What are the dimensions of the pet container? (not applicable to service animals)<\/p>\\n<ul>\\n<li>Economy: if more than 40 x 40 x 22 (L x W x H), the pet will be rejected.<\/li>\\n<li>Business: if more than 50 x 43 x 50 cm (L x W x H), the pet will be rejected.<\/li>\\n<\/ul>\\n<p>If the above conditions are satisfied, Contact Centre staff will provide the guest with:<\/p>\\n<p>1.\x26nbsp;\x26nbsp;\x26nbsp; Live Animal in Cabin <a href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/forms\/pets\u002Dbooking\u002Dform\\\x22 target=\\\x22_blank\\\x22>Information Form<\/a><\/p>\\n<p>2.\x26nbsp;\x26nbsp;\x26nbsp; <a href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/forms\/pets\u002Dbooking\u002Dform\\\x22 target=\\\x22_blank\\\x22>Application Form<\/a> for Trained Service Dog in Cabin (except where the itinerary includes a flight to and\/or from the US)<\/p>\\n<p>The guest must be advised to email the completed form with the supporting documents to <a href=\\\x22mailto:ContactCentre@etihad.ae\\\x22>ContactCentre@etihad.ae<\/a>, no later than 5 days prior to intended travel.<\/p>\\n<p><b>\x26nbsp;<\/b><\/p>\\n<p><b>Supporting documents:<\/b><\/p>\\n<p>i.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Pet microchip number \u002D must be completed prior to rabies vaccination.<\/p>\\n<p>ii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Health Certificate – to be signed by origin approved\/government Veterinarian.<\/p>\\n<p>iii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Fit to travel certificate \u002D from local vet within 10 days of travel.<\/p>\\n<p>iv.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Vaccination certificate with all vaccines and treatments administrated containing vaccine name, manufacture, batch number, vaccination date, vaccine labels etc.<\/p>\\n<p>v.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Rabies vaccine \u002D depending on local regulations this will be done either 21 or 30 days (EU 21 days and other countries 30 days) (shall be 12 weeks when vaccine administrated).<\/p>\\n<p>vi.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; RNATT (Rabies blood titer test) – applicable for high rabies countries as classified by destination country (some countries may have a waiting period).<\/p>\\n<p>vii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Internal and External Parasites treatment.<\/p>\\n<p>viii.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Screwworm \/ tapeworm treatment.<\/p>\\n<p>ix.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Export permit – not applicable for all countries.<\/p>\\n<p>x.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Import Permit – not applicable for all countries.<\/p>\\n<p>xi.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; COVID\u002D19 PCR test – not applicable for all countries.<\/p>\\n<p>Once a guest\x27s submitted documents are accepted and travel is approved, Cargo A\x26amp;S will notify the contact centre to update the guest\x27s PNR and SSR PETC.<br>\\n<\/p>\\n<p>An Electronic Miscellaneous Document (EMD) or Extra Seat for Cabin Baggage (CBBG) will be issued as applicable.<br>\\n<\/p>\\n<p>Where Abu Dhabi is a guest\x27s final destination, the UAE Health Certificate must be signed and stamped by a government\u002Daccredited health official in their country of departure within five (5) days before their flight.<\/p>\\n<p>For all other destinations, guests must complete all arrival formalities according to local regulations.<\/p>\\n<p>Where the documents submitted are acceptable and travel is permitted in accordance with the requirements of the applicable countries, Cargo A\x26amp;S will notify the Contact Centre with an ‘OK 2 Accept’ email..<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Note<\/b>: For arrivals into the UAE, the animal’s health certificate needs to be stamped by a government\u002Daccredited health official in the country of departure within 24 hours prior to departure; therefore, PETC can be confirmed without the document being provided. Contact Centre staff shall inform the guest that it is a requirement for this signed and stamped form to be carried by the guest and presented at the airport. The 24\u002Dhour requirement is applicable for arrivals into AUH (not applicable to transfer between flights at AUH). Individual destination country requirements shall also apply. A fillable and printable PDF version of the form is available on the Etihad.com.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Anyone travelling to Abu Dhabi with a pet or service dog must obtain an Abu Dhabi Customs Bill of Entry document at least 24 hours before their departure. To receive it, you need to submit the following documents to NOATUM\x26nbsp;Logistics:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D UAE residents: Emirates ID copy<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Non\u002Dresidents: passport copy\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D An import permit for your pet or service dog\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Your mobile number\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D A copy of your reservation or ticket<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>NOATUM\x26nbsp;Logistics will review your information and email you the Bill of Entry, which costs AED 365.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>How much does it cost?<\/b><\/p>\\n<p>The rates for carrying a pet cat or dog:\x26nbsp;<\/p>\\n<p><b>Economy<\/b><\/p>\\n<ul>\\n<li><p>It costs USD 399 or 50,000 Etihad Guest Miles for each way to travel with a cat or dog in Economy<\/p>\\n<\/li>\\n<li><p>If guests are transiting, the combined price of USD 798 or 100,000 Etihad Guest Miles will apply<\/p>\\n<\/li>\\n<li><p>If an adjacent seat booking is requested, it must be done in advance, and guests will be charged for the cost of an extra seat plus USD 399 each way<\/p>\\n<\/li>\\n<li><p>If an additional seat is purchased for a pet, then guests are entitled to the additional check baggage allowance associated with the purchased seat<\/p>\\n<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p><b>Business<\/b><br>\\n<\/p>\\n<ul>\\n<li><p>As there is no space available under the seat, guests must purchase an extra seat for their pet<\/p>\\n<\/li>\\n<li><p>This must be booked in advance and the guest will be charged for the cost of an extra seat plus USD 399 each way<\/p>\\n<\/li>\\n<li><p>Guests are entitled to the additional check baggage allowance associated with the purchased seat<\/p>\\n<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p>To pay using Etihad Guest Miles, please <a href=\\\x22https:\/\/www.etihad.com\/en\/help\/contact\u002Dus\\\x22 target=\\\x22_blank\\\x22>call us<\/a>.\x26nbsp;\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>c) Falcons in Cabin<\/b><\/p>\\n<p><b>Conditions of acceptance<\/b><\/p>\\n<p>Etihad Airways accepts the carriage of\x26nbsp;falcons\x26nbsp;in the passenger cabin for free on all types of aircraft, subject to the following conditions:\x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp;\x26nbsp; \x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D A valid health certificate and any entry permits required by countries of entry and transit must accompany falcons<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Falcons shall be carried in the passenger cabin at the owner’s risk.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Falcons must always be hooded and a chain or a rope must be attached to their legs in the passenger cabin or in the vicinity of other passengers in the terminal building etc.\x26nbsp;\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The maximum number of falcons carried on any one flight should not exceed 15 on all aircrafts.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The maximum journey time must not be more than 17 hours (including transit).\x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; \x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Seats are allocated in the last row of the cabin of the ticketed class. If passengers are travelling in groups, they must be seated together. A window seat in the last row must be used for a single passenger with a falcon.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The falcons and perches are to be placed on the floor area in front of the seat. Plastic sheets should be used to cover the floor area under the falcons and over the adjacent seat. Falcons are not to be placed on the seats. Etihad Airways shall not provide perches. The falcon handler must arrange them.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Often VIPs travel in groups, where a number of falcons are carried, accompanied by their handlers. Below seating procedure shall apply to the handler(s) and the falcon(s).\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x220\\\x22>\\n<tbody><tr><td width=\\\x22150\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>CLASS<\/b><\/p>\\n<\/td>\\n<td width=\\\x22600\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Description<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22150\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>\x26nbsp; First\/ Business<\/b><\/p>\\n<\/td>\\n<td width=\\\x22514\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\x26nbsp; Two falcons per guest (per seat) are permitted<\/p>\\n<p style=\\\x22text\u002Dalign: center;\\\x22>\x26nbsp; Three additional falcons can be carried for every extra seat paid for<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22150\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>\x26nbsp; Economy<\/b><\/p>\\n<\/td>\\n<td width=\\\x22514\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\x26nbsp; One falcon per guest (per seat) is permitted<\/p>\\n<p style=\\\x22text\u002Dalign: center;\\\x22>\x26nbsp; Two additional falcon may be carried for every extra seat paid for<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D No extra charges apply for carriage of falcons in cabin<\/p>\\n<p><b>Special requirements:<\/b><\/p>\\n<p>Falcons are not\x26nbsp;permitted\x26nbsp;for carriage to\x26nbsp;Casablanca (CMN)\x26nbsp;unless the guest is in possession of a letter of\x26nbsp;authorisation\x26nbsp;issued by the Moroccan Ministry of Agriculture.\x26nbsp;<\/p>\\n<p>When accepted under this exemption, the following documents must be presented:<\/p>\\n<p>\x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp;1. Valid Health Certificate<\/p>\\n<p>\x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp;2. Falcon Passport<\/p>\\n<p>\x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp;3. The Falcon Passport Number must correspond to the same number referenced in the\x26nbsp;authorisation\x26nbsp;letter issued by the Ministry.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>a) Without an extra seat –<\/b><br>\\n<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Create a PNR with the guest’s name and update with SSR FALC.<br>\\n<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The SSR FALC is auto confirmed or declined based on the maximum number of falcons onboard. Once the request is confirmed, travel agents must inform the guest so they can make the necessary arrangements to bring their falcon with them.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>b)\x26nbsp; With an extra seat (EXST)\x26nbsp;–<\/b><br>\\n<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D SSR FALC should be added to the booking accordingly.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D When extra seats are booked, accompanying guests and falcons must be seated together by the Flight Editing team, who will block the last row in each cabin so that these seats are not pre\u002Dassigned.<br>\\n<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D For ticketing, refer to the EXTRA SEAT (EXST) ticketing policy.<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>2) Animal as checked baggage in cargo hold (AVIH)<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Etihad Airways accepts the carriage of\x26nbsp;falcons in the cargo hold compartment provided that all the necessary health documents and important licenses have been obtained. All other pets are acceptable only as manifested cargo.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guide dogs have to be imported into AUH as manifested cargo only, except from USA. However they may be exported as checked baggage free of charge.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Conditions of Carriage<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D AVIH is not permitted within the cargo holds of the A340 (except for flights to\/from USA), A319, and A320.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D For countries known to prohibit the import\/export of animals and birds as checked baggage, please refer to TIMATIC\/ Embassy concerned.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D All animals and birds should travel as manifested cargo via countries that do not allow the importation of animals as checked baggage.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guest must be informed that these animals must be cleared at the cargo terminal upon arrival where they shall be examined by local veterinarian after producing the relevant import and health certificates.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The guest is responsible for providing all the applicable health documents, declarations and permits as required by governmental regulations of the country to which the pet is to be carried. Container Requirements: Containers used to carry live pets must be clean, leak\u002Dproof and escape proof, soundly constructed and in good condition. The size of the container must not exceed the following measurements\/dimensions: 135\x26quot; length x 35\x26quot; width x 50\x26quot; height.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Containers for falcon should allow the pet to stand comfortably.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Containers for guide dogs to lead the blind or deaf should allow the pet to stand comfortably lie down with paws outstretched and turn around.<\/p>\\n<p>Full details of exact container requirements are clearly set out in the IATA Live Animals Regulations manual (LAR section 4). Of particular importance are the restrictions on the size and amount of pets that can be loaded into a container. Specific instructions regarding these limitations are detailed in the IATA Live Animals Regulations manual (LAR) and must be enforced to prevent injury or fatalities to any animal.<\/p>\\n<h4>\x26nbsp;<\/h4>\\n<h4>Role of Reservations \x26amp; ticketing agents<\/h4>\\n<p>Brief the guest on conditions of carriage mentioned above.<\/p>\\n<h4>\x26nbsp;<\/h4>\\n<h4>Carriage of falcons<\/h4>\\n<ul>\\n<li>Update the SSR AVIH with the number of falcon details<\/li>\\n<li>Issue an Electronic Miscellaneous Document EMD for “Falcon in Hold” USD 500 is charged per cage per single journey (including transit, if any)<\/li>\\n<\/ul>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>E.g.: Bahrain\u002DAbu Dhabi\u002DCasablanca will cost USD 500, the return flight Casablanca \u002DAbu Dhabi\u002DBahrain, will be an additional USD 500. Therefore, guest is charged a total of USD 1000 for the entire trip.<\/p>\\n<h4>\x26nbsp;<\/h4>\\n<h4>Carriage of guide dogs<\/h4>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Update the SSR AVIH details in the PNR with applicable details:<\/p>\\n<ul>\\n<li>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;Specify number, type and pedigree<\/li>\\n<li>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;The type of pet (DOG) and breed<\/li>\\n<li>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;The weight and dimensions of the container (Note: these are added as SSR OTHS)<\/li>\\n<\/ul>\\n<p>Note: SSR is updated for information only. The documents and cage will\x26nbsp;be inspected at airport check\u002Din. Carriage may be rejected if the conditions of carriage are not followed.<\/p>\\n<p>For more detailed information refer to the Cargo Services Manual or contact the cargo department.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>3)\x26nbsp;\x26nbsp;\x26nbsp; Manifested cargo<\/b><\/p>\\n<p>All animals other than the above mentioned, can be transported on Etihad Airways, only as manifested cargo. Guests have to contact Etihad Crystal Cargo\x26nbsp;minimum 4 working days\x26nbsp;prior to departure for the carriage of animals (other than Falcons and Guide dogs to lead the blind or deaf).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Cargo Contact<\/b> (in UAE)<\/p>\\n<p>Email:\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; \x26nbsp;<a href=\\\x22mailto:cargocs@etihad.ae\\\x22>cargocs@etihad.ae<\/a><u><\/u><\/p>\\n<p>UAE (Toll Free):\x26nbsp;\x26nbsp;\x26nbsp; 8002535<\/p>\\n<p>International:\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; 009712\u002D5091222<\/p>\\n<p>For out stations:\x26nbsp; Contact local Etihad cargo offices<\/p>\x22,\x22lastmodified\x22:\x2224\u002D08\u002D2026\x22},{\x22heading\x22:\x22Etihad Shuttle\x22,\x22description\x22:\x22<p>Economy and Business Value guests can use our Etihad Shuttle service to travel between Abu Dhabi airport, Dubai and Al Ain.<\/p>\\n<p>The city code for Al Ain Etihad Airways Shuttle service is ZVH.<\/p>\\n<p>The code AAN will be used solely for Al Ain International Airport.<\/p>\\n<p>The Dubai pick up and drop off location of our Etihad Shuttle service to and from Abu Dhabi airport is nearby Al Wasl Centre at the back of the New Safestway Supermarket, Sheikh Zayed Road entrance.<\/p>\\n<p>The Al Wasl Centre is located in the heart of Dubai and close to the city\x27s major attractions. The trip takes about 75 minutes.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Note:<\/b><\/p>\\n<p>1. Etihad Shuttle services may be affected by adverse weather conditions, and may be delayed or cancelled following directives from the government.<\/p>\\n<p>2.\x26nbsp;An Etihad Shuttle segment can be added to an existing itinerary and must be reserved at least 24 hours prior to departure.<\/p>\\n<p>3. The complimentary shuttle applies to guests holding Economy and Business Value fares.<\/p>\\n<p>4.\x26nbsp;Complimentary Shuttle Service can now be booked via Etihad.com.<\/p>\\n<p>5. If required, alternative transport should be arranged at the passenger’s own cost.<\/p>\\n<p>6. Etihad will not be liable if passengers miss their flight due to these last\u002Dminute changes.<\/p>\\n<p>7. Etihad Shuttle services are provided by contracted third party suppliers. Etihad Airways shall not be responsible for the acts or omissions of such suppliers, nor for any deficiency in the facilities and services offered. In particular, Etihad has no liability for loss, personal injury or death incurred during the use of such facilities and services unless such loss, personal injury or death is \/ are caused solely by Etihad Airways’ negligence.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>This is a free service.\x26nbsp; Advance bookings are required.\x26nbsp;<b><a href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/plan\u002Dand\u002Dbook\/book\u002Detihad\u002Dexpress\/\\\x22 target=\\\x22_blank\\\x22>Book now<\/a>.<\/b><\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2206\u002D07\u002D2026\x22},{\x22heading\x22:\x22Unaccompanied Minors, Accompanied Minors \x26 Younger Passengers (UMNR)\x22,\x22description\x22:\x22<p>When children between\x26nbsp;5 and 11 years\x26nbsp;of age travel alone, we call them “Unaccompanied Minors”\x26nbsp;(UM), and they are entitled to our\x26nbsp;UM\x26nbsp;service.\x26nbsp;<\/p>\\n<p>For an additional fee, you can request the\x26nbsp;UM\x26nbsp;service for children between 12 and 17 years of age. To request this service, parents or guardians must complete the online\x26nbsp;<a href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/manage\/special\u002Dassistance\/unaccompanied\u002Dminors\/umnr\u002Dform\\\x22 target=\\\x22_blank\\\x22>Unaccompanied Minors booking form<\/a>.\x26nbsp;\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Unaccompanied Minors (aged 5\u002D11 years)<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>1.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Children aged between 5 and 11 years old are considered to be Unaccompanied Minors (UM).\x26nbsp;\x26nbsp;<\/p>\\n<p>2.\x26nbsp; \x26nbsp; \x26nbsp; Children under the age of 5 will not be accepted as an unaccompanied minor.<\/p>\\n<p>3.\x26nbsp; \x26nbsp; \x26nbsp;\x26nbsp;Our Unaccompanied Minor service is free for children aged 5 to 11 as long as:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D They are booked on a normal published adult fare<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Booking is created with PTC \x26nbsp;(passenger type code) – UNN<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D This service has been pre\u002Dbooked before arriving at the airport.\x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp;\x26nbsp;<\/p>\\n<p>If the service has not been arranged in advance, a fee will apply at the airport.<\/p>\\n<p>4.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Occasionally, it may not be appropriate for children with special needs to travel unescorted if the level of care which they require exceeds that which our crew are able to provide. Cabin crew are not permitted to assist in the toilet, administer a guest\x27s medication or feed guests.<br>\\n<\/p>\\n<p>5.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; The Unaccompanied Minor must be escorted to the airport and met on arrival by the parent or guardian mentioned on the UM form.<\/p>\\n<p>6.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; The parent or guardian must be present with the child at check\u002Din and ensure that the child has all of the relevant forms and documents to travel alone. Check\u002Din must be completed at least two hours before your child’s flight.<\/p>\\n<p>7.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Unaccompanied Minors are permitted to travel on connecting flights operated by Etihad Airways, provided that the transit time does not exceed 8 hours.<\/p>\\n<p>8.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Travel on itineraries involving other airlines is not permitted for Unaccompanied Minors. All flights must be operated by Etihad Airways.<\/p>\\n<p>9.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Unaccompanied Minors with medical conditions shall be accepted after obtaining medical clearance from Etihad Airways Medical Centre (EAMC).<\/p>\\n<p>10.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Unaccompanied Minors are not permitted to sit in emergency exit row seats.<\/p>\\n<p>11.\x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp;Unaccompanied Minors travelling from Abu Dhabi are not eligible to be checked in from Abu Dhabi and Dubai city terminals.<\/p>\\n<p>12.\x26nbsp; \x26nbsp; \x26nbsp; Etihad Chauffeur and coach services are not provided to Unaccompanied Minors.<\/p>\\n<p>13.\x26nbsp; \x26nbsp; \x26nbsp; Unaccompanied Minors travelling in premium cabins (First or Business) or those eligible for lounge access via an Etihad Guest tier, may not be able to use the lounges in airports other than Abu Dhabi. If the lounge is not operated by Etihad Airways, we cannot guarantee supervision and the level of care, and therefore we may require the guest to report back to the check\u002Din area at a nominated time and be escorted directly to the boarding gate, without lounge access.<\/p>\\n<p>14.\x26nbsp; \x26nbsp; The Transit Lounge is available for all departing and transiting Unaccompanied Minors at Terminal A (Zayed International Airport Abu Dhabi).<\/p>\\n<p>15.\x26nbsp; \x26nbsp; An Unaccompanied Minor form must be completed in full prior to travel on Etihad Airways operated flights.<\/p>\\n<p>16.\x26nbsp; \x26nbsp; At least one copy of the completed and signed Unaccompanied Minor form must be taken to the airport on the day of departure.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Accompanied Minors in different cabins<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Children travelling with parents or guardians on the same flight but in different cabins (for instance, parents travelling in Business and children in Economy), will be considered as \x27Accompanied Minors\x27 and treated as \x27Unaccompanied Minors\x27 on board the aircraft.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>1.\x26nbsp;\x26nbsp;Unaccompanied Minors form is not required.<\/p>\\n<p>2. The age criteria of our Unaccompanied Minors policy will apply.\x26nbsp;\x26nbsp;Children under the age of 5 will not be accepted as an accompanied minor.<\/p>\\n<p>2. Accompanied Minors are permitted to travel on a child fare ticket.<\/p>\\n<p>3. The parent or guardian must handle all travel documents for the\x26nbsp;Accompanied Minor.<\/p>\\n<p>4. Guests are requested to limit their visits between cabins during the journey.<\/p>\\n<p>5.\x26nbsp; If known in advance, update the child’s booking with “SSR OTHS 1A CHD TRVLNG WZ PARENTS IN DIFFERENT CABIN PNR ABCDE”<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Young Passengers (aged 12\u002D17 years)<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>1.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Young Passengers (YP) between the ages of 12 and 17 are able to travel unaccompanied.<\/p>\\n<p>2.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Young Passengers may request our Unaccompanied Minor service for a fee. This service costs US $100 each way on direct flights or US $150 each way for journeys which involve connecting flights.<\/p>\\n<p>3.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Young Passengers are permitted to travel on connecting flights operated by Etihad Airways, provided that the transit time does not exceed 8 hours. Travel on itineraries involving other airlines is not permitted for Unaccompanied Minors. All flights must be operated by Etihad Airways.<\/p>\\n<p>4.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; The Young Passengers Fee applies to all single journeys (inbound and outbound) and is non\u002Drefundable.<\/p>\\n<p>5.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Occasionally it may not be appropriate for Young Passengers with special needs to travel unescorted if the level of care which they require exceeds that which our crew are able to provide. Cabin crew are not permitted to assist in the toilet, administer a guest\x27s medication or feed guests.<\/p>\\n<p>6.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Guests between the ages of 12 and 17 years are not permitted to escort an Unaccompanied Minor. However, legal parents below the age of 18 will be permitted to accompany infants or children with relevant identification.<\/p>\\n<p>7.\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;SSR YPTA (Young Pax Travelling Alone) must be updated in the booking so that these guests can be recognized during disruptions.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Country Restrictions:<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2229%\\\x22><p>Italian<\/p>\\n<\/td>\\n<td width=\\\x2221%\\\x22 valign=\\\x22top\\\x22><p>South African<\/p>\\n<\/td>\\n<td width=\\\x2223%\\\x22 valign=\\\x22top\\\x22><p>French<\/p>\\n<\/td>\\n<td width=\\\x2225%\\\x22 valign=\\\x22top\\\x22><p>Spanish<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2229%\\\x22 valign=\\\x22top\\\x22><p>Children under 14 must have a completed\x26nbsp; Dichiarazione Di Affido and their passport.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\u002D The child may not be allowed to travel if these forms are not completed.<\/p>\\n<p>\u002D If the child lives outside Italy, the authorisation can be issued by the Italian Embassy or consulate.\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x2221%\\\x22 valign=\\\x22top\\\x22><p>Children under 18 must have additional documents\x26nbsp; and their passport.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\u002D Guests can contact the South African Department of Home Affairs on 0800 60 11 90 (toll free from South Africa).<\/p>\\n<p>\u002D Alternatively, they can contact their local South African embassy for more details on the requirements.<\/p>\\n<\/td>\\n<td width=\\\x2223%\\\x22 valign=\\\x22top\\\x22><p>Children under 18\x26nbsp;must have official authorisation\x26nbsp; \x26nbsp;and their passport to exit the country.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\u002D The child may not be allowed to travel if these forms are not completed.<\/p>\\n<\/td>\\n<td width=\\\x2225%\\\x22 valign=\\\x22top\\\x22><p>Children under 18\x26nbsp;must have a signed travel\x26nbsp; declaration and their passport.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\u002D The permit must be carried in addition to their passport and can be obtained from the Spanish Police, Civil Guard, Courts, Notaries, Town halls or Consulates.\x26nbsp; \x26nbsp; \x26nbsp;\x26nbsp;<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\x22,\x22lastmodified\x22:\x2228\u002D04\u002D2026\x22},{\x22heading\x22:\x22Carriage of human remains\x22,\x22description\x22:\x22<p><b>Human remains in an urn<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<ul>\\n<li>Transportation of cremated human remains is permitted on all Etihad Airways flights in checked baggage or as cargo<\/li>\\n<li>Carriage of cremated ashes in the cabin is strictly prohibited<\/li>\\n<li>Documentation including certificate of cremation and death certificate issued by a competent authority must be carried for presentation to authorities upon request<\/li>\\n<li>The casket or urn containing the cremated remains must be packed in a sealed outer box or case<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p><b>Human remains in a coffin<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Coffins are permitted on all Etihad Airways flights and routes, subject to the relevant documents being submitted. The accompanying guest or agent must contact Etihad Cargo to make all of the necessary arrangements.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Required documents:<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Death certificate<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Passport copy<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Contact number at both the origin and destination<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Confirmed ticket for the accompanying guest (if applicable)<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Flight details<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>For more information, please contact:<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Etihad Cargo Customer Services<\/p>\\n<p><a href=\\\x22mailto:cargocontact@etihad.ae\\\x22>cargocontact@etihad.ae<\/a><\/p>\\n<p>+971 2 599 0099<\/p>\\n<p>800 2535 (toll\u002Dfree within the UAE)<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2219\u002D09\u002D2022\x22},{\x22heading\x22:\x22Indian Goods and Services Tax (GST)\x22,\x22description\x22:\x22<p>\x26nbsp;<\/p>\\n<p><a href=\\\x22https:\/\/cleartax.in\/s\/gst\u002Dfull\u002Dform\u002Dmeaning\\\x22 target=\\\x22_blank\\\x22>Goods and Service Tax<\/a>\x26nbsp;(GST) is tax levied on the supply of goods and services by Government of India. Complete information on this tax is available\x26nbsp;at <a href=\\\x22https:\/\/taxinformation.cbic.gov.in\/\\\x22 target=\\\x22_blank\\\x22>https:\/\/taxinformation.cbic.gov.in<\/a><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>GST rule will apply differently depending on whether the passenger is traveling on behalf of a GST registered business (a “Business to Business” or “B2B” transaction), or traveling on his or her own personal account (a “Business to Customer” or “B2C” transaction).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>The GST will be a dual\u002Dadministered tax between the Central Government and various States\/Union Territories within India, and will consist of several GST rates, including:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Integrated or Inter\u002DState GST (IGST)<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D State GST (SGST)<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Central GST (CGST)<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Union Territory GST (UTGST)<\/p>\\n<p>These various rates are harmonized currently, but may vary over time, particularly in the case of the State GST (SGST).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Goods \x26amp; Service Tax (GST) on ticket<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D GST shall apply to entire journey originating from India (eg: IXE\u002DBOM\u002DAUH\u002DLHR\u002DAUH\u002DBOM\u002DIXE) irrespective of the country of sale<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The GST rates for air transport are as follows:<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>o\x26nbsp;\x26nbsp; 5% for\x26nbsp;economy class international travel<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>o\x26nbsp;\x26nbsp; 18% for premium class international travel<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D GST applies on:<br>\\n<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>Ø\x26nbsp; Base fare + YQ + YR<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>Ø\x26nbsp; Difference in fare during exchanges<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>Ø\x26nbsp; Change \x26amp; refund penalty<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>Ø Booking fee (OB)<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>Ø\x26nbsp; No show fee<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>Ø\x26nbsp; Ancillaries (refer to GST on ancillaries section)<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D GST needs to be calculated manually and applied\x26nbsp;whenever a manual transaction is processed<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>A single interim tax code <b>K3<\/b> will be used to collect GST. This tax is to be collected at point of sale and shown separately on the ticket. The selling airline is responsible for remittance.\x26nbsp; Penalties will occur if not processed correctly.\x26nbsp; This tax is not interlineable.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Exemptions:<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>For economy class Passengers embarking on a journey originating or terminating in an airport located in the state of Arunachal Pradesh, Assam, Manipur, Meghalaya, Mizoram, Nagaland, Sikkim, Tripura or Bagdogra in West Bengal. The exemption applies to\/from the following airports: DIB GAU JRH IXI IXS TEZ IMF SHL AJL DMU IXA IXB. However, this exemption will not apply to passengers using the above airports only as transfer points.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Regardless of the point of sale and form of payment, an airline must send a GST invoice to a business registered for GST (“B2B” transactions). This invoice must include the GST Number, Name and Address of the business entity registered for GST.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>These details will differ from the passenger’s own name and address.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D B2B are those passengers who furnish the GSTIN number at time of booking<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D B2C are those passengers who do not furnish the GSTIN number at time of booking<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>If a B2B entity does not provide their GSTIN at the time of booking, they must promptly share it with the contact centre via email at contactcentre@etihad.ae within 24 hours of making the booking. Subsequently, the contact centre must update the details in the EY system within 48 hours of receiving the request.<\/p>\\n<p>To capture above information, IATA has introduced 4 new Special Service Request (SSR) codes:<\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22>\\n<tbody><tr><td width=\\\x2278\\\x22><p><b>SSR Code<\/b><\/p>\\n<\/td>\\n<td width=\\\x22216\\\x22><p><b>Description<\/b><\/p>\\n<\/td>\\n<td width=\\\x22360\\\x22 valign=\\\x22top\\\x22><p><b>Purpose<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2278\\\x22><p>GSTN<\/p>\\n<\/td>\\n<td width=\\\x22216\\\x22><p>Goods and Services Tax Number<\/p>\\n<\/td>\\n<td width=\\\x22360\\\x22 valign=\\\x22top\\\x22><p>To collect the name and registered number of the business purchasing the goods and services.<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2278\\\x22><p>GSTA<\/p>\\n<\/td>\\n<td width=\\\x22216\\\x22><p>Goods and Services Tax Business Address<\/p>\\n<\/td>\\n<td width=\\\x22360\\\x22 valign=\\\x22top\\\x22><p>To collect the address of the business purchasing the goods and services<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2278\\\x22><p>GSTP<\/p>\\n<\/td>\\n<td width=\\\x22216\\\x22><p>Goods and Services Tax Business Phone Number(s)<\/p>\\n<\/td>\\n<td width=\\\x22360\\\x22 valign=\\\x22top\\\x22><p>To collect the business telephone number(s) of the business purchasing the goods and services<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2278\\\x22><p>GSTE<\/p>\\n<\/td>\\n<td width=\\\x22216\\\x22><p>Goods and Services Tax Business Email<\/p>\\n<\/td>\\n<td width=\\\x22360\\\x22 valign=\\\x22top\\\x22><p>To collect the e\u002Dmail address of the business purchasing the goods and services<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The SSRs GSTN, GSTP, GSTE and GSTA must be entered in the booking before or right after ticketing to ensure the guest receives their GST invoice<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If a guest has not received their GST invoice, it can be downloaded from the following link: <a href=\\\x22https:\/\/etihad.supertaxgst.in\/guestinvoices\\\x22 target=\\\x22_blank\\\x22>https:\/\/etihad.supertaxgst.in\/guestinvoices<\/a><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D For any queries regarding invoicing, guests can contact us via email at\x26nbsp;<a href=\\\x22mailto:etihadinvoicing@cnkindia.net\\\x22>etihadinvoicing@cnkindia.net<\/a>. This link and email ID can be shared with the guest as well.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Tax Application on tickets:<\/b><\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x2286%\\\x22>\\n<tbody><tr><td><p><b>FOR JOURNEY ORIGINATING INDIA<\/b><\/p>\\n<\/td>\\n<td width=\\\x22213\\\x22><p><b>CABIN<\/b><\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p><b>K3 TAX<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22179\\\x22 rowspan=\\\x222\\\x22><p>New Ticket Issuance and Associated EMDs<\/p>\\n<\/td>\\n<td width=\\\x22213\\\x22><p>Economy<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>5%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>Premium (First\/Business)<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>18%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22179\\\x22 rowspan=\\\x224\\\x22><p>Reissue Economy<\/p>\\n<\/td>\\n<td width=\\\x22213\\\x22><p>Date Change Fee<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>5%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>Fare Difference<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>5%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>Global Service Fee<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>5%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>No\u002DShow fee<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>5%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22179\\\x22 rowspan=\\\x224\\\x22><p>Reissue* Premium<\/p>\\n<\/td>\\n<td width=\\\x22213\\\x22><p>Date Change Fee<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>18%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>Fare Difference<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>18%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>Global Service Fee<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>18%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>No\u002DShow fee<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>18%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22179\\\x22 rowspan=\\\x224\\\x22><p>Refund* Economy<\/p>\\n<\/td>\\n<td width=\\\x22213\\\x22><p>Cancellation Fee<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>5%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>Global Service Fee<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>5%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>Nonrefundable amount<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>5%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>No\u002DShow fee<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>5%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22179\\\x22 rowspan=\\\x224\\\x22><p>Refund* Premium<\/p>\\n<\/td>\\n<td width=\\\x22213\\\x22><p>Cancellation Fee<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>18%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>Global Service Fee<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>18%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>Nonrefundable amount<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>18%<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22213\\\x22><p>No\u002DShow fee\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x22144\\\x22><p>18%<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p><b>* Refund \u002D<\/b> K3 tax can be refunded provided the request is made within the cut off dates for the Indian financial year. The financial year runs from 01 April of any given year to 31 March of the following year. The refund cut off is 31 October. e.g. For tickets issued during the financial year 01 April 2023 \u002D 31 March 2024, K3 tax refund is to be allowed till 31 Oct 2024.<\/p>\\n<p>This is applicable for involuntary refunds as well as refunds to Voucher\/Wallet.<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>\x26nbsp;<\/b><\/p>\\n<p><b>Goods \x26amp; Service Tax (GST) on ancillaries<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>K3 will automatically be added to ancillaries when purchased through any of our global contact centres or travel agencies.\x26nbsp;\x26nbsp;However, where the base value is updated manually (e.g. Miscellaneous EMD), K3 must be calculated manually.<br>\\n<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D K3 is a percentage\u002Dbased tax.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D When a journey “originally” originates from India, K3 tax is applicable on the Associated EMDs (EMD\u002DA) linked to any segment in the itinerary (Refer to attached table for K3 applicability)<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D For Standalone EMDs (EMD\u002DS), K3 is applicable only on the ancillaries sold in India\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D There are certain ancillaries where K3 is not applicable (Please refer to the table below)<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>For further clarification, see the examples below:<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x221\\\x22 cellpadding=\\\x221\\\x22 width=\\\x2270%\\\x22 height=\\\x2250%\\\x22>\\n<tbody><tr><td colspan=\\\x223\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>IS K3 APPLICABLE ?<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22157\\\x22><p><b>Journey<\/b><\/p>\\n<\/td>\\n<td width=\\\x22250\\\x22><p><b>EMD A\x26nbsp;<\/b><\/p>\\n<\/td>\\n<td width=\\\x22252\\\x22><p><b>EMD S<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22157\\\x22><p>DEL\u002DAUH\u002DJFK\u002DAUH\u002DDEL<\/p>\\n<\/td>\\n<td width=\\\x22250\\\x22 valign=\\\x22top\\\x22><p>K3 tax applies on all associated EMDs sold at DEL \/ AUH or JFK, since it is related to a journey which originally originates from India (DEL)<\/p>\\n<\/td>\\n<td width=\\\x22252\\\x22 valign=\\\x22top\\\x22><p>K3 tax applies on standalone EMDs sold in DEL or anywhere in India. If a standalone EMD is sold in AUH or JFK, then K3 tax is not applicable<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22157\\\x22><p>LHR\u002DAUH\u002DCOK\u002DAUH\u002DLHR<\/p>\\n<\/td>\\n<td width=\\\x22250\\\x22 valign=\\\x22top\\\x22><p>K3 tax does not apply on associated EMDs sold at LHR\/ AUH or COK, since it is related to a journey which originally originates from outside India\x26nbsp; (LHR)<\/p>\\n<\/td>\\n<td width=\\\x22252\\\x22 valign=\\\x22top\\\x22><p>K3 tax applies on standalone EMDs sold in COK or anywhere in India. If a standalone EMD is sold in AUH or LHR, then K3 tax is not applicable<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22157\\\x22><p>BLR\u002DAUH<\/p>\\n<\/td>\\n<td width=\\\x22250\\\x22 valign=\\\x22top\\\x22><p>K3 tax applies on all associated EMDs sold at BLR or AUH since it is related to a journey which originally originates from India (BLR)<\/p>\\n<\/td>\\n<td width=\\\x22252\\\x22 valign=\\\x22top\\\x22><p>K3 tax applies on standalone EMDs sold in BLR or anywhere in India. If a standalone EMD is sold in AUH, then K3 tax is not applicable<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22157\\\x22><p>AUH\u002DHYD<\/p>\\n<\/td>\\n<td width=\\\x22250\\\x22 valign=\\\x22top\\\x22><p>K3 tax does not apply on associated EMDs\x26nbsp;sold at AUH or HYD, since it is related to a journey which originally originates outside India (AUH)<\/p>\\n<\/td>\\n<td width=\\\x22252\\\x22 valign=\\\x22top\\\x22><p>K3 tax applies on standalone EMDs sold in HYD or anywhere in India. If a standalone EMD is sold in AUH, then K3 tax is not applicable<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2224\u002D09\u002D2025\x22},{\x22heading\x22:\x22Seat assignment for children under 14 years to or from Canada\x22,\x22description\x22:\x22<p>The Air Passenger Protection Regulations in Canada requires children under the age of 14 years travelling to or from Canada to be seated in close proximity to their parent, guardian or tutor.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Guests are able to purchase seats together when they book their flight. We will also do our best to seat families together during check\u002Din at the airport at no extra cost.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Policy<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Children four years of age or younger will be seated next to an adult.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D For children aged five to 14, if it is not possible to seat them next to an adult, every effort will be made to seat them in the same row with no more than one seat between them.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If this cannot be arranged, volunteers may be asked to change seats at the airport.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D A free of charge seat will only be offered to the child and one accompanying adult.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Only standard seats will be provided free of charge.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Please contact our Trade Line for seat requests.<\/p>\x22,\x22lastmodified\x22:\x2219\u002D06\u002D2026\x22},{\x22heading\x22:\x22UAE visa information\x22,\x22description\x22:\x22<p>Check whether you need to apply for a UAE visa.<br>\\nFind more information about visas\x26nbsp;<a href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/before\u002Dyou\u002Dfly\/visas\/\\\x22 title=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/before\u002Dyou\u002Dfly\/visas\/\\\x22 target=\\\x22_blank\\\x22>here<\/a><\/p>\x22,\x22lastmodified\x22:\x2202\u002D07\u002D2025\x22},{\x22heading\x22:\x22MEDA and Special assistance\x22,\x22description\x22:\x22<p><u><b>Special Assistance<\/b><\/u><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Guests requiring special assistance should complete a Special Service Request at least\x26nbsp;48 hours before their flight.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Our crew are fully trained to assist guests with reduced mobility, hearing impairments or vision impairments, and we have a number of wheelchair options available. Please simply request assistance in advance to avoid delays at the airport.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Assistive devices such as canes, crutches and foldable walkers are allowed in the cabin, but they must be securely stored before take\u002Doff and landing. Cabin chairs are available on board all of our flights to assist non\u002Dambulatory guests to move to and from the aircraft lavatory. The majority of our aircraft are also equipped with accessible lavatories. Electric wheelchairs must be dry\u002Dcell operated in order to meet our cabin safety requirements.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Guide dogs are permitted in the cargo hold for free as part of checked baggage allowance. All pets must have the correct permits and documentation to travel, and these regulations may vary from one destination to another.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><u><b>Medical Clearance<\/b><\/u><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Some conditions may require guests to seek medical clearance before flying.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Medical clearance is required if the guest:<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Suffers from any condition which is believed to be actively contagious<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Suffers from any condition that may be adversely affected by flying<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Is likely to be a hazard or a cause discomfort to other guests due to their physical or behavioural condition<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Is considered to be a potential hazard to the safety or punctuality of the flight<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Requires special assistance<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Has recently undergone major surgery<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Suffers from an unstable physical or psychological condition<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Requires a stretcher<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Requires in\u002Dflight oxygen, portable oxygen concentrator (POC) or ventilator<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Requires the use of battery\u002Dpowered* medical equipment on board (except for CPAP)\x26nbsp;<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Requires a medical procedure during the flight (e.g. injections)<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>*Only dry\u002Dcell operated devices are accepted onboard<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Before a guest receives medical clearance to fly, they must complete and submit a\x26nbsp;<a href=\\\x22https:\/\/pulse.etihad.com\/en\u002DUS\/meda\u002Dapplication\/\\\x22 target=\\\x22_blank\\\x22>MEDIF (Medical Information for Fitness to Travel) form<\/a>\x26nbsp;to the nearest Etihad Airways Ticketing Office or Contact Centre at least 72 hours before their flight. Incomplete forms will not be accepted for assessment. The MEDIF form must be submitted along with a recent medical report from their treating physician (in English). The medical report must have been issued within 14 days of travel.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Etihad Airways Medical Centre (EAMC) will determine whether a guest is fit to travel and will notify them if a separate MEDIF is required for the return journey. If approved, EAMC will issue a Medical Certificate through the respective Ticketing Office. Guests may be asked to present the certificate at any time during their journey.<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Etihad Airways must be notified immediately of any changes prior to travel. In the event that the medical condition changes during the journey, guests will be required to obtain another MEDIF form to continue travelling.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><u><b>Onsite Assessment<\/b><\/u><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>You can arrange same\u002Dday clearance to fly with our fast\u002Dtrack onsite assessment. Our onsite physician will assess guests and determine whether they are fit to fly on the same day.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>AED1,500 per visit in Abu Dhabi<\/p>\\n<p>AED2,000 per visit in Al Ain, Dubai and other locations outside of Abu Dhabi<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Call\x26nbsp;+971 600 555 666<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><u><b>Nurse On Board<\/b><\/u><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Guests with a medical condition can fly with peace of mind thanks to our Nurse On Board service. Our fully\u002Dtrained nurse will be on hand throughout the entire journey; they’ll ensure that all medical forms and documents are in place, assist with boarding and offer medical assistance during the flight.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Call\x26nbsp;+971 600 555 666 or click <a href=\\\x22https:\/\/www.etihad.com\/content\/eag\/etihadairways\/etihadcom\/language\u002Dmasters\/en\/help\/faq\/special\u002Dassistance.html#accordion\u002D6882789cdd\u002Ditem\u002Df52000d36f\\\x22 target=\\\x22_blank\\\x22>here<\/a> for more information<\/p>\x22,\x22lastmodified\x22:\x2201\u002D07\u002D2025\x22},{\x22heading\x22:\x22Guest Contact Information\x22,\x22description\x22:\x22<p>As per IATA Resolution 830d, from 1 June 2019 we require all travel agents to:<\/p>\\n<p>\x26nbsp;<\/p>\\n<ul>\\n<li>Actively ask guests whether they wish their contact details to be provided to airlines for the purpose of contacting them in an operational disruption.<\/li>\\n<li>Update the applicable SSR where the guest agrees to provide their contact information.<\/li>\\n<li>Advise the guest that they may not receive information from the airline relating to flight cancellation or schedule changes when they refuse to provide contact information. The refusal must be recorded in the booking.<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p><b>Special Service Requests (SSR)<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>IATA has provided SSRs designated for the purpose of capturing the above details in the booking as follows:<\/p>\\n<p>CTCE: Passenger contact email address<\/p>\\n<p>CTCM: Passenger contact mobile phone number<\/p>\\n<p>CTCR:\x26nbsp; Passenger contact refused<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2228\u002D10\u002D2020\x22},{\x22heading\x22:\x22Expectant Mother\x22,\x22description\x22:\x22<p>During the first 28 weeks of pregnancy, guests do not need a medical certificate to fly, though we’d always recommend that they speak with their doctor before they travel.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Single pregnancy<\/b><\/p>\\n<p>From weeks 29 to 36, guests will require a medical certificate to fly, which they’ll have to present when they check in at the airport.<\/p>\\n<p>At the 37th\x26nbsp;week of pregnancy, guests will not be accepted to travel.<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Multiple pregnancy<\/b><\/p>\\n<p>From weeks 29 to 32, guests will require a medical certificate to fly, which they’ll have to present when they check in at the airport.<\/p>\\n<p>At the 33rd\x26nbsp;week of pregnancy, guests will not be accepted to travel.<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Medical certificate<\/b><\/p>\\n<p>Medical certificates must be original and presented during check in at the airport. The certificate must state that the guest is fit to fly, whether the pregnancy is single or multiple, the number of weeks of pregnancy and Expected Delivery Date (EDD).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>The medical certificate must be:<\/p>\\n<ul>\\n<li>Issued and signed by the treating doctor or midwife within the gestation period considered acceptable for travel<\/li>\\n<li>Issued on clinic or hospital letterheaded paper or stamped<\/li>\\n<li>Valid for 3 weeks from the date of issue<\/li>\\n<li>Written clearly in English or Arabic (other languages are accepted but must be verified by Etihad Airways check\u002Din staff)<\/li>\\n<\/ul>\x22,\x22lastmodified\x22:\x2228\u002D10\u002D2020\x22},{\x22heading\x22:\x22Ancillaries\x22,\x22description\x22:\x22<p>With a range of options to enhance their journey, your guests can choose the experience they prefer at a price they can afford.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Seating Options<\/b><\/p>\\n<p>In Economy, your guest can pay for their choice of:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>o\x26nbsp; \x26nbsp;\x26nbsp;Economy Standard seat (or we will allocate a seat for free\x26nbsp;within 24 hours of departure)<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>o\x26nbsp; \x26nbsp;\x26nbsp;Preferred, Exit row and bulkhead seats<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>o\x26nbsp; \x26nbsp;\x26nbsp;Economy Neighbor\u002DFree, for more space and privacy (subject to availability)<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Excess Baggage<\/b><\/p>\\n<p>Encourage your customers to pre\u002Dbook their extra baggage online, and save up to 65% on airport fees. To purchase excess baggage,\x26nbsp;<a><\/a><a href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/before\u002Dyou\u002Dfly\/baggage\u002Dinformation\/excess\/\\\x22 target=\\\x22_blank\\\x22>click here<\/a>.<\/p>\\n<p>Note: Discount is applicable 4hrs prior to departure for weight concept routes and 30hrs prior to departure for piece concept routes<\/p>\\n<p>GDS entries for <a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/gds\u002Dentries\u002Dfor\u002Dexcess\u002Dbaggage.pdf\\\x22 target=\\\x22_blank\\\x22>Excess Baggage<\/a><\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Upgrades<\/b><\/p>\\n<p>Or customers can upgrade to Business or First, and enjoy great food, fully\u002Dflat beds or simply more privacy.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Lounges<\/b><\/p>\\n<p>All customers can now access our lounges for a small fee, or organize our personalized Etihad Meet \x26amp; Greet service to make their journey through the airport even more relaxing.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>We are pleased to announce that, effective <b>17 June 2025<\/b>, agents will be able to purchase selected lounge products via GDS. This will support in fulfilling your guests’ booking requests at the time of booking.<\/p>\\n<p>View the GDS entries for the lounge ancillary on <a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/lounge\u002Dancillary\u002Dgds\u002Dentries.pdf\\\x22 title=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/lounge\u002Dancillary\u002Dgds\u002Dentries.pdf\\\x22 target=\\\x22_blank\\\x22>Etihad Hub<\/a>.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Etihad Priority Access<\/b><\/p>\\n<p>Allows customers\x26nbsp;to:<\/p>\\n<ul>\\n<li><p>Check in at the priority check\u002Din counter\x26nbsp;<\/p>\\n<\/li>\\n<li><p>Board the aircraft in the premium queue\x26nbsp;<\/p>\\n<\/li>\\n<\/ul>\\n<ul>\\n<li>Have a priority tag placed on their baggage and delivered first on arrival<\/li>\\n<\/ul>\\n<p><b>\x26nbsp; \x26nbsp; \x26nbsp;<\/b><\/p>\\n<p><b>Policy<\/b><br>\\n<\/p>\\n<ul>\\n<li><p>Etihad Priority Access can be purchased up to 90 minutes before the flight departure\x26nbsp;<\/p>\\n<\/li>\\n<li><p>An associated Electronic Miscellaneous Document (EMD) is issued to fulfil the payment<\/p>\\n<\/li>\\n<li><p>A fixed price of USD 50 will apply\x26nbsp;<\/p>\\n<\/li>\\n<li><p>The EMD is non\u002Drefundable, but it can be refunded if service was not provided, or the guest has been upgraded<\/p>\\n<\/li>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<\/ul>\x22,\x22lastmodified\x22:\x2220\u002D07\u002D2026\x22},{\x22heading\x22:\x22Rail, Bus and Fly.\x22,\x22description\x22:\x22<p>\x26nbsp;<\/p>\\n<p>Etihad Airways has teamed up with the several railway companies in Europe and Canada to provide guests with rail connectivity beyond the airports.<\/p>\\n<h1>\x26nbsp;<\/h1>\\n<p>If your guests are flying with us to or from Germany, Switzerland, Austria, Italy, Canada, United Kingdom, Spain, between\/within Netherlands, Belgium and Paris\u002DCharles de Gaulle (CDG) can book an onward connection on the respective railway service, mentioned below, to any of the train stations they serve.<\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cel
