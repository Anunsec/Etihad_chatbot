<td width=\\\x22348\\\x22><p>Austria<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22297\\\x22><p><a href=\\\x22https:\/\/accesrail.com\/products\/renfe\/\\\x22 target=\\\x22_blank\\\x22>Renfe<\/a><u><\/u><\/p>\\n<\/td>\\n<td width=\\\x2251\\\x22><p>9B<\/p>\\n<\/td>\\n<td width=\\\x22348\\\x22><p>Spain<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22297\\\x22><p><a href=\\\x22https:\/\/accesrail.com\/products\/sbb\u002Dtrain\u002Dtickets\/\\\x22 target=\\\x22_blank\\\x22>Swiss Federal Railways (SBB)<\/a><u><\/u><\/p>\\n<\/td>\\n<td width=\\\x2251\\\x22><p>9B<\/p>\\n<\/td>\\n<td width=\\\x22348\\\x22><p>Switzerland<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22297\\\x22><p><a href=\\\x22https:\/\/accesrail.com\/products\/thalys\u002Dnetherlands\u002Dbelgium\/\\\x22 target=\\\x22_blank\\\x22>Thalys<\/a><u><\/u><\/p>\\n<\/td>\\n<td width=\\\x2251\\\x22><p>9B<\/p>\\n<\/td>\\n<td width=\\\x22348\\\x22><p>Netherlands \/ Belgium \/ France<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22297\\\x22><p><a href=\\\x22https:\/\/accesrail.com\/products\/transpennine\u002Dexpress\/\\\x22 target=\\\x22_blank\\\x22>Transpennine (TPE)<\/a><u><\/u><\/p>\\n<\/td>\\n<td width=\\\x2251\\\x22><p>9B<\/p>\\n<\/td>\\n<td width=\\\x22348\\\x22><p>United Kingdom (MAN)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22297\\\x22><p><a href=\\\x22https:\/\/accesrail.com\/products\/london\u002Dnorth\u002Deastern\u002Drailway\/\\\x22 target=\\\x22_blank\\\x22>LNER<\/a><\/p>\\n<\/td>\\n<td width=\\\x2251\\\x22><p>9B<\/p>\\n<\/td>\\n<td width=\\\x22348\\\x22><p>United Kingdom (LHR including tube)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22297\\\x22><p><a href=\\\x22https:\/\/accesrail.com\/products\/trenitalia\/\\\x22 target=\\\x22_blank\\\x22>Trenitalia<\/a><u><\/u><\/p>\\n<\/td>\\n<td width=\\\x2251\\\x22><p>9B<\/p>\\n<\/td>\\n<td width=\\\x22348\\\x22><p>Italy<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22297\\\x22><p><a href=\\\x22https:\/\/accesrail.com\/products\/via\u002Drail\u002Dcanada\/\\\x22 target=\\\x22_blank\\\x22>VIA Rail<\/a><u><\/u><\/p>\\n<\/td>\\n<td width=\\\x2251\\\x22><p>9B<\/p>\\n<\/td>\\n<td width=\\\x22348\\\x22><p>Canada<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22297\\\x22><p><a href=\\\x22https:\/\/www.sncf.com\/en\\\x22 target=\\\x22_blank\\\x22>French National Railway Company (SNCF)\x26nbsp;<\/a><u><\/u><\/p>\\n<\/td>\\n<td width=\\\x2251\\\x22><p>2C<\/p>\\n<\/td>\\n<td width=\\\x22348\\\x22><p>France \/ Belgium<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p><a href=\\\x22\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/rail\u002Dand\u002Dfly.pdf\\\x22 target=\\\x22_blank\\\x22>Read more<\/a><\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2227\u002D03\u002D2026\x22},{\x22heading\x22:\x22Stretcher Ticketing\x22,\x22description\x22:\x22<p>Guests who require a stretcher booking will be subject to the following policy and procedures:<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Policy<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Stretcher bookings will be accepted for adults only.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guests who must travel in a stretcher onboard must be booked in Economy only and select the number of seats required from six to a maximum of 12 seats.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Seats will be assigned as per the stretcher configuration table below while booking STCR and non\u002Dcommercial PNRs (NCP).<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Stretchers will be accepted on Etihad Airways prime operated flights only and not on OAL configured aircraft types.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Medical clearance must be requested at least 72 hours before the guest\x27s flight.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Non\u002Dmedical escorts will be permitted to accompany the guest unless the Etihad Airways doctor issues a mandatory requirement for medical escorts as part of the medical certificate.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guests are entitled to the additional check baggage allowance associated with the purchased seats; this will be manually calculated and updated as ‘Itinerary Remarks in the prime booking’ and airports will honour this allowance.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Procedure<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Stretcher cases are\x26nbsp;only\x26nbsp;permitted\x26nbsp;for travel in\x26nbsp;the\x26nbsp;Economy\x26nbsp;cabin. Specific\x26nbsp;number\x26nbsp;of seats (6, 8, 9, or 12) are booked depending on the\x26nbsp;aircraft\x26nbsp;type.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D A single ticket is issued with the adult fare +\x26nbsp;addition\x26nbsp;seats. Pricing is\x26nbsp;manual.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The guest is\x26nbsp;charged\x26nbsp;the highest Y‑RBD, EY\x26nbsp;one‑way Deluxe (routing fare)\x26nbsp;multiplied by the total number of seats booked.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D A stretcher request can be made only for point\u002Dto\u002Dpoint routes\x26nbsp;e.g.\x26nbsp;AUH – LHR on EY\x26nbsp;\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D All applicable taxes must be collected for the stretcher guest. YQ and YR are\x26nbsp;multiplied by the number of seats; all other taxes are exempt\x26nbsp;for\x26nbsp;the\x26nbsp;additional\x26nbsp;seats.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D A Global Service Fee (GSF) will be charged for the stretcher guest only.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The maximum weight of the guest that can be accommodated on a stretcher is\x26nbsp;120 kilos.\x26nbsp;\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Tickets can be booked and issued by Etihad Airways agents or Travel agents only.\x26nbsp;\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The guest is entitled to the baggage allowance according to the number of seats\x26nbsp;purchased. However, the total baggage permitted must be manually\x26nbsp;calculated updated\x26nbsp;as “Itinerary Remarks in the prime booking”.\x26nbsp;Airports will honor this allowance.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If a booking requires 11 seats, then two NCPs (one for nine seats and another for two seats) must be created to pre\u002Dassign seats.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>•\x26nbsp;<a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/GDS\u002DEntry\u002Dfor\u002Da\u002DStretcher\u002DPassenger.pdf\\\x22 target=\\\x22_blank\\\x22>GDS entry for a Stretcher Passenger<\/a><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>The table below provides the configuration and stretcher location along with the number of seats required on each aircraft type. Location 2 must be used only when there is a 2<sup>nd<\/sup> STCR request on the same flight.\x26nbsp;\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>AIRCRAFT TYPE<\/b><\/p>\\n<\/td>\\n<td width=\\\x2215%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>CONFIGURATION<\/b><\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>NUMBER OF SEATS (STRETCHER LOCATION 1)<\/b><\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>NUMBER OF SEATS (STRETCHER LOCATION 2)<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 rowspan=\\\x222\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\x26nbsp;<\/p>\\n<p style=\\\ 5%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>J40 Y330<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2215%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>F8 J40 Y280<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>6 (43\u002D45AC)<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>6 (43\u002D45HK)<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\x22,\x22lastmodified\x22:\x2221\u002D05\u002D2026\x22},{\x22heading\x22:\x22Chauffeur policy \x22,\x22description\x22:\x22<p><b>Chauffeur policy<\/b><\/p>\\n<p>Etihad provides premium chauffeur services across selected markets. For up‑to‑date information on the Etihad UAE Chauffeur and Etihad Global Chauffeur products, please use the links below.<\/p>\\n<p><b>Eligibility:<\/b><br>\\nTo view the stations where Etihad Chauffeur services are currently available, please click\x26nbsp;<a title=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/plan\/etihad\u002Dservices\/etihad\u002Dchauffeur\\\x22 href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/plan\/etihad\u002Dservices\/etihad\u002Dchauffeur\\\x22 target=\\\x22_blank\\\x22>here<\/a>.<\/p>\\n<p><b>Terms \x26amp; Conditions:<\/b><br>\\nFor the latest Chauffeur Service Terms \x26amp; Conditions, including service rules and policy details, please click\x26nbsp;<a href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/legal\/terms\u002Dand\u002Dconditions#chauffeur\u002Dtc\\\x22 target=\\\x22_blank\\\x22>here<\/a>.<\/p>\x22,\x22lastmodified\x22:\x2226\u002D02\u002D2026\x22},{\x22heading\x22:\x22Global Meet and Assist\x22,\x22description\x22:\x22<p>Is your customer unfamiliar with the local language or a first\u002Dtime flyer? For total peace of mind, our Global Meet \x26amp; Assist service can help with everything from baggage to boarding.\x26nbsp;<br>\\n<\/p>\\n<p>Powered by Fasttrack.aero,\x26nbsp;<a href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/book\/meet\u002Dand\u002Dgreet\\\x22 title=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/book\/meet\u002Dand\u002Dgreet\\\x22 target=\\\x22_blank\\\x22>Global Meet \x26amp; Assist<\/a>\x26nbsp;is available before departure, on arrival or even during transport. Pick from a choice of packages including a dedicated host,\x26nbsp;use of our priority check\u002Din counters, fast\u002Dtrack security clearance and lounge access – we\x26nbsp;can even arrange a premium car from the terminal to the plane.<\/p>\x22,\x22lastmodified\x22:\x2206\u002D05\u002D2025\x22},{\x22heading\x22:\x22Extra Seat – Personal Comfort and Cabin Baggage\x22,\x22description\x22:\x22<p><b>Extra seat – personal comfort (EXST)\x26nbsp;<\/b><br>\\n<\/p>\\n<p>Any guest travelling in Economy who cannot safely and comfortably fit within a single seat with the armrests in the down position is required to purchase an additional seat for their entire journey. This ensures that all guests have access to safe and comfortable seating onboard. Width between armrests are usually 17 inches in Economy.\x26nbsp;\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Guests are required to purchase an additional seat or upgrade if they do not meet the below criteria:\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Must be able to wear a seat belt, with one extension if necessary\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Must remain seated with the seat armrests down for the entire flight\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Must not significantly encroach adjacent seating space\x26nbsp;\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>The guest may choose to purchase an extra seat for personal comfort or carriage of pets.\x26nbsp;<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Extra seat \u002D cabin baggage (CBBG)<\/b><\/p>\\n<p>Guests may book an additional seat if they are travelling with cabin baggage that doesn’t fit in the overhead storage locker.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Things to keep in mind<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guests will be charged the normal ticket fare for the additional seat.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Only YQ, YR and any percentage\u002Dbased taxes will be charged \u002D all other taxes are exempt.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The guest and their extra seat must be booked on the same RBD (Reservation Booking Designator) and PNR.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D This service is only applicable on Etihad\u002Doperated flights.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D IATA commission will be as per Etihad’s existing policy in each country of sale.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D A Global Service Fee (GSF) applies only to the guest occupying the seat.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D In case there are any booking changes, penalty charges will apply for both the guest’s ticket and their extra seat ticket.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Tickets can be booked and issued by Etihad Airways agents or external travel agents.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If a guest has already purchased a ticket and would like to add an extra seat, the existing booking will need to be cancelled and a new booking of 2 seats (guest + extra seat) will need to be created. To include the fare for the extra seat, the guest\x27s original ticket must be reissued.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Seats must be assigned at the time of booking. Requests for extra seats can only be accepted if adjacent seats are available on the aircraft.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>1. How to book an extra seat – EXST or CBBG<\/b><br>\\n<\/p>\\n<p>When creating an extra seat booking, do not start creating a booking with the guest’s profile as this disables the option to select EXST or CBBG. Instead, a PNR for the actual guest and extra seat must be created:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The first guest\x27s name (name 1.1) must always be the actual guest’s name, followed by EXST or CBBG in the second name field<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Leave the last name blank and enter EXST or CBBG in the first name field<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Do not add a title for EXST or CBBG\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>GDS Entries for Extra Seat*<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>STEPS<\/b><\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p><b>SABRE\/ ABACUS\/ INFINI<\/b><\/p>\\n<\/td>\\n<td width=\\\x2227%\\\x22 valign=\\\x22top\\\x22><p><b>AMADEUS<\/b><\/p>\\n<\/td>\\n<td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p><b>GALILEO<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>Create a booking for 2 seats and update the names as<\/b><\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p>2JONES\/ANDREW MR\/EXST<\/p>\\n<\/td>\\n<td width=\\\x2227%\\\x22 valign=\\\x22top\\\x22><p>NM2SMITH\/THOMAS MR(IDEXST)\/EXST\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p>N.2SMITH\/THOMASMR\/EXST\x26nbsp;<\/p>\\n<p>N.2ANDERSON\/LOUIS\/CBBG<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>SSR for EXST<\/b><\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p>3EXST\/REQUIRED FOR PERSONAL COMFORT\u002D1.2<\/p>\\n<\/td>\\n<td width=\\\x2227%\\\x22 valign=\\\x22top\\\x22><p>SREXST\u002DREQUIRED FOR PERSONAL COMFORT\/P2<\/p>\\n<\/td>\\n<td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p>SI.P1\/EXST*INJURED PASSENGER<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>SSR for CBBG<\/b><\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p>3CBBG\/REQUIRED FOR MUSICAL INSTRUMENT–1.2<\/p>\\n<\/td>\\n<td width=\\\x2227%\\\x22 valign=\\\x22top\\\x22><p>SRCBBG\u002DREQUIRED FOR MUSICAL INSTRUMENT\/P2<\/p>\\n<\/td>\\n<td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p>SI.P1\/CBBG*EXTRA SEAT FOR CELLO<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p><i>* GDS entries are correct at the time of printing. Please seek assistance from your GDS provider help desk in case of further queries.<\/i><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Using free text in SSR\/OSI, it is mandatory to enter the reason for booking the extra seat.\x26nbsp;<\/p>\\n<p>Examples are given below:<\/p>\\n<p><b>GDS Entries for Extra Seat*\x26nbsp;<\/b><br>\\n<\/p>\\n<p><b>Sabre – 1S \/ Abacus – IB \/ Infini –1F\x26nbsp; \x26nbsp;<\/b><br>\\n<\/p>\\n<p>\x26nbsp;\u002DAssign extra seat to passenger 2 name field \u002D2JONES\/EXST\x26nbsp;<br>\\n<\/p>\\n<p>\x26nbsp;\u002DSend SSR to airline 3EXST\/REQUIRED FOR PERSONAL COMFORT \u002D2.1\x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp;3CBBG\/REQUIRED FOR MUSICAL INSTRUMENT\u002D2.1\x26nbsp;<\/p>\\n<p><b>Amadeus \u002D 1A\x26nbsp;<\/b><br>\\n<\/p>\\n<p>\x26nbsp;\u002DAssign extra seat to passenger 2 name field NM2SMITH\/THOMAS MR(IDEXST)\/EXST\x26nbsp; \x26nbsp;<br>\\n<\/p>\\n<p>\x26nbsp;\u002DSend SSR to airline SREXST\u002DREQUIRED FOR PERSONAL COMFORT\/P2\x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp;SRCBBG\u002DREQUIRED FOR MUSICAL INSTRUMENT\/P2\x26nbsp;<\/p>\\n<p><b>Galileo \u002D 1G\x26nbsp;<\/b><br>\\n<\/p>\\n<p>\x26nbsp;\u002DAssign extra seat to passenger 2 name field N.2SMITH\/THOMASMR\/EXST\x26nbsp; \x26nbsp;<br>\\n<\/p>\\n<p>\x26nbsp;\u002DSend SSR to airline SI.P2S1.2\/EXST*EY EXST REQUIRED FOR INJURED PASSENGER\x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp;SI.P2S1.2\/CBBG*EY CBBG REQUIRED FOR CELO\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>2. Price the extra seat PNR\x26nbsp;(EXST or CBBG)<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If a guest requests to book an extra seat, they will be charged for both seats.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The guest and extra seat must be booked in the same RBD (reservation booking designator) and in the same PNR.\x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp; \x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Fare basis should be updated with the applicable booking designator CB for cabin baggage or EX for extra seat (e.g. HHW05V2R\/CB).<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D A single ticket is issued using double the fare and baggage allowance.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D This request is valid only for PNRs and tickets with EY operated and EY marketed flights and should not contain any Other Airline (OAL), interline or codeshare flights.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If a guest wants to add an extra seat to an existing ticket, the current booking must be cancelled and a new one be created with two (2) seats; the original ticket may be reissued to include the fare for the extra seat.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D IATA commission is as per the existing EY policy in each country of sale.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D All applicable taxes must be collected; for the extra seat (tickets), only YQ, YR and any percentage\u002Dbased tax is charged and all other taxes are exempted.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>3. Ticket the extra seat<\/b><\/p>\\n<p>Follow the usual steps to ticket the extra seat. Extra seats are not eligible for Etihad Guest Miles.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Terms and conditions:<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D All items must fit within the allocated seat area without obstructing the aisle; large items, such as musical instruments, may be placed on the cabin floor against the vacant seat and secured with an extension belt, in the bulkhead or behind the lavatory as long as they do not obscure the view to any guest<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Each item must not exceed the following dimensions so as not to obscure any cabin signs, such as seat belt or exit signs:<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>o Height: 45”\/ 114cm\x26nbsp;(Height can be 61\x26quot;\/155 cm if the guest is allocated a bulkhead seat immediately behind)<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>o Depth: 9”\/ 22cm<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>o Width: 17”\/ 43cm<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The maximum weight of such baggage must not exceed 75kg\/165lbs per seat.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D All items should be packaged and\/or covered to avoid possible injury to guests or crew.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D All items are subject to security clearance for carriage in the cabin\x26nbsp;before being brought onboard.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Cargo and mail will be transported in the cargo hold only.<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2215\u002D12\u002D2025\x22},{\x22heading\x22:\x22Name Format\x22,\x22description\x22:\x22<p>It is very important to record name information accurately, due to increasing Governmental requirements concerning Passenger Data. Ideally, the recorded name should match that in an official travel document, e.g. a passport. As this may not always be possible, please follow these guidelines:<\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>SCENARIOS<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p><b>EXPLANATION\x26nbsp;\x26amp; FORMAT<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>General<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p>Enter the surname in the last name field and the given names (first and middle*) in the first name field followed by the title.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>*Middle name is not mandatory even when travelling to\/from US and Canada, but all names should be updated in SSR DOCS (passport data).<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>Compound Names<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p>When you have a hyphenated surname, an apostrophe in the surname or a double surname, delete the hyphen and apostrophe and replace with a space while entering the surname name in the last name field.<\/p>\\n<p><br>\\nE.g. JAMES ROBERT BRYCE\u002DBUCHANAN as BRYCE BUCHANAN\/JAMES ROBERT MR<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>Single Letter Family Name<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p>When a guest has a single letter as the family name, double the single letter and update in the last name field followed by the given names and title.<\/p>\\n<p>E.g. MISS MOAN Y as YY\/MOAN MISS<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>We may also accept guests whose PNRs are created on other GDS where the single letter family name is combined with the given names of that guest and entered as the family name followed by the title.<br>\\n E.g. MISS MOAN Y as MOAN Y\/MISS<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>Duplicate<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p>When creating a booking and names are an exact match, add middle names and\/or different titles (if applicable) to make them unique. Otherwise you should create a separate booking.\x26nbsp;<br>\\n E.g. SINGH\/JITENDER MR and SINGH\/JITENDER PAL<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>No Family Name<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p>When the surname is not available, update the name using one of the following formats:<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Enter the given name in the last name field and enter the given name as\x26nbsp;FNU\x26nbsp;(First Name Unknown) followed by the title. LNU must not be used in the name field.\x26nbsp;Update the name on the booking as\x26nbsp;HABEEB MOHAMMAD\/FNU MR<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Enter the given name(s) in the last name field and add a title in the first name field is accepted by Etihad Airways.\x26nbsp;E.g. HABEEB MOHAMMED\/MR<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>No Given\/First Name<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p>When the given names (first and middle) are not available:<\/p>\\n<p>(i) Enter the family name in the Last name field and update given name as FNU followed by the title of the guest.<br>\\n E.g. JACK FRANCIS\/FNU MR<\/p>\\n<p><br>\\n(ii) Names without first name, but just the title in the given name field are accepted by Etihad Airways.<br>\\n E.g. JANE AUSTIN\/MRS<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>Name Suffix<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p>To accommodate name suffixes (such as Junior, Senior or III) add the suffix to the surname in the last name field followed by the given name and title in the first name field.<br>\\n E.g. MR.JOHN OLSEN JR. as OLSEN JR\/JOHN MR<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>Long Names<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p>Etihad reservation system accepts only up to 59 characters (<b>including space, title, infant name along with pax type and date of birth<\/b>) in entire name field. Last name must contain at least 2 alpha characters.\x26nbsp;. When the name is longer or when there is insufficient space on the ticket, add as many names as possible from the first name and last name on the passport and omit the rest. However, travel docs (SSR DOCS) must be updated with full names.<\/p>\\n<p>Example:<\/p>\\n<p>Adult name: LAKSHMIPATHY SAMIE KIRUTHIKAMAHESWARI<\/p>\\n<p>Update adult name as LAKSHMIPATHY KIRUTHIKAMAHESWARI<\/p>\\n<p>Infant name: JAYDEN KING CARTER VISHAKAN<\/p>\\n<p>Update the Infant name as JAYDEN VISHAKAN<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>Full Name on one line<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p>If the full name is in one line on the passport, check the name on MRZ. MRZ\x26nbsp;refers to Machine Readable Zone, at the bottom of the identity page at the beginning of a passport.<\/p>\\n<p>Example 1:<\/p>\\n<p>If the full name on the passport is\x26nbsp;AHMED MAGED MAHMOUD ELSAYED SHAHIN\x26nbsp;and the\x26nbsp;MRZ\x26nbsp;is\x26nbsp;P\x26lt;EGYSHAHIN\x26lt;\x26lt;AHMED\x26lt;MAGED\x26lt;MAHMOUD\x26lt;ELSAYED\x26lt;\x26lt;\x26lt;\x26lt;<\/p>\\n<p>where,\x26nbsp;P\x26nbsp; indicates the type of document\x26nbsp; (Passport)<\/p>\\n<p>EGY\x26nbsp;indicates the country code<\/p>\\n<p>SHAHIN\x26nbsp;is the surname (surname always follows the country code without any space or separators)<\/p>\\n<p>AHMED\x26lt;MAGED\x26lt;MAHMOUD\x26lt;ELSAYED\x26nbsp;is the first name and subsequent names<\/p>\\n<p>Update the name on the booking as\x26nbsp;SHAHIN\/AHMED MAGED MAHMOUD ELSAYED MR<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Example 2:<\/p>\\n<p>If the full name on the passport is RUKMINI BINTE HALIM and the MRZ PASGPRUKMINI<b>\x26lt;<\/b>BINTE\x26lt;HALIM\x26lt;\x26lt;\x26lt;\x26lt;\x26lt;<\/p>\\n<p>One \x26lt; means space and \x26lt; \x26lt; comes after surname. In this case, the guest does not have a surname, so the name must be updated as\x26nbsp;Rukmini Binte Halim\/FNU<\/p>\\n<p>\x26nbsp;<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>Name with special characters<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p>While entering names with special characters e.g. umlauts, agents need to check the MRZ on the guest passport and enter the name accordingly.<\/p>\\n<p>If the surname is\x26nbsp;LÅÅS\x26nbsp;and the given names are\x26nbsp;GöRAN TONY BERTIL, and the MRZ is\x26nbsp;P\x26lt;SWELAAAAS\x26lt;\x26lt;GOERAN\x26lt;TONY\x26lt;BERTIL<\/p>\\n<p>where,\x26nbsp;P\x26nbsp;indicates the type of document (Passport)<\/p>\\n<p>SWE\x26nbsp;indicates the country code<\/p>\\n<p>LAAAAS\x26nbsp;is the surname,\x26nbsp;Å\x26nbsp;is entered as AA<\/p>\\n<p>GOERAN\x26lt;TONY\x26lt;BERTIL\x26nbsp;are the given names where\x26nbsp;ö\x26nbsp;is entered as OE<\/p>\\n<p>Update the name on the booking as\x26nbsp;LAAAAS\/GOERAN TONY BERTIL MR<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p><b>Multiple Names<\/b><\/p>\\n<\/td>\\n<td width=\\\x2283%\\\x22 valign=\\\x22top\\\x22><p>Some passports are issued with multiple names. For such scenarios, update one of the surnames \/first name.<\/p>\\n<p><b>\x26nbsp;<\/b><\/p>\\n<p>Example:<\/p>\\n<p>Name on Passport\u002D Surname ZIOU OR ZIU and Name FLORINTA OR FLORIDA and the MRZ P\x26lt;GRCZIOU\x26lt;OR\x26lt;ZIU\x26lt;\x26lt;FLORINTA\x26lt;OR\x26lt;FLORIDA\x26lt;<\/p>\\n<p>Update the name on the booking as one of the following:<\/p>\\n<p><b>ZIOU\/FLORINTA<\/b>\x26nbsp;<b>MS<\/b>\x26nbsp;or\x26nbsp;<b>ZIU\/FLORIDA MS<\/b><\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p><b>Notes:<\/b><\/p>\\n<ul>\\n<li>When making a reservation for an unaccompanied minor, use\x26nbsp;the\x26nbsp;SSR UMNR which includes the child\x27s age,\x26nbsp;contact\x26nbsp;and other details.\x26nbsp;<\/li>\\n<li>Group name is a unique name assigned by the booking office for the purpose of\x26nbsp;establishing\x26nbsp;the identity of passengers travelling together on one or more segments.\x26nbsp;<\/li>\\n<li>SSR DOCS must be updated with complete first, middle\x26nbsp;and last names available on the passport\x26nbsp;<\/li>\\n<li>While updating SSR DOCS, if there is no last name\/first name in the passport, record the available name in the Last Name box and update FNU in the First Name box.\x26nbsp;<\/li>\\n<li>Special\x26nbsp;passport\x26nbsp;requirements for entry into the UAE:\x26nbsp;<ul>\\n<li>If\x26nbsp;the passport has two fields, one for ‘first\x26nbsp;name’\x26nbsp;and\x26nbsp;one for ‘surname’,\x26nbsp;and one of them is blank\/FNU\/LNU, the other field must\x26nbsp;contain\x26nbsp;at least two words (names).\x26nbsp;<\/li>\\n<li>If a travel document\x26nbsp;contains\x26nbsp;‘XXX’ in one of the fields, it will not be accepted.\x26nbsp;<\/li>\\n<li>Travel documents with two names added as observations\/annotations or with a second name added on any page are accepted if the names belong to the guest or to the guest’s father\x26nbsp;<\/li>\\n<li>This requirement does not apply to guests with\x26nbsp;valid\x26nbsp;UAE Emirates ID.\x26nbsp;<\/li>\\n<\/ul>\\n<\/li>\\n<\/ul>\x22,\x22lastmodified\x22:\x2202\u002D02\u002D2026\x22},{\x22heading\x22:\x22Blind guests\x22,\x22description\x22:\x22<p><b>Blind and temporarily blind guests<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Guests who are permanently blind are permitted to travel without obtaining medical clearance. Please let us know if your guest requires any specific assistance at the time of booking.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Guests who are temporarily blind are required to obtain medical clearance through\x26nbsp;<a href=\\\x22https:\/\/pulse.etihad.com\/en\u002DUS\/meda\u002Dapplication\/\\\x22 target=\\\x22_blank\\\x22>MEDIF<\/a>.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Please notify us of blind groups at least 48 hours in advance.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>All reservations must be made through an Etihad Sales Office to create a PNR. Please make sure to add an SSR to the booking, select ‘BLND’ from the drop\u002Ddown box and enter text as necessary, for instance, ‘UNACCOMPANIED’. Name and segment must be selected when you add the SSR.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Travelling with a guide dog<br>\\n\x26nbsp;<\/p>\\n<p>Guide dogs are permitted in the cargo hold for free as part of the checked baggage allowance. Always ensure that your guest has the correct permits and documentation for their pet to travel. Regulations may vary depending on the destination or country of departure, so it is always better to check well in advance.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Special assistance requests can be made through an SSR.<\/p>\x22,\x22lastmodified\x22:\x2228\u002D02\u002D2025\x22},{\x22heading\x22:\x22Etihad Priority Access\x22,\x22description\x22:\x22<p>Priority Access gives Economy guests the option to fast\u002Dtrack their airport experience with priority check\u002Din and speeding boarding, as well as priority baggage when they land. Priority Access is available to purchase through our Global Contact Centres and travel agencies, or at the airport up to\x26nbsp;90 minutes before their scheduled flight time. The ancillary will be available to purchase online in the future. Priority Access costs US $50 per person, no matter where passengers are flying to or from.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>What is Priority Access?\x26nbsp;<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Policy<\/b><\/p>\\n<ul>\\n<li>An Electronic Miscellaneous Document (EMD) will be issued.<\/li>\\n<li>Fixed price of US $50 applies – this is non\u002Drefundable.<\/li>\\n<li>Applied on an origin\/destination basis, for instance, a guest traveling from LHR to SYD will pay US $50 and get priority check\u002Din and boarding in London, then priority boarding in Abu Dhabi.<\/li>\\n<li>For stopovers, bookings require two EMDs, for instance, a guest travelling from BKK to MUC with a stopover in AUH will have to buy an EMD for BKK\u002DAUH and another one for AUH\u002DMUC – this will cost US $100.<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p><b>Procedure<\/b><\/p>\\n<p>Priority Access is available to purchase through our Global Contact Centres and travel agencies, or at the airport. An Electronic Miscellaneous Document (EMD) will be issued to fulfil the payment and the booking will be automatically updated.<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2202\u002D01\u002D2025\x22},{\x22heading\x22:\x22Hajj\x22,\x22description\x22:\x22<p>If your customers are travelling for Hajj:<\/p>\\n<p>\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D They must have a machine\u002Dreadable passport.\x26nbsp; \x26nbsp; \x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D They must fly in and out of Jeddah Airport.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If your customer is travelling for Hajj and their visa also includes the name of another person, they\x26nbsp;must travel on the same flight as\x26nbsp;the person\x26nbsp;listed.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Five litres of Zamzam water can be carried for free as checked baggage.<br>\\n<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If your customer holds a Business visit visa, they cannot enter Jeddah during the Hajj season.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guests must check the validity of their visa before they travel at <u><a href=\\\x22https:\/\/visa.mofa.gov.sa\/Home\/IssuedVisa\\\x22 target=\\\x22_blank\\\x22>visa.mofa.gov.sa<\/a><\/u>.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If they are UAE nationals or residents planning to travel from Abu Dhabi to Jeddah, they need a certificate showing they\x27ve had a seasonal flu vaccine.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If guests are transiting through Abu Dhabi and their journey didn\x27t start in the UAE, or if they have a medical condition that prevents them from getting the flu vaccine and have supporting documents, they don\x27t need to get vaccinated.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If they have been vaccinated in the past year, they are not required to have a new vaccination certificate.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Before travelling for Hajj or Umrah, guests must check the health and vaccination requirements on the <u><a href=\\\x22https:\/\/www.moh.gov.sa\/en\/HealthAwareness\/Pilgrims_Health\/Approved\u002DVaccines\/Pages\/default.aspx\\\x22 target=\\\x22_blank\\\x22>Hajj and Umrah Health Requirements<\/a><\/u>\x26nbsp;website.\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2209\u002D05\u002D2025\x22},{\x22heading\x22:\x22Groups\x22,\x22description\x22:\x22<p>A group is defined as a party of 10 or more guests in Economy, six or more in Business and four or more in First. Infants are not included in the group size.\x26nbsp;<br>\\n<\/p>\\n<p>Group bookings must be created at an Etihad Sales office or via a dedicated group system, access to which has been provided by Etihad Airways. Travel agencies are not permitted to request groups in the GDS.\x26nbsp;<\/p>\\n<p>All guests should be booked together on the same flight(s)\/ departure dates at the time of booking.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>There are two major group types:<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Adhoc Groups:\x26nbsp;<\/b><\/p>\\n<p>A party of 10 or more guests (excluding infants) traveling together on the same outbound and inbound flights and dates. This is a one\u002Doff movement for specific dates.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Series Groups:\x26nbsp;<\/b><\/p>\\n<p>Minimum of 6 consecutive movements of a similar group size (minimum of 10 guests)<\/p>\\n<p>from the same agent, or, 200 guests from the same travel agent in a travel pattern, for instance, 10 guests every Tuesday over the travel period 1 March to 31 October.\x26nbsp;<\/p>\\n<p><a href=\\\x22\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/groups\/groups\u002Dpolicy\u002Dv13.pdf\\\x22 target=\\\x22_blank\\\x22>Read more about group bookings<\/a><\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Note:<\/b><\/p>\\n<p>To know the\x26nbsp;instructions on how to do seating with Groups please view\x26nbsp;<a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/gds\u002Dentry\u002Dto\u002Dbook\u002Dancilliary\u002Dservices.pdf\\\x22 target=\\\x22_blank\\\x22>GDS entry to book Ancilliary Services<\/a>\x26nbsp;and\x26nbsp;<a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/foc\u002Dseating\u002Din\u002Damadeus.pdf\\\x22 target=\\\x22_blank\\\x22>FOC seating Amadeus.<\/a><\/p>\\n<p>\x26nbsp;<\/p>\\n<p><a href=\\\x22\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/groups\/groups\u002Demail.pdf\\\x22 target=\\\x22_blank\\\x22>Etihad Groups email contact<\/a><\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2206\u002D05\u002D2025\x22},{\x22heading\x22:\x22Longer Connection ARNK\x22,\x22description\x22:\x22<p>If a guest requests a longer connection between journeys, please add an ARNK between the segments. Adding the ARNK ensures the segments do not get cancelled during the re\u002Daccommodation process.<\/p>\x22,\x22lastmodified\x22:\x2228\u002D10\u002D2020\x22},{\x22heading\x22:\x22Branded Fares\x22,\x22description\x22:\x22<p>We’re simplifying our fares to Basic, Value, Comfort and Deluxe, giving guests the freedom to pick the perks they prefer when they fly.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Of course, they can look forward to the same signature service and outstanding hospitality with every ticket, but now they can also opt for whatever it is that’s important to them. Whether they’d like more flexibility, extra baggage or something a bit more rewarding, they’ll always find a fare that suits them.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><a href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/help\/faq\/fares#tab\u002D246165d23b\u002Ditem\u002Db2ea5188fc\u002Dtab\\\x22 target=\\\x22_blank\\\x22>See our Branded Fares<\/a><br>\\nCheck out the latest <a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/branded\u002Dfares\u002Dfaqs.pdf\\\x22 target=\\\x22_blank\\\x22>Branded Fares FAQs<\/a><\/p>\x22,\x22lastmodified\x22:\x2205\u002D08\u002D2026\x22},{\x22heading\x22:\x22Travelling with Infants\x22,\x22description\x22:\x22<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D An infant is a child aged 7 days to 23 months as of the date of commencement of travel.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Each infant must be accompanied by one adult. Each adult is only allowed to accompany one infant.\x26nbsp; This is a GCAA safety requirement.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D It is possible for one guest to book tickets for more than one infant, however they must arrange for one adult per infant.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The adult\x26nbsp;accompanying\x26nbsp;the infant must be capable of providing adequate care and\x26nbsp;assistance<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Entries for bookings with Infants:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2217%\\\x22><p>Amadeus<\/p>\\n<\/td>\\n<td width=\\\x2282%\\\x22 valign=\\\x22bottom\\\x22><p>NM1LEAVY\/PATRIC(INF\/MICHAEL\/01AUG18)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2217%\\\x22><p>Sabre<\/p>\\n<\/td>\\n<td width=\\\x2282%\\\x22 valign=\\\x22bottom\\\x22><p>\u002DI\/JACK\/LIVE*INF*05APR23<br>\\noder<br>\\nI\/JACK\/LIVE*INF<br>\\n3INFT\/JACK\/LIVE\/05APR23\u002D1<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp; If the infant\x27s name is long and does not appear on the face of the booking.\x26nbsp; Update the infant\x27s full name and date of birth in the SSR INFT field (e.g. SSR INFT EY HK1 HARRY\/TOM MSTR 15FEB24).<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\x26nbsp;<\/p>\\n<p><b>Bassinets<\/b><\/p>\\n<p>Bassinets are carried in limited quantities on Etihad aircraft and can accommodate infants up to a maximum weight of 11kgs (24lbs) and no more than 75cm on the day of travel. The infant must not exceed 11kg and must fit comfortably in the baby bassinet.<\/p>\\n<p>At the time of check\u002Din, if the infant is found to be over 11kgs (24lbs), the BSCT request will be removed and the guest will be advised. All guests with BSCT requests will be advised that cabin crew will check onboard to confirm the bassinet can be used safely.<\/p>\\n<p>Dimensions of a baby bassinet:<\/p>\\n<ul>\\n<li>Length – 29 inches (75cm)<\/li>\\n<li>Width \x26nbsp;\x26nbsp;– 13 inches (33cm)<\/li>\\n<li>Height – 8.5 inches (21cm)<\/li>\\n<\/ul>\\n<p><a href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/experience\u002Detihad\/family\u002Dtravel\/prepare\/\\\x22 target=\\\x22_blank\\\x22>Click here to know more<\/a>.<\/p>\\n<p>Please click\x26nbsp;<a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/adding\u002Dinfant\u002Dafter\u002Dticketing\u002Dpolicy\u002Dmay\u002D2022.pdf\\\x22 target=\\\x22_blank\\\x22>here<\/a>\x26nbsp;to know the GDS entries on how to add an infant after ticketing.<\/p>\\n<p>Please click\x26nbsp;<a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/product\/Infant%20with%20seat%20\u002D%20GDS%20entries.pdf\\\x22 target=\\\x22_blank\\\x22>here<\/a>\x26nbsp;to know the GDS entries on how to add an infant with a seat.\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2202\u002D02\u002D2026\x22},{\x22heading\x22:\x22Minimum Advertised Price (MAP) Policy \x22,\x22description\x22:\x22<p>Etihad Airways, the National Airline of the United Arab Emirates, invests substantial amounts of money to develop and bring to market innovative aviation products and services, including our award\u002Dwinning airport lounges, cabin interiors, and inflight offerings.\x26nbsp;\x26nbsp; We recognize that our authorized travel agents and other travel partners (collectively “<b>Trade Partners<\/b>”) also contribute to Etihad Airways’ success by investing significant time, and effort in helping promote Etihad Airways to the traveling public and educate them about our airline.\x26nbsp;\x26nbsp; To facilitate this goal, Etihad Airways has established the Etihad Airways Territorial Minimum Advertised Price Policy (“<b>MAP Policy<\/b>”).\x26nbsp; The MAP Policy is a unilateral policy of Etihad Airways and does not constitute any express or implied agreement between Etihad Airways and any other party or entity.\x26nbsp; The MAP Policy applies to Trade Partners in the <b>Territory<\/b>, which is defined below<b>.<b>[1]<\/b><\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Under the<b> MAP Policy,<\/b> Trade Partners and other promoters and distributors of Etihad Airways products and services in the Territory may not advertise, promote, or publish to the general public any passenger fare or ticket distributed by Etihad Airways within the Territory for a price that is less than that of the Etihad Airways Current Published Fare.\x26nbsp; The Etihad Airways Current Published Fare is the fare distributed by Etihad Airways and displayed in the applicable global distribution system(s) (“<b>GDS<\/b>”), including all applicable taxes, charges, surcharges, and\/or other fees displayed in the applicable GDS(s).\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>The MAP Policy applies to all advertisements by Trade Partners that include any Etihad Airways passenger fares in any media, including but not limited to flyers, posters, Internet sites, metasearch sites or other electronic formats, social media sites, newspapers, magazines, catalogues, television, radio, and public signage.\x26nbsp;\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Etihad Airways, at its sole discretion, reserves the right to discontinue doing business with and\/or terminating inventory access to any Travel Partner or other party that violates Etihad’s MAP Policy.\x26nbsp; Etihad Airways will enforce MAP Policy at its sole discretion and without notice.\x26nbsp; Trade Partners have no right to enforce the MAP Policy – it is a unilateral policy of Etihad Airways.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>[1] \x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; As of this update, the Territory consists of the United States, Canada, Republic of South Africa, United Arab Emirates, Saudi Arabia, Oman, Kuwait, Bahrain, India, Philippines, Thailand, Egypt, Singapore, Pakistan, Malaysia, and Hong Kong SAR (China).<\/p>\x22,\x22lastmodified\x22:\x2227\u002D05\u002D2024\x22},{\x22heading\x22:\x22Pets in Cabin (PETC)\x22,\x22description\x22:\x22<p>Pets in the cabin (PETC) will not be permitted in First and The Residence on EY flights.\x26nbsp; This does not affect trained service animals (SVAN) in First and The Residence, which will continue to be accepted as per our existing SVAN policy.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Pet dogs or cats in cabin<\/p>\\n<ul>\\n<li>Cats and Dogs are the only pets permitted to be carried on Etihad Airways flights.<\/li>\\n<li>Pets are permitted to be carried in Economy and Business cabins only. Pets cannot be carried in the First cabin and The Residence.<\/li>\\n<li>Pets are permitted on direct EY routes to, from or via Abu Dhabi on EY marketed (607 stock) and operated flights<\/li>\\n<li>These are only bookable through Etihad Contact Centres<\/li>\\n<li>Guests must be at least 18 years of age to be eligible to transport a pet.<\/li>\\n<li>It is permitted for a guest to bring one (1) cat or one (1) dog as a pet in the cabin<\/li>\\n<li>The maximum number of pets in the cabin per flight is as per the table below:<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x22100%\\\x22 colspan=\\\x225\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>MAXIMUM NUMBER OF PETS CAT\/DOG IN CABIN<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Aircraft Type<\/b><\/p>\\n<\/td>\\n<td width=\\\x2210%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>First<\/b><\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Business<\/b><\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Economy<\/b><\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Max per flight<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>A321LR<\/p>\\n<\/td>\\n<td width=\\\x2210%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>4<\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>4<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Narrow body (other)<\/p>\\n<\/td>\\n<td width=\\\x2210%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>1*<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>4<\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>4<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Wide body<\/p>\\n<\/td>\\n<td width=\\\x2210%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>2**<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>8<\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>8<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p><b>* <\/b>May be increased to a total of two (2) where two (2) passengers are travelling together and wish to bring one (1) pet each from the same household\/family.<\/p>\\n<p><b>** <\/b>May be increased to a total of three (3) where two (2) passengers are travelling together and wish to bring one (1) pet each from the same household\/family.<\/p>\\n<p><b>\x26nbsp;<\/b><\/p>\\n<p><b>Note: <\/b>Each pet must be in a separate travel kennel crate.<\/p>\\n<p>\x26nbsp;<\/p>\\n<ul>\\n<li>On a flight with falcons(s) travelling in the cabin, a pet (dog or cat) cannot travel in the same travel cabin as the falcon(s). If a guest is travelling with a pet dog or cat in the cabin and another guest is travelling with a falcon in the same class on the same flight, the request of the guest who made the first reservation shall be confirmed.<\/li>\\n<\/ul>\\n<ul>\\n<li>Where a guest with an allergy statement and a guest with <b><u>a pet<\/u><\/b> request are travelling on the same flight, the request of the guest who made the first reservation will be confirmed.<\/li>\\n<\/ul>\\n<ul>\\n<li>If a guest travelling with a pet dog or cat in the cabin and a guest travelling with a trained service animal is on the same flight, the request of the guest wishing to travel with a trained service animal will always take priority regardless of time of reservation.<\/li>\\n<\/ul>\\n<ul>\\n<li>The container (pet travel bag or kennel) must be within the maximum weight and dimension requirements for the applicable travel class (refer to sections 3.1 and 3.2) and must meet the following requirements:<\/li>\\n<\/ul>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The pet should be able to sit and stand in a natural position with its head fully erect (without touching the roof), turn around and lie down<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The carrier must be ventilated on at least three (3) surfaces<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The carrier must be escape\u002Dproof (rigid door for kennels \/ secure entrance for pet travel bag) and leak proof<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The container floor must contain absorbent material<\/p>\\n<ul>\\n<li>The guest will provide:<\/li>\\n<\/ul>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Absorbent material for inside the container, including sufficient spares and disposal bags<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Dry food in a sealed container for the animal, sufficient for the duration of the journey.<\/p>\\n<ul>\\n<li>The pet must not be allowed outside the pet travel bag or kennel whilst on board the aircraft.<\/li>\\n<\/ul>\\n<ul>\\n<li>The pet must be of a minimum of 16 weeks old.<\/li>\\n<\/ul>\\n<ul>\\n<li>In Economy Cabin,<\/li>\\n<\/ul>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; For under\u002Dseat carriage, the pet must be able to fit in a pet travel bag or kennel with maximum dimensions of 40 x 40 x 22 cm (L x W x H) to fit safely under the seat.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; For carriage on an adjacent purchased seat, the pet must be able to fit in a pet travel bag or kennel with maximum dimensions of 50 x 43 x 50 cm (L x W x H).<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The pet travel bag or kennel shall be secured to the seat with extension seat belts.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The gross weight (pet and travel bag\/kennel combined) should be no more than 8 kg.<\/p>\\n<ul>\\n<li>In Business Cabin,<\/li>\\n<\/ul>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; It is not possible to stow pets under seats.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; An extra seat must be purchased adjacent to the accompanying guest and the pet shall be in a pet travel bag or kennel with maximum dimensions of 50 x 43 x 50 cm (L x W x H).<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Contact Centre agent must ensure that there are adjacent seats available on the aircraft and block them before accepting the carriage of pet request. If there are no adjacent seats, an alternate flight must be offered.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The gross weight (pet and travel bag\/kennel combined) must not be more than 8 kg.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Where two (2) passengers travelling together wish to bring one (1) pet each (i.e., two (2) pets in total) in Business, an additional seat shall be purchased for each pet.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Where an additional seat has been purchased, the passenger is entitled to the additional checked baggage allowance associated with the purchased seat.<\/p>\\n<ul>\\n<li>Where possible, the guest travelling with a pet should be allocated a window seat. A guest travelling with a pet will not be seated in any of the following locations:<\/li>\\n<\/ul>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Bulkhead rows<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Emergency exit rows<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; One row forward and aft of over\u002Dwing exit rows<\/p>\\n<ul>\\n<li>Standard Seat will be provided free of charge for a guest travelling with a pet (SSR PETC) within 48 hours of departure.<\/li>\\n<\/ul>\\n<ul>\\n<li>Guests must submit the booking form at least 7 days in advance and provide all necessary documents to the Contact Centre no later than <b>72 hours<\/b> prior to intended travel. Where three (3) pets will be carried as permitted, a separate form must be completed for each pet<\/li>\\n<\/ul>\\n<ul>\\n<li>SSR PETC can be updated in the booking only by EY agents and it must be updated only after receiving all approvals<\/li>\\n<li>For guests using the Etihad Chauffeur service, or connecting Etihad Shuttle services in the UAE, pets are permitted on these services in accordance with this policy<\/li>\\n<li>For guests eligible to use premium lounges, pets may be taken into Etihad lounges in Abu Dhabi. For lounges in network airports, access is dependent upon the acceptance policy of the lounge operator. Pets must always remain inside the pet carrier or kennel<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p><b><u>Booking Process<\/u><\/b><\/p>\\n<p>Note:\x26nbsp;<b>SSR \x26quot;PETC\x26quot; can only be updated by Etihad once the documents are received and approved<\/b><\/p>\\n<ol>\\n<li>Complete \x26amp; submit the\x26nbsp;<a href=\\\x22https:\/\/www.etihad.com\/en\u002Dae\/fly\u002Detihad\/baggage\/travelling\u002Dwith\u002Dpets#pets\u002Don\u002Dboard\u002Dwrapper\\\x22 target=\\\x22_blank\\\x22>booking form<\/a>,\x26nbsp;at least seven days prior to travel \x26amp; email supporting documents no later than 72 hours before the flight to\x26nbsp;<a href=\\\x22mailto:pets@etihad.ae\\\x22>pets@etihad.ae<\/a><\/li>\\n<li>For travel to Abu Dhabi, a\x26nbsp;<a href=\\\x22https:\/\/www.etihad.com\/content\/dam\/eag\/etihadairways\/etihadcom\/Global\/pdf\/petc\u002Dforms\/veterinary\u002Dhealth\u002Dcertificate\u002Dfor\u002Dexporting\u002Dcats\u002Dand\u002Ddogs\u002Dto\u002Dthe\u002Dunited\u002Darab\u002Demirates\u002Dey604.pdf\\\x22 target=\\\x22_blank\\\x22>UAE Health Certificate<\/a>\x26nbsp;form needs to be completed.\x26nbsp;This must be signed \x26amp; stamped by a government\u002Daccredited health official from the country of departure, within five days of the flight departure<\/li>\\n<li>If\x26nbsp;Abu Dhabi is the final destination,\x26nbsp;it is compulsory to apply for a\x26nbsp;<a href=\\\x22https:\/\/www.moccae.gov.ae\/en\/services\/export\u002Dimport\u002Dservices\/import\u002Dpermit\u002Dpets.aspx\\\x22 title=\\\x22 https:\/\/www.moccae.gov.ae\/en\/services\/export\u002Dimport\u002Dservices\/import\u002Dpermit\u002Dpets.aspx\\\x22 target=\\\x22_blank\\\x22>release permit<\/a>\x26nbsp;<\/li>\\n<li>Acceptance will only be granted once all the necessary health documents \x26amp; important licenses have been obtained<\/li>\\n<li>Acceptance from\x26nbsp;<a href=\\\x22mailto:pets@etihad.ae\\\x22>pets@etihad.ae<\/a>\x26nbsp;along with the original\x26nbsp;documents will be required for verification at the airport\x26nbsp;<\/li>\\n<\/ol>\\n<p>\x26nbsp;<\/p>\\n<p>Anyone travelling to Abu Dhabi with a pet or service dog must obtain an Abu Dhabi Customs Bill of Entry document at least 24 hours before their departure. To receive it, you need to submit the following documents to NOATUM Logistics:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; UAE residents: Emirates ID copy<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Non\u002Dresidents: passport copy\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; An import permit for your pet or service dog\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Your mobile number\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; A copy of your reservation or ticket<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>NOATUM Logistics will review your information and email you the Bill of Entry, which costs AED 365.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>How much does it cost?<\/b><\/p>\\n<p>The rates for carrying a pet cat or dog:<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>\x26nbsp;Economy<\/b><\/p>\\n<ul>\\n<li><p>It costs USD\x26nbsp;399 or 50,000 Etihad Guest Miles for each way to travel with a cat or dog in Economy<\/p>\\n<\/li>\\n<li><p>If guests are transiting, the combined price of USD\x26nbsp;798 or 100,000 Etihad Guest Miles will apply<\/p>\\n<\/li>\\n<li><p>If an adjacent seat booking is requested, it must be done in advance, and guests will be charged for the cost of an extra seat plus USD 399 each way<\/p>\\n<\/li>\\n<li><p>If an additional seat is purchased for a pet, then guests are entitled to the additional check baggage allowance associated with the purchased seat<\/p>\\n<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p><b>Business<\/b><\/p>\\n<ul>\\n<li><p>As there is no space available under the seat, guests must purchase an extra seat for their pet<\/p>\\n<\/li>\\n<li><p>This must be booked in advance and the guest will be charged for the cost of an extra seat plus USD 399 each way<\/p>\\n<\/li>\\n<li><p>Guests are entitled to the additional check baggage allowance associated with the purchased seat<\/p>\\n<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p>To pay using Etihad Guest Miles, please <a href=\\\x22https:\/\/www.etihad.com\/en\/help\/contact\u002Dus\\\x22 target=\\\x22_blank\\\x22>call us<\/a>.\x26nbsp;\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Terms \x26amp; Conditions:<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Etihad Airways will not be responsible if authorities in other countries refuse entry of your pet due to non\u002Dcompliance with local regulations. Etihad will in this case, not be liable for any resulting costs such as flight rebooking charges, hotel accommodation if Etihad have to refuse the carriage of your pet due to non\u002Dcompliance with the regulations<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D We assume no liability for the health or wellbeing of pets carried in the cabin<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The pet must be able to sit and stand in a natural position with its head fully erect (without touching the roof), turn around and lie down<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The carrier must be ventilated on at least three (3) surfaces<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The carrier must be escape\u002Dproof (rigid door for kennels or secure entrance for pet travel bag) and leak\u002Dproof<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The container floor must contain absorbent material.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guests are responsible for additional costs for import or export.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Pregnant pets cannot be accepted for travel.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guests must report 3 hours prior to departure at the airport.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guest must bring enough of absorbent sheets for your pet to relieve itself, including connecting flights and transit airport, if applicable<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guest can only carry dry pet food in your cabin baggage. Food should be carried in a sealed container so the smell does not disturb other guests<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If there are guests travelling on\u002Dboard that are allergic to animals, our crew may be required to re\u002Dseat you and your pet. In rare occurrences, we may need to re\u002Dbook your flight<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Sedation of animals, except under certain conditions and carried out under veterinary supervision, is not recommended. Commonly used tranquilizers lower blood pressure, which also occurs at high altitude<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The combination of high altitude and medicines could be dangerous for old, chronically sick or stressed animals. Keeping a container in a dark, cool, quiet place prior to flying will calm down most animals. If you have to sedate your pet per veterinarian’s instruction, the name of the drug and time of intake must be clearly marked on the container<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guests must complete all formalities upon arrival at Abu Dhabi airport according to UAE regulations, including an inspection by the Ministry of Climate Change and Environment (MOCCAE) veterinary officer, performed in the Customs clearance area.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D For all other destinations, guests must complete all arrival formalities according to local regulations.<br>\\n<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Inspection and clearance areas may vary from airport to airport, guests must check with the applicable authority at their destination for specific requirements.<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><u><b>Changes and Refunds:<\/b><\/u><\/p>\\n<p><b>Voluntary changes<\/b>:\x26nbsp;The guest can change the request anytime up to 3 hours to departure time. However, if the guest wishes to take the pet on the new dates\/flight, they’d need to inform Etihad Airways and go through the approval process again. The guest will still be liable of ensuring that the required documents, certificates, permits allow for the pet to travel on the rebooked flight.\x26nbsp;\x26nbsp;The same process applies to guests who wish to upgrade their ticket to a higher class of travel.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Involuntary changes<\/b>:\x26nbsp;Etihad Airways will coordinate with the guest and provide the best available options in cases where the flight has been re\u002Dbooked or cancelled. For delays or flight cancellations, the guest may utilize the original animal documentation.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Refunds<\/b>:\x26nbsp;A full refund is only given for cases where Etihad had an irregular operation and was not able to transport the pet. In this case, the guest can reach out to our contact centers and request for a refund to the fees that were paid. The guest can request for a full refund for the fees that were paid for transporting the pet if the options that Etihad Airways have provided does not meet their needs, provided that the pet was not transported from the country of origin. If Etihad Airways was able to transport the pet on another flight\/date or even airline after obtaining the guest’s consent, then refund is not allowed.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Country restrictions<\/b><\/p>\\n<p>Due to government or operational restrictions, guests cannot travel with their pet, falcon, or service dog on the following routes:<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Countries<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Falcons<\/b><\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Pets (PETC)<\/b><\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Service Animals (SVAN)<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Australia<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To Melbourne (MEL)<br>\\nTo\/from Sydney (SYD)<\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To Sydney (SYD)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Cambodia<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Phnom Penh (KTI)<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>China<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x2
