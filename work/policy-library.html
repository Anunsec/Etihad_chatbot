22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Bali (DPS)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Malaysia<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Kuala Lumpur (KUL)<\/p>\\n<p style=\\\x22text\u002Dalign: center;\\\x22>(only trained service dogs below 8 kg are permitted)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Maldives<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Male (MLE)<\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Male (MLE)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>South Africa<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Johannesburg (JNB)<\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Johannesburg (JNB)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Spain<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Palma di Mallorca (PMI)<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Taiwan<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Taipei (TPE)<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To Taipei (TPE)<\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To Taipei (TPE)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Thailand<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Krabi (KBV)<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Krabi (KBV)<\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Krabi (KBV)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>UK<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To all stations<\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>USA<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To all stations<\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Vietnam<\/b><\/p>\\n<\/td>\\n<td width=\\\x2214%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Hanoi (HAN)<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Hanoi (HAN)<\/p>\\n<\/td>\\n<td width=\\\x2236%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Hanoi (HAN)<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p><b>Special requirements:<\/b><\/p>\\n<p><b>\x26nbsp;<\/b><\/p>\\n<p><b>1.\x26nbsp;\x26nbsp;\x26nbsp; Malaysia:<\/b><\/p>\\n<p>For guests travelling with Pets (PETC) and service dogs to\/from Malaysia, the below conditions apply:<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Only small size pets and service dogs (up to 8kg) are permitted<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Pets and service dogs must always be kept in a cage<\/p>\\n<p>·\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Airport authorities reserve the right to stop pets and service dogs from passing through the airport terminal if they display inappropriate behavior<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>2.\x26nbsp;\x26nbsp;\x26nbsp; Bahrain:<\/b><\/p>\\n<p>Bahrain airports will only accept pets that do not exceed 6Kg (including the carrier)<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>3.\x26nbsp;\x26nbsp;\x26nbsp; Ireland:<\/b><\/p>\\n<p>Pre\u002Dnotification of any PETC into Ireland must be sent at least 24 hours in advance of arrival\x26nbsp;via email to\x26nbsp;<a href=\\\x22mailto:petmove@agriculture.gov.ie\\\x22 target=\\\x22_blank\\\x22>petmove@agriculture.gov.ie<\/a>.<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2221\u002D08\u002D2026\x22},{\x22heading\x22:\x22The Residence\x22,\x22description\x22:\x22<p>The Residence provides the ultimate luxury experience in the sky, offering a three\u002Droom suite designed by top interior designers and hospitality experts. The living room features a double seat sofa, ottoman, dining table, drinks cabinet and a 32\u002Dinch flat screen TV. A soft carpeted hallway leads to your private bathroom with ensuite shower, where you can immerse yourself in exclusive toiletries and sink into plush bathrobes. The bedroom is decorated with delicate fabrics and furnished with a neutral fibre mattress double bed, Egyptian cotton sheets and a selection of pillows for your comfort. Our dedicated team will also be available throughout the flight to cater to your every need.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>The Residence can be booked through the following channels:\x26nbsp;<\/p>\\n<ul>\\n<li>\u002D Etihad Airways website\x26nbsp;<\/li>\\n<li>\u002D Etihad Airways contact centre\x26nbsp;<\/li>\\n<li>\u002D Etihad Reservation and Ticketing offices\x26nbsp;<\/li>\\n<li>\u002D NDC\x26nbsp;<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p>To book The Residence, you can initially book guests in First (RBDs F\x26amp;A) and contact one of the available channels for an upgrade. This is valid on Etihad Airways\u002Doperated flights for a maximum of two guests, including one infant, who can be booked on the same PNR.\x26nbsp;\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>If an infant is the second passenger, an approved car seat can be carried as The Residence does not have a bassinet, otherwise the infant must travel on the adult’s lap. There is no child or infant discount, and both passengers must be on the same PNR to book for two.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>For any group bookings where one or two members want to travel in The Residence, then the PNR must be split. Afterwards, The Residence process must be followed.\x26nbsp; \x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Single booking PNRs can only be upgraded to add an additional guest before the travel date. To include the additional guest, you must first cancel the original booking and create a new one that includes two guests. This will not be possible on the travel date or after travel has commenced.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;There is an Automatic Issuance Limit of one hour for The Residence ancillary and standard processes must be followed for chauffeur services.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Changes\x26nbsp;<\/b><\/p>\\n<p>If a guest wants to rebook The Residence on another date, this can be done through our contact centre if it\x27s available on the changed date. In case The Residence isn\x27t available on the new date, the EMD can be refunded back to the original FOP.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Refund\x26nbsp;<\/b><br>\\n<\/p>\\n<p>Full refunds on The Residence bookings may be processed before departure. However, in case of no shows, the EMD is non\u002Drefundable. First tickets will be refunded according to Etihad’s fare rules.\x26nbsp;<\/p>\\n<p>If a guest cancels a booking in The Residence, then they may be rebooked in First subject to seat availability.\x26nbsp;<\/p>\\n<p>If The Residence is not provided to the guest due to involuntary reasons, the EMD can be refunded free of charge.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>FAQs<\/b><\/p>\\n<p>1.\x26nbsp;Can changes be made on the day of departure for free?<\/p>\\n<p>Yes, changes are permitted free of charge on the day of departure.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>2.\x26nbsp;Is this ancillary service filed in USD regardless of origin?<\/p>\\n<p>Yes, it’s filed in USD and then converted to the payment currency.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>3.\x26nbsp;Can one adult carry two infants provided they bring a car seat? Can the car seat be strapped on to the seat in The Residence?\x26nbsp;\x26nbsp;<\/p>\\n<p>For safety reasons, only one infant or child is allowed to travel with an adult in The Residence. If the second passenger is an infant, a car seat approved for air travel may be used.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>4.\x26nbsp;\x26nbsp;Is it possible to add one more guest to stay in The Residence apart from the two initial guests?<\/p>\\n<p>It’s not possible to accommodate more than two guests in The Residence due to safety regulations, which mandate that the bedroom is limited to two guests and the seating area is limited to two persons during taxi, take\u002Doff and landing.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2224\u002D07\u002D2023\x22},{\x22heading\x22:\x22UK Air Passenger Duty (APD or GB tax)\x22,\x22description\x22:\x22<p>Young guests under 16 years of age travelling in Economy from a UK airport do not have to pay UK Air Passenger Duty (APD or GB tax). This tax exemption is automatic for infant and child fares.<\/p>\\n<p>\x26nbsp;\x26nbsp;<\/p>\\n<p><b>Policy<\/b><\/p>\\n<p>Children under the age of 16 travelling in economy class from a UK airport are not subject to APD (GB).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Agents should ensure that APD does not apply to these cases prior to ticketing and exemption if they meet the eligibility requirements below:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>\u002DThe guest is aged between 12 and 16 at the time of travel (before their 16th birthday).<br>\\n<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>\u002D The flight is from a UK airport<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>\u002D The guest is travelling in economy class<\/p>\x22,\x22lastmodified\x22:\x2201\u002D03\u002D2024\x22},{\x22heading\x22:\x22Codeshare\x22,\x22description\x22:\x22<p>Code sharing is a marketing agreement where an airline places its designator code on a flight operated by another airline and sells tickets for that flight.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>If two or more airlines publish and market the same flight as part of their published timetable or schedule, they will do so using their respective airline designator (airline flight code). This type of commercial agreement is known as a <b>codeshare agreement<\/b> or simply as a codeshare.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Policy<\/b><\/p>\\n<p>1) Reserving seats:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>a. All guests travelling in Economy and Business class can reserve seats using the seat map available for Amadeus hosted carriers.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>b. Guests travelling in Business class can make a general seat request (SSR SEAT) on non\u002DAmadeus hosted carriers.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>2) Special Services Request (SSR):<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>a. SSR UMNR, STCR, EXST, CBBG etc. are not permitted on codeshare flights<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>b. SSR CHLD, INFANT \x26amp; Contact SSRs (CTCM, CTCE, CTCH) are the only SSRs accepted for reservations on Air Arabia (3L). No other SSRs are permitted.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>3) Changes:\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>a. Tickets must be reissued when a change is made to a booking.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>4) Schedule change:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>a. All “schedule changed” PNRs fall into the queue of the respective booking office. It is the responsibility of the booking agent to action these bookings.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>b. For Amadeus hosted airlines, ticket revalidation is permitted only in the event of \x26quot;schedule changes”. This is automated. For all other GDS hosted carriers, the ticket must be reissued.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>c. It is the responsibility of the disrupting carrier to re\u002Dbook the guest on next available flight from origin to destination, when the change is within the DCS window i.e. within 72hrs prior to departure. Codeshare team has no visibility of the changes. Agents must follow the disruption policy if the operating carrier has not provided alternates.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>5) UN\/UC\/NO status codes:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>a. Itineraries with UN\/UC\/NO status codes must be rebooked on the next available connection according to the policy.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>6) Group Bookings:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>a .Group Bookings are not permitted on Codeshare flights.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>7)\x26nbsp;Ancillaries: <\/p>\\n<p>iEMD is available on blockspace flights operated by Akasa Airlines (QP) and Air Seychelles (HM). Guests will be able to purchase Seats and Extra baggage for travel on\/after 29 January 2026. <\/p>\\n<p>  <\/p>\\n<p>The ancillaries will be available for purchase through direct channels. <\/p>\\n<p>  <\/p>\\n<p>Booking Timeframes <\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;⦁ Seat selection will be available up to 72 hours before departure <\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;⦁ Extra baggage will be available up to 4 hours before departure <\/p>\\n<p>\x26nbsp;<\/p>\\n<p>  <\/p>\\n<p>Important Notes <\/p>\\n<p>\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;⦁ Standard Etihad ancillary rules will apply <\/p>\\n<p>\x26nbsp;<\/p>\\n<p style=\\\x22text\u002Dalign: left;\\\x22><b><u>Codeshare Partner Table<\/u><\/b><\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>No<\/b><\/p>\\n<\/td>\\n<td width=\\\x2253%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Airline Name<\/ 02Dalign: center;\\\x22>TUNIS AIR<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>TU<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>45<\/p>\\n<\/td>\\n<td width=\\\x2253%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Turkish Airlines<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>TK<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>46<\/p>\\n<\/td>\\n<td width=\\\x2253%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>UZBEKISTAN AIRWAYS\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>HY<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>47<\/p>\\n<\/td>\\n<td width=\\\x2253%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Vietnam Airlines<\/p>\\n<\/td>\\n<td width=\\\x2235%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>VN<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2210\u002D07\u002D2026\x22},{\x22heading\x22:\x22Interline Ticketing\x22,\x22description\x22:\x22<p>Interline agreements between airlines make travel faster and more convenient for guests who may need to take multiple flights on more than one airline to reach their final destination.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>These agreements allow guests to travel on various airline networks on a single booking.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>The key advantages of an Interline agreement are:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Offers guests more destination options.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The convenience of a single reservation.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Gives guests the peace of mind that their itineraries include adequate time for connecting flights.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Boarding passes and checked baggage to the final destination of the guests.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Types of Agreements<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22><b>\u002D Unilateral Interline Agreement:<\/b> An agreement that allows only one airline to sell the flights of another airline using its own ticket stock.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22><b>\u002D Bilateral Interline Agreement:<\/b> An agreement that allows both airlines to sell each other’s flights on their own ticket stock.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22><b>\u002D Multilateral Agreement:<\/b> An agreement where passengers and cargo use a standard traffic document (i.e. a ticket or airway bill) to travel on multiple forms of transport involved in a routing to reach a final destination.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Guidelines<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Reservations must be made directly with the operating airline for unaccompanied minors (UMNR) and group bookings.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Passive and Open segments are not permitted.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Ticket revalidation is not permitted.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Exchange from paper ticket to e\u002Dticket is not permitted.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D When booking a journey on Air Arabia Abu Dhabi (3L codeshare) at least one EY prime air segment must be present directionally (Etihad Shuttle bookings are not permitted in the combination).<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Travel Agent PNRs\/bookings must be amended by the booking source only. Etihad Airways will not take control if booked as an Interline. This applies to schedule changes as well.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><a href=\\\x22\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/interline\u002Dpartner\u002Dtable.pdf\\\x22 target=\\\x22_blank\\\x22>Interline Partner Table\x26nbsp;<\/a><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px; text\u002Dalign: left;\\\x22>\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2203\u002D02\u002D2026\x22},{\x22heading\x22:\x22Medical travel insurance\x22,\x22description\x22:\x22<p>Effective <b>01 July 2026<\/b>, Etihad Airways is partnering with Abu Dhabi\x27s Department of Culture and Tourism (DCT) to introduce Ziyarah; Etihad’s inbound emergency health insurance plan. This plan, provided by Daman, automatically provides free health insurance for international visitors landing in the UAE on qualifying tickets.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>The Ziyarah plan is available exclusively to tourists who travel to or through Abu Dhabi on Etihad Airways between <b>1 July 2026 and 31 December 2026<\/b>.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>For more information on eligibility, coverage, exclusions, claims, and policy conditions, click on the button below.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><a href=\\\x22https:\/\/www.etihad.com\/en\/plan\/travel\u002Dessentials\/medical\u002Dtravel\u002Dinsurance\\\x22 target=\\\x22_blank\\\x22>Read more<\/a><\/p>\x22,\x22lastmodified\x22:\x2209\u002D07\u002D2026\x22}],\x22defaultsortoption\x22:\x22mostrecent\x22,\x22dropdownlabel\x22:\x22Sort by\x22,\x22dateFormatLang\x22:\x22false\x22,\x22dropdownValueText\x22:\x22Select\x22,\x22alphabeticalSortLabel\x22:\x22Alphabetical (A\u002DZ)\x22,\x22isDefaultSortEnabled\x22:\x22false\x22,\x22monthTransaltion\x22:[{\x22value\x22:\x22January\x22,\x22key\x22:\x221\x22},{\x22value\x22:\x22February\x22,\x22key\x22:\x222\x22},{\x22value\x22:\x22March\x22,\x22key\x22: 	var accordiondata = JSON.parse("{\x22aemdata\x22:{\x22mostRecentLabel\x22:\x22Most recent\x22,\x22updatedText\x22:\x22Updated\x22,\x22accordions\x22:[{\x22heading\x22:\x2224 Hours Cooling\u002Doff Period Policy \x22,\x22description\x22:\x22<p>The “24 Hours Cooling off Period” policy allows guests to:<\/p>\\n<p>\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22><b>1)Hold a reservation with guaranteed fare quote (applies to POS US and Canada only):<\/b><\/p>\\n<p>A stored fare quote is guaranteed for 24 hours from the time of booking provided following conditions are met:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D First flight segment on the itinerary must be at least 7 days in advance<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Advance purchase (AP) conditions of fares must be followed<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Ticket time limit (TTL) conditions of fares must be followed<\/p>\\n<p>Agents must ensure that they update endorsement of the ticket with “C24” for audit and tracking purposes.<b>\x26nbsp;\x26nbsp;<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22><b>2)Cancelling a paid reservation:<\/b><br>\\n<\/p>\\n<p>Agent may cancel their ticketed booking free of charge if the following conditions are met:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Applies to all point\u002Dof\u002Dsales.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Applicable only for new bookings\/original ticket.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Ticket is purchased at least 7 days before the departure date.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Refund requests must be submitted within 24 hours of ticket issuance.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Additionally, a ticket purchased in India may be cancelled without penalty within the 48 hours of issuance, provided the departure is at least 15 days away for international flights.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\x26nbsp;<\/p>\\n<p>All fare rules have been updated to automatically apply the policy for cancellations within 24\/48 hours.\x26nbsp;\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Waiver code\x26nbsp;<b>C24<\/b>\x26nbsp;must be used to indicate the override. For refunds, the code must be updated as a historical remark in the PNR.<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>New bookings<\/b><\/p>\\n<p>Every guest must be made aware of Etihad’s 24 or 48 hour cooling off policy at the time of booking. Make sure to update the PNR with “Guest advised of 24 or 48 hour policy”.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Changes<\/b><\/p>\\n<p><b>Not permitted and C24 will apply only for refunds.<\/b><\/p>\\n<p><b>Exception:\x26nbsp;<\/b>For POS India only, tickets can be changed “Free of Charge” if it is issued for travel 15 days or more in advance of departure and within 48 hours of ticket issuance.<\/p>\\n<p>To reissue a ticket, the waiver must be applied manually and the code (C24) must be entered in the tour code box. Any difference in fare must be settled by the guest.<\/p>\\n<p>Name correction is not included.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Refunds<\/b><\/p>\\n<p>Cancelled tickets can be fully refunded within 24 hours of being issued, so long as the ticket has been issued for travel at least seven days in advance. Additionally, a ticket purchased in India may be cancelled without penalty within the 48 hours of issuance, provided the departure is at least 15 days away for international flights.<\/p>\\n<p>Payments must be refunded to the original form of payment and processed within 24 hours.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Always enter the code\x26nbsp;<b>C24<\/b>\x26nbsp;in:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>⦁\x26nbsp; \x26nbsp;Tour code box when the ticket is reissued<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>⦁\x26nbsp; \x26nbsp;Remarks in PNR when the refund is processed through GDS<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>⦁\x26nbsp; \x26nbsp;Remarks in PNR when the refund is applied through the BSP link (refunds through BSP must be applied within 24 hours of the ticket being issued)<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>*Same code applies for POS India where 48 hours flexibility is applied.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Follow the below rules if you need to refund non\u002Drefundable taxes with C24:<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2215%\\\x22><p><b>Country<\/b><\/p>\\n<\/td>\\n<td width=\\\x2212%\\\x22><p><b>Tax Code<\/b><\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p><b>Remarks<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2215%\\\x22 rowspan=\\\x223\\\x22><p>Egypt<\/p>\\n<\/td>\\n<td width=\\\x2212%\\\x22><p>XL<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2212%\\\x22><p>Q7<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2212%\\\x22><p>S4<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2215%\\\x22><p>Saudi Arabia<\/p>\\n<\/td>\\n<td width=\\\x2212%\\\x22><p>E3<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2215%\\\x22><p>Philippines<\/p>\\n<\/td>\\n<td width=\\\x2212%\\\x22><p>PH<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>Non\u002DRefundable after 30 days of ticket issuance. Can be refunded while applying C24<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2215%\\\x22><p>US<\/p>\\n<\/td>\\n<td width=\\\x2212%\\\x22><p>US\/ZP\/XF<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>Non\u002DRefundable for non\u002Drefundable fares, but can be refunded while applying C24\x26nbsp;or schedule change<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2215%\\\x22><p>India<\/p>\\n<\/td>\\n<td width=\\\x2212%\\\x22><p>K3<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>K3 tax can be refunded provided the request is made within the cut off dates for the Indian financial year. The financial year runs from 01 April of any given year to 31 March of the following year. The refund cut off is 31 October. e.g. For tickets issued during the financial year 01 April 2023 \u002D 31 March 2024, K3 tax refund is to be allowed till 31 Oct 2024.<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2215%\\\x22><p>Pakistan<\/p>\\n<\/td>\\n<td width=\\\x2212%\\\x22><p>N9<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2215%\\\x22><p>Jordan<\/p>\\n<\/td>\\n<td width=\\\x2212%\\\x22><p>O7<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2215%\\\x22><p>Dominican Republic<\/p>\\n<\/td>\\n<td width=\\\x2212%\\\x22><p>L8<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2215%\\\x22><p>Lebanon<\/p>\\n<\/td>\\n<td width=\\\x2212%\\\x22><p>YL<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>Non\u002DRefundable, but can be refunded while using C24<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2215%\\\x22><p>Portugal<\/p>\\n<\/td>\\n<td width=\\\x2212%\\\x22><p>J9<\/p>\\n<\/td>\\n<td width=\\\x2272%\\\x22><p>Non\u002Drefundable for non\u002Drefundable fares, but can be refunded while applying C24 or schedule change<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p>Any Electronic Miscellaneous Document (EMD) issued for an ancillary service can be refunded provided the ancillary is issued with the ticket (on the same day).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Booking Fee (GSF\/ OB fee) charged at the time of ticket issuance will be non\u002Drefundable.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Refunds may take at least seven working days to be credited.<\/p>\x22,\x22lastmodified\x22:\x2227\u002D08\u002D2026\x22},{\x22heading\x22:\x22Return date out of system range\x22,\x22description\x22:\x22<p><b>Introduction<\/b><\/p>\\n<p>For dates of return travel that fall beyond 360 days in the future.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Policy<\/b><\/p>\\n<ul>\\n<li><p>Guests can book tickets with Etihad Airways up to 360 days in the future<\/p>\\n<\/li>\\n<li><p>If their journey includes onward or inbound dates that fall outside the 360\u002Dday limit from their original booking date, then guests can change one date free of charge once those dates become available in the booking system<\/p>\\n<p>\x26nbsp;<\/p>\\n<\/li>\\n<\/ul>\\n<p><b>The text below shall be added in the CAT16 rule data for such fares:<br>\\n<\/b><\/p>\\n<p>ONE DATE CHANGE PERMITTED FOC WHEN RETURN DATE OUT OF RANGE. RETURN DATE MUST BE SPECIFIED AT TIME OF ORIGINAL BOOKING. IF ORIGINAL RBD IS NOT AVAILABLE THEN ANY FARE DIFFERENCE SHALL APPLY.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Procedure<\/b><\/p>\\n<p>Reservation and Ticketing Agents need to book the last available date in the system and add a remark in the PNR with the traveller’s return date agreed at the time of booking. The return date can be changed to the pre\u002Dnotified date when it becomes available, within booking range and in the same RBD free of charge (FOC). Fare differences will apply if any other date is booked and\/or the original RBD not used or available. You must advise the guest accordingly at the time of original booking.<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2207\u002D03\u002D2023\x22},{\x22heading\x22:\x22Change to IATA Resolution.735d\x22,\x22description\x22:\x22<p>From 1 June 2019, changes will be made to the IATA Resolution 735d policy which governs Involuntary Change of Carrier, Routing, Class or Type of Fare. The main changes are:<\/p>\\n<p>\x26nbsp;<\/p>\\n<ul>\\n<li>Resolution 735d only applies when the circumstance that results in an involuntary reroute occurs a maximum of one day before the scheduled departure time of the first impacted flight.\x26nbsp;<\/li>\\n<li>A change to the passenger’s itinerary as originally ticketed may involve a change to the routing, arrival or departure dates or times, or carriers. Resolution 735d may apply even if there is no change in carrier.<\/li>\\n<li>Upgrading to a higher cabin class shall not occur unless specifically permitted by the New Operating Carrier as bilaterally agreed with the Original Operating Carrier<\/li>\\n<li>The characters ‘INVOL’ must be used in the first five characters of the endorsement\/restriction area of the reissued document only where an Involuntary Reroute has occurred. The characters ‘INVOL’ shall not be used in the endorsement area of the reissued document in any other circumstances such as schedule changes.<\/li>\\n<li>Where an Original Operating Carrier obtains inventory from a New Operating Carrier as described in Resolution 735d, the New Operating Carrier should accept and transport the customer, provided that the bilaterally agreed booking method has been used for obtaining inventory.<\/li>\\n<li>\x26nbsp;<\/li>\\n<\/ul>\\n<p>Find details of the changes\x26nbsp;<u><a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/faq\/Involuntary_Reroute_Standards.pdf\\\x22 target=\\\x22_blank\\\x22>here<\/a><\/u>.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><u><a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/faq\/Changes_%20to_%20Standards_Supporting_Involuntary_Flight_Changes_FAQ.pdf\\\x22 target=\\\x22_blank\\\x22>Involuntary Flight Changes FAQ<\/a><\/u><\/p>\x22,\x22lastmodified\x22:\x2209\u002D05\u002D2025\x22},{\x22heading\x22:\x22Ticket validity\x22,\x22description\x22:\x22<p><b>Introduction:<\/b><\/p>\\n<p>This document aims to explain the definition of validity of a Virtual Coupon Record (VCR), or ticket.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Policy<\/b>\x26nbsp;\x26nbsp;<\/p>\\n<p>Except as otherwise provided in the Virtual Coupon Record (VCR) or in applicable fare rules (which may limit the validity of a ticket, in which case the limitation will be shown on the ticket), a VCR, or ticket, is valid for:<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>1)\x26nbsp;\x26nbsp;\x26nbsp; One year from the date of issue of the original ticket, if completely unused. For instance, if a guest issues a return ticket on 29 March 2016, they must commence their outbound travel before 29 March 2017.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>2)\x26nbsp;\x26nbsp;\x26nbsp; One year from the date of first outbound travel provided the outbound travel has commenced within one year from the date of issue of the original VCR. For instance, if a ticket is issued on 29 March 2016 and the guest has travelled outbound on 29 March 2017, they must return before 27 March 2018.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>3)\x26nbsp;\x26nbsp;\x26nbsp; Reissuance of a fully unused ticket does not change the validity: the validity of the original ticket applies. For instance, if a guest issues a return ticket on 29 March 2016, and reissues the ticket on 30 March 2016, they must commence their outbound travel before 29 March 2017 and return before 29 March 2018. The date of issue of the original ticket is always shown on the reissued ticket.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>One\u002Dyear validity shall mean one year from the date of issue or the date of commencement of travel, as applicable, to the corresponding date in the subsequent year (unless specified differently in fare rules).<br>\\n<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Exception:<\/b><\/p>\\n<p>In case the guest is denied boarding at the airport because they are deemed unfit for travel, then the below policy shall apply:<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>If, after having commenced carriage, a guest is prevented from travelling within the validity period of their ticket or VCR because of illness, the validity may be extended until the date when the guest becomes fit to travel or until the first flight after such date from the point where the journey is resumed, on which space is available in the class of service for which the fare has been paid. Such illness must be attested to by a medical certificate. When the flight coupons remaining in the VCR or ticket involve one or more stopovers, the validity may be extended for up to three months from the date shown on the certificate. In such circumstances, we will similarly extend the period of validity of tickets of other members of immediate family accompanying the guest.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>In the event of death of a guest en\u002Droute, the tickets of accompanying guests may be modified by Etihad Airways either by waiving the minimum stay or extending the validity. In the event of a death in the immediate family of a guest who has commenced carriage, the validity of the VCR or ticket and those of the immediate family* who are accompanying the guest may likewise be modified. Any such modification shall be made upon receipt of a valid death certificate or other evidence satisfactory to Etihad Airways and any such extension of validity shall not be for a period longer than forty\u002Dfive (45) days from the date of the death.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>*Immediate family member \u002D spouse, parents (including stepparents), children (including adopted and stepchildren), siblings, grandparents, grandchildren, fathers\u002Din\u002Dlaw, mothers\u002Din\u002Dlaw, brothers\u002Din\u002Dlaw, sisters\u002Din\u002Dlaw, sons\u002Din\u002Dlaw, and daughters\u002Din\u002Dlaw.<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2213\u002D06\u002D2024\x22},{\x22heading\x22:\x22Protection of onward travel in case of no\u002Dshow\x22,\x22description\x22:\x22<p><b>Policy<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>No\u002Dshow guests are permitted to travel on their onward flight without any change in fare provided they inform Etihad Airways within 24 hours of the scheduled departure time of the unused flight.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Guests must be travelling on tickets sold in\x26nbsp;<b>Europe,\x26nbsp;Russia <\/b>or<b>\x26nbsp;<\/b>the\x26nbsp;<b>UK<\/b>\x26nbsp;through Etihad.com, ticket offices, Etihad Contact Centre or Travel Agencies.<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>If the departure time of the next flight is within 24 hours, please inform us at least two hours before the departure time of the next flight. Failure to do so will result in the remaining reservations being cancelled. If the guest wishes to rebook, subject to availability of seats, they will be charged the difference between the original ticket and the highest fare in the same class of travel, applicable to the modified itinerary at the time that the ticket is reissued. If the fare rules of the original ticket are more favourable to the guest, they will be applied.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>PNR remarks and ticket endorsement must be updated with “<b>CW136 PROTECTION OF ONWARD TRAVEL<\/b>”.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<a href=\\\x22https:\/\/www.etihadhub.com\/en\u002Dae\/help\\\x22>Get in touch<\/a>\x26nbsp;with Etihad.\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2216\u002D05\u002D2025\x22},{\x22heading\x22:\x22No\u002Dshow Policy\x22,\x22description\x22:\x22<p>Effective 23 April 2026, All bookings must be reissued or refunded before the scheduled flight departure time to avoid a no\u002Dshow penalty.<\/p>\\n<p>A no\u002Dshow fee will be charged if:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>⦁\x26nbsp; \x26nbsp;A ticket is left open.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>⦁\x26nbsp; \x26nbsp;A guest changes or cancels their booking on\/after their scheduled flight departure time.<\/p>\\n<p>For applicable no\u002Dshow fees check the fare rules in your GDS.\x26nbsp;<\/p>\\n<p>No show fee includes change\/ cancellation penalty.<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2223\u002D04\u002D2026\x22},{\x22heading\x22:\x22Refunds\x22,\x22description\x22:\x22<p><b>Introduction<\/b><\/p>\\n<p>Automated Refund (AER) allows the refund of sale documents such as paper tickets, Virtual Coupon Records (VCR), Miscellaneous Charges Order (MCO), Vouchers and Electronic Miscellaneous Document (EMD).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Policy<\/b><br>\\n<\/p>\\n<p>1) When combining two different Etihad fares, the highest or most restrictive refund penalty applies.<\/p>\\n<p>\x26nbsp;<br>\\n2) When a non\u002Drefundable fare is combined with a refundable fare, the whole ticket is non\u002Drefundable.<br>\\n<\/p>\\n<p>\x26nbsp;<br>\\n3) If an EY (607) ticket is issued using a combination of EY and OAL fares, the respective refund fare rules apply (not the most restrictive rule). If the OAL ticket is non\u002Drefundable, then a refund will only apply for the EY parts of the ticket based on EY\x27s rules. This uses mileage proration.<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>4) For reissued tickets, the refund penalties of the original ticket and reissued ticket will be compared, and the highest\x26nbsp;of the two will be applied. If the original ticket is non\u002Drefundable, the base fare + YQ\/YR (where applicable) will be considered as the refund penalty for comparison.\x26nbsp;<\/p>\\n<p>For example: If the non\u002Drefundable amount of the original ticket is AED500 and the standard refund penalty of the reissued ticket is AED100, a penalty of AED500 will be deducted at the time of refund. This is automatically calculated by ATC.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>5) For non\u002Drefundable tickets, only the applicable government taxes are refunded. Fuel surcharge (YQ\/YR) is non\u002Drefundable for such tickets \u002D except for tickets issued in UK, Germany, Ireland, Netherlands, Luxembourg and Nordic countries (Denmark, Finland, Norway, Iceland and Sweden and their associated territories, the Faroe Islands, Greenland and Aland).\x26nbsp;Penalties, service fees and insurance are non\u002Drefundable.<\/p>\\n<p>Follow the below rules if you need to refund non\u002Drefundable taxes:<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2213%\\\x22><p><b>Country<\/b><\/p>\\n<\/td>\\n<td width=\\\x229%\\\x22><p><b>Tax Code<\/b><\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p><b>Remarks<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22 rowspan=\\\x223\\\x22><p>Egypt<\/p>\\n<\/td>\\n<td width=\\\x229%\\\x22><p>XL<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x229%\\\x22><p>Q7<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x229%\\\x22><p>S4<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22><p>Saudi Arabia<\/p>\\n<\/td>\\n<td width=\\\x229%\\\x22><p>E3<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22><p>Philippines<\/p>\\n<\/td>\\n<td width=\\\x229%\\\x22><p>PH<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>Non\u002DRefundable after 30 days of ticket issuance. Can be refunded while applying C24<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22><p>US<\/p>\\n<\/td>\\n<td width=\\\x229%\\\x22><p>US\/ZP\/XF<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>Non\u002DRefundable for non\u002Drefundable fares, but can be refunded while applying C24\x26nbsp;or schedule change<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22><p>India<\/p>\\n<\/td>\\n<td width=\\\x229%\\\x22><p>K3<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>K3 tax to be refunded provided the request is made within the cut off dates for the financial year. Financial year is on\/after 01April of a given year to on\/before 31March of the following year. Refund cut off will be 31October of the same year. This is applicable for involuntary refunds and refunds to Voucher\/Wallet as well.<\/p>\\n<p><b>E.g.<\/b>: For tickets issued during the financial year 01 April 2022 \u002D 31 March 2023, K3 tax refund will be allowed till 31 Oct 2023.<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22><p>Pakistan<\/p>\\n<\/td>\\n<td width=\\\x229%\\\x22><p>N9<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22><p>Jordan<\/p>\\n<\/td>\\n<td width=\\\x229%\\\x22><p>O7<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22><p>Dominican Republic<\/p>\\n<\/td>\\n<td width=\\\x229%\\\x22><p>L8<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>Non\u002DRefundable after ticket issuance<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22><p>Lebanon<\/p>\\n<\/td>\\n<td width=\\\x229%\\\x22><p>YL<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>Non\u002DRefundable, but can be refunded while using C24<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2213%\\\x22><p>Portugal<\/p>\\n<\/td>\\n<td width=\\\x229%\\\x22><p>J9<\/p>\\n<\/td>\\n<td width=\\\x2276%\\\x22><p>Non\u002Drefundable for non\u002Drefundable fares, but can be refunded while applying C24 or schedule change<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>Booking Fee (GSF\/ OB fee) charged at the time of ticket issuance will be non\u002Drefundable.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>6) Some government taxes are non\u002Drefundable after sale. Refer to tax rules on respective GDS.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>7)\x26nbsp;Ticket coupons cannot be refunded if used out of sequence.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>8)\x26nbsp;Refunds are processed to the same form of payment used for issuing the ticket\/ EMD.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>9) Refund validity:<\/p>\\n<ul>\\n<li><b>Completely unused tickets<\/b>\x26nbsp;\u002D One year from the date of issue of the original ticket.<br>\\nExample: A return ticket issued on 29 June 2022, must be refunded on or before 29 June 2023.<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<ul>\\n<li><b>Partially Used tickets<\/b>\x26nbsp;\u002D One year from the date of the first outbound travel provided that the outbound travel has commenced within one year from the date of issue of the original ticket. Example: A ticket is issued on 29 March 2022 the guest travelled outbound on 27 March 2023, it can be refunded on or before 27 March 2024.<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p>The one\u002Dyear validity period starts from the ticket\x27s issue or travel start date until the same date the following year, unless stated otherwise.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>10) Air segments must be cancelled after processing the refund.<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>11) Update corporate remarks with the reason for cancellation (for involuntary refunds).<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>12) A no\u002Dshow fee is automatically applied by the system when a refund is processed, and it depends on the date on the ticket coupon. This means that even if the itinerary is cancelled before departure, the system recognises it as a no\u002Dshow if the ticket is not exchanged for a new date.<\/p>\\n<p>\x26nbsp;<br>\\n13) A refund penalty is automatically applied on base fare + fuel surcharge (YQ)<b>\x26nbsp;<\/b>by the system according to fare filing when a refund is processed.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>14) When refund penalty is more than refundable base fare + YQ, only the base fare + YQ must be retained. Unutilised refundable government taxes must be refund in full.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>15)\x26nbsp;Refund must be calculated by deducting the one\u002Dway fare for the journey traveled in the same RBD and fare brand plus the refund penalty from the fare paid. If one\u002Dway fare is not available in the same RBD and fare brand or if the one\u002Dway fare is lower than ½ RT of the flown RBD and brand, the one\u002Dway fare of the next higher RBD and fare brand must be used.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>16)\x26nbsp;The Rate of Exchange (ROE) applied for refunds is based on the exchange rate which was in effect on the date of original ticket issuance.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>17) Refunds cannot be voided once they\x27re processed.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>18)\x26nbsp;In the unfortunate event of a death, travel agencies must submit an email request to the nearest Sales Office in the area. If the waiver is granted, a token number will be issued. The travel agent must then update this number in the BSP application along with the refund request.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Waiver of cancellation fee is provided only in case of death of guest or immediate family member. A valid death certificate must be provided as proof. Guest’s immediate family members (spouse, parents including stepparents, children including adopted and stepchildren, siblings, grandparents, grandchildren, fathers\u002Din\u002Dlaw, mothers\u002Din\u002Dlaw, brothers\u002Din\u002Dlaw, sisters\u002Din\u002Dlaw, sons\u002Din\u002Dlaw, and daughters\u002Din\u002Dlaw) can claim for a refund with proof of relationship to the deceased. Proof can be a passport copy or a government issued identity card that states the relationship. Please make guests aware that all documents submitted must be in English or translated into English.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Credit Card Refund Policy<\/b><\/p>\\n<p>Credit card refunds can take between 5 and 14 days to appear on the guest’s account.<\/p>\x22,\x22lastmodified\x22:\x2219\u002D02\u002D2026\x22},{\x22heading\x22:\x22Name correction\x22,\x22description\x22:\x22<p>There are a number of reasons why you may need to update or change a name. For example, a guest has provided a different name to that shown on their passport, your guest has got married and changed their surname, or the spelling of their name was misunderstood by the booking agent.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Policy<\/b><\/p>\\n<p>1) Etihad Airways accepts request for name correction for a ticketed booking before or after commencement of travel for the following reasons:<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2242%\\\x22><p><b>Reason<\/b><\/p>\\n<\/td>\\n<td width=\\\x2241%\\\x22><p><b>Example<\/b><\/p>\\n<\/td>\\n<td width=\\\x2215%\\\x22 valign=\\\x22top\\\x22><p><b>Chargeable<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2242%\\\x22 valign=\\\x22bottom\\\x22><p>Genuine typing errors up to 3 characters<\/p>\\n<\/td>\\n<td width=\\\x2241%\\\x22><p>TOM\/JIRRY MR to TOM\/JERRY MR<\/p>\\n<\/td>\\n<td width=\\\x2215%\\\x22><p>No<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2242%\\\x22 valign=\\\x22bottom\\\x22><p>Title Amendments<\/p>\\n<\/td>\\n<td width=\\\x2241%\\\x22><p>TOM\/MARY MR to TOM\/MARY MRS<\/p>\\n<\/td>\\n<td width=\\\x2215%\\\x22><p>No<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2242%\\\x22><p>Rearranging Surname\/First Name<\/p>\\n<\/td>\\n<td width=\\\x2241%\\\x22><p>MARY\/TOM MRS to TOM\/MARY MRS or MARY TOM\/FNU MRS<\/p>\\n<\/td>\\n<td width=\\\x2215%\\\x22><p>No<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2242%\\\x22><p>Maiden Name to Married Name (or vice versa)<\/p>\\n<\/td>\\n<td width=\\\x2241%\\\x22><p>JOHN\/MARY MS TO JACK\/MARY MRS<\/p>\\n<\/td>\\n<td width=\\\x2215%\\\x22><p>Yes<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2242%\\\x22><p>Shortened\/Nick name to full name<\/p>\\n<\/td>\\n<td width=\\\x2241%\\\x22><p>ALSHAMSI\/MOHD MR to ALSHAMSI\/MOHAMMED MR<\/p>\\n<\/td>\\n<td width=\\\x2215%\\\x22><p>Yes<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2242%\\\x22 valign=\\\x22bottom\\\x22><p>Addition\/Deletion\x26nbsp;of Middle name*\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x2241%\\\x22><p>BROWN\/JOHN MR to BROWN\/JOHN PAUL MR<\/p>\\n<\/td>\\n<td width=\\\x2215%\\\x22><p>Yes<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2242%\\\x22 valign=\\\x22bottom\\\x22><p>Addition\/Deletion\x26nbsp;of Surname*\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x2241%\\\x22><p>PAUL\/JOHN MR to BROWN\/JOHN PAUL MR<\/p>\\n<\/td>\\n<td width=\\\x2215%\\\x22><p>Yes<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2242%\\\x22 valign=\\\x22bottom\\\x22><p>Addition of suffix (Jr,Sr,II,III\x26nbsp;etc,)\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x2241%\\\x22><p>PAUL\/JOHN to PAUL\/JOHN JR\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x2215%\\\x22><p>Yes<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2242%\\\x22 valign=\\\x22bottom\\\x22><p>Complete\/partial name change for the same guest with proof from authorities (e.g., Deed Poll)<\/p>\\n<\/td>\\n<td width=\\\x2241%\\\x22><p>GEORGE\/PAUL MR to DANIEL\/JACK MR<\/p>\\n<\/td>\\n<td width=\\\x2215%\\\x22><p>Yes<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>*Both Surname and Middle name should be present in the passport. Middle name is not\x26nbsp;mandatory even when travelling to\/from\x26nbsp;US and Canada.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>2) Title amendments, juxtaposing\/rearranging surname\/first name and name corrections due to genuine typing errors (up to three characters) are accepted free of charge.\x26nbsp;\x26nbsp;Name correction that results in an entire name change is not permitted (e.g. Harry to Garry).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>3) The name correction fee does not apply to partially used tickets. If a guest has already travelled in one direction, there is no additional charge for name correction mid\u002Djourney. If a name change is needed to meet local regulatory requirements for the return trip, the amendment will be free of charge.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>4) Any other correction will only be permitted if it\x27s\x26nbsp;listed above and it will incur a fee of US $100 or AU $150 if purchased in Australia.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>5) The request must be for the same guest on the ticket.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>6) Only one change is permitted per guest.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>7) Name corrections are not permitted for un\u002Dticketed bookings. A new booking must be created with the correct name in the available booking class.\x26nbsp; If the name correction is made on an un\u002Dticketed booking, it will be identified through the Revenue Integrity Name Change Violation Process and cancelled.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>8) Travel agents must contact Etihad Airways Contact Centre for name correction on ticketed bookings. If they attempt to make any corrections, the booking may get cancelled automatically.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>9)\x26nbsp;After correcting the name on the booking, tickets must be reissued to match the corrected name. Travel agents can reissue the ticket to keep control of the ticket. Alternatively, Etihad Airways Contact Centre can reissue the ticket, but this will incur a Global Service Fee (GSF).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>10) If a travel agent attempts to make a name correction to a ticketed booking, it will be identified and cancelled by Revenue Integrity Name change violation process.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>11) To make a name correction or change on group bookings, there is a fee of USD100 or AU $150 if purchased in Australia.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>12) Name corrections are permitted on Etihad Airways tickets (607) with Other Airline (OAL) segments. A new booking\x26nbsp;must be created, and the ticket has to be reissued.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>13) \x26nbsp;For NDC bookings, the system will automatically truncate long names to fit within the 59\u002Dcharacter limit. This can heavily truncate infant names, causing issues at the airport. In such cases, it is permitted to update the infant\x27s name with more characters and remove a few characters from the adult\x27s name. The name correction fee is waived for these specific scenarios.ued.\x26nbsp; \x26nbsp; \x26nbsp;\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Procedure<\/b><\/p>\\n<p>1. Contact Etihad Airways Contact Centre to make the name correction – make sure that you have the applicable documents.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>2. Where fees apply, make the payment in cash or by credit card. You may also issue an Electronic Miscellaneous Document (EMD) with RFISC\x26nbsp;98J,\x26nbsp;stating the reason as\x26nbsp;Name Correction\x26nbsp;in the endorsement field.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>3. Etihad will verify the documents and payment then correct the name on the booking. Once the name is corrected by Etihad, the new name will appear on your reservation system and you may reissue the ticket. This applies to itineraries involving Etihad Airways (607) tickets with Etihad\u002Doperated and marketed flights.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>4. Reissue the ticket with endorsement showing “TKT REISSUED FOR NAME CORR”.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>5. If there is a date change, a penalty fee will apply as per the fare rules.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>6. If name corrections are made without an Electronic Miscellaneous Document (EMD), an Agent Debit Memo (ADM) of US $100* or equivalent will be raised against the booking\/ticketing office\/travel agency that has made the change (*AU $150 for point of sale Australia).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>7.\x26nbsp; When a name correction is requested on an EY (607) ticket involving any other airline (OAL):<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp; a) Create a new booking (PNR) with the correct name on available RBDs. Do not attempt to correct names on the original booking when other airline segments are involved.<\/p>\\n<p>\x26nbsp; b)\x26nbsp;\x26nbsp;EMD can be issued by Etihad Airways or Travel agent. Post name correction by Etihad, as a Travel agent, you can reissue the ticket. If you wish Etihad to reissue the ticket, then GSF will apply.<\/p>\\n<p>\x26nbsp; c)\x26nbsp; Reissue the original ticket with the correct name on the new PNR with the applicable fare difference (if any). Current fares must be used to reprice.<\/p>\\n<p>\x26nbsp; d) Cancel the old booking (PNR).<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Change fees\x26nbsp;\x26nbsp;<\/b><\/p>\\n<p>Date change penalties apply only if there is a change in the flight itinerary. Global service fees (if applicable) will be collected in addition to the name correction fee if there is a date change and the ticket is being reissued by Etihad Airways.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Name correction and associated EMDs<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>\u002D When a name correction is made on a booking, the associated EMD will disassociate from the booking. Name corrections on the associated EMD should only be made by Etihad Airways.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>\u002D Etihad Airways must verify the EMD for name correction fees. Once the name is corrected,\x26nbsp;<b>all associated EMDs<\/b>\x26nbsp;<b>such as bags, seats etc.\x26nbsp;<\/b>should be re\u002Dassociated to the guest’s name.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40px;\\\x22>\u002D As a Travel agent, you can reissue the ticket from your end to ensure you have custody over the booking\/ VCR. Should you wish to have the ticket reissued by Etihad, you will be subjected to GSF and have no custody of the booking. For any future changes, you will need to contact the call centre to make changes and be subjected to GSF as well.<\/p>\x22,\x22lastmodified\x22:\x2208\u002D12\u002D2025\x22},{\x22heading\x22:\x22Ticket reissue time limit \x22,\x22description\x22:\x22<p>If there are any changes to the itinerary, the agent must reissue the ticket immediately to avoid cancellation.\x26nbsp; If not, the system will cancel the seats within 0\u002D3 hours of the changes being made, depending on the departure dates. If a ticket is voided, the associated itinerary is cancelled after 4 hours of void transaction.<\/p>\x22,\x22lastmodified\x22:\x2202\u002D01\u002D2025\x22},{\x22heading\x22:\x22Standard Schedule Change Policy \x22,\x22description\x22:\x22<p>Schedule changes are planned or unplanned flight amendments that occur more than 72 hours before the scheduled departure time.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Planned schedule changes<\/b><\/p>\\n<p>Schedule change refers to the airline changing the scheduled departure time, date or flight number or cancellation of a particular flight between the date of issue (or booking) and the actual travel date.<br>\\n<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Unplanned scheduled changes<\/b><\/p>\\n<p>Changes are strategically declared, but re\u002Daccommodations are not pre\u002Dplanned. Commercial waivers are issued only when the schedule change deviates from the standard scheduled change policy.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Policy<\/b><\/p>\\n<p>Guests booked on Etihad Airways (607 document) are provided with involuntary rebooking \/refund options if they are impacted by following situations:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Departure is earlier or delayed by 120 minutes or more from the scheduled departure time of either the outbound, inbound, or connecting flight.\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The guest misses a connection due to a schedule change.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Flight cancellation.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Equipment downgrade where the guest is rebooked to a lower cabin.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Irrespective of the type of change, it is the responsibility of reservation agents to notify guests and always ensure alignment between the booking itinerary and ticket details. Tickets should be revalidated or reissued accordingly.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><a href=\\\x22https:\/\/www.etihadhub.com\/content\/dam\/eag\/etihadairways\/etihadhub\/assets\/documents\/standard\u002Dschedule\u002Dchange\/schedule\u002Dchange\u002Dpolicy.pdf\\\x22 target=\\\x22_blank\\\x22>View Standard Schedule Change Policy in English<\/a><\/p>\x22,\x22lastmodified\x22:\x2205\u002D06\u002D2026\x22},{\x22heading\x22:\x22US DOT Refund Mandate\x22,\x22description\x22:\x22<p>The U.S. Department of Transportation (Department or DOT) is requiring\x26nbsp;automatic refunds to\x26nbsp;consumers when a U.S. air carrier or a foreign air carrier cancel or makes a\x26nbsp;significant change(\x26gt;6hrs)\x26nbsp;to a scheduled flight to, from, or within the United States and the\x26nbsp;consumer is not offered or rejects alternative transportation and travel credits, vouchers, or other compensation. These automatic refunds must be provided promptly, i.e., within 7 business days for credit card payments and within 20 calendar days for other forms of payment.\x26nbsp;To ensure consumers know when they are entitled to a\x26nbsp;refund, the Department is requiring\x26nbsp;carriers and ticket agents to inform consumers of their right to a refund if that is the case before making an offer for alternative transportation, travel credits, vouchers, or other compensation in lieu of refunds.<\/p>\\n<p><b>\x26nbsp;<\/b><\/p>\\n<p>Agents are required to process the refund of a ticket or EMD through their respective GDS or request for refund through BSP\/ARC application and also send an email with subject line “<b>USA INV REF\u002D7 days rule<\/b>” to <u><a href=\\\x22mailto:EtihadRefunds@etihad.ae\\\x22>EtihadRefunds@etihad.ae<\/a><\/u> to expediate the refund process.<\/p>\x22,\x22lastmodified\x22:\x2203\u002D10\u002D2024\x22},{\x22heading\x22:\x22Travel Agency Bookings supported by Etihad Airways\x22,\x22description\x22:\x22<p>⦁\x26nbsp; \x26nbsp;Etihad Airways can only make changes for guests who are booked to travel within 24 hours, and only if they’re unable to reach their travel agent. This applies to both partially used and fully unused tickets.<\/p>\\n<p>⦁\x26nbsp; \x26nbsp;If a guest is booked to travel at a later date but wants to move their flight earlier (even if it’s within 24 hours), they’ll still need to contact their travel agent directly.<\/p>\\n<p>⦁\x26nbsp; \x26nbsp;Etihad Airways won’t make any changes to tickets issued by travel agencies in the United Kingdom, except for name corrections within 24 hours of the flight.<\/p>\x22,\x22lastmodified\x22:\x2230\u002D06\u002D2025\x22}],\x22defaultsortoption\x22:\x22mostrecent\x22,\x22dropdownlabel\x22:\x22Sort by\x22,\x22dateFormatLang\x22:\x22false\x22,\x22dropdownValueText\x22:\x22Select\x22,\x22alphabeticalSortLabel\x22:\x22Alphabetical (A\u002DZ)\x22,\x22isDefaultSortEnabled\x22:\x22true\x22,\x22monthTransaltion\x22:[{\x22value\x22:\x22January\x22,\x22key\x22:\x221\x22},{\x22value\x22:\x22February\x22,\x22key\x22:\x222\x22},{\x22value\x22:\x22March\x22,\x22key\x22:\x223\x22},{\x22value\x22:\x22April\x22,\x22key\x22:\x224\x22},{\x22value\x22:\x22May\x22,\x22key\x22:\x225\x22},{\x22value\x22:\x22June\x22,\x22key\x22:\x226\x22},{\x22value\x22:\x22July\x22,\x22key\x22:\x227\x22},{\x22value\x22:\x22August\x22,\x22key\x22:\x228\x22},{\x22value\x22:\x22September\x22,\x22key\x22:\x229\x22},{\x22value\x22:\x22October\x22,\x22key\x22:\x2210\x22},{\x22value\x22:\x22November\x22,\x22key\x22:\x2211\x22},{\x22value\x22:\x22December\x22,\x22key\x22:\x2212\x22}]}}");
