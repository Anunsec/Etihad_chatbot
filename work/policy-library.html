	var accordiondata = JSON.parse("{\x22aemdata\x22:{\x22mostRecentLabel\x22:\x22Most recent\x22,\x22updatedText\x22:\x22Updated\x22,\x22accordions\x22:[{\x22heading\x22:\x22Advance Passenger Information System (APIS)\x22,\x22description\x22:\x22<p>Here is everything you need to know about Advance Passenger Information System (APIS) and how to update it on the PNR.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Policy<\/b><\/p>\\n<p>\x26nbsp;<\/p>\\n<p>It is mandatory for all commercial airlines on international flights to send guest and crew manifest data to the Advance Passenger Information System (APIS). APIS details must be updated prior to departure to avoid delay at the airport.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>The three SSR elements used for this purpose are categorized as:<\/p>\\n<ul>\\n<li><b>DOCS:<\/b>\x26nbsp;for the primary travel document information (e.g. passport or national ID)<\/li>\\n<li><b>DOCO:<\/b>\x26nbsp;for the secondary travel document information (e.g. visa)<\/li>\\n<li><b>DOCA:<\/b>\x26nbsp;passenger address information (either residence or destination)<br>\\n<br>\\n<\/li>\\n<\/ul>\\n<p>The above three SSRs should be passenger\u002Dassociated (mandatory) and segment\u002Dassociated (optional). Certain countries require all three pieces of information to be inserted in the travel record locator of the guest that enters or leaves the country.<br>\\n<br>\\n<\/p>\\n<p>Note: The name of the guest is auto\u002Dpopulated. However, you should ensure that there is a space between the first name and title to avoid a name mismatch between the reservation and travel documents.<\/p>\\n<p>The UAE local authorities have informed that the submission of APIS must be precise and correct against the information of the travel documents.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>Routes that require APIS information\x26nbsp;<b>DOCS<\/b>:<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellpadding=\\\x220\\\x22 cellspacing=\\\x220\\\x22 width=\\\x2250%\\\x22>\\n<tbody><tr><td>UK<\/td>\\n<td width=\\\x2264\\\x22>Inbound\/Outbound<\/td>\\n<td width=\\\x2264\\\x22>KWI<\/td>\\n<td width=\\\x2264\\\x22>Inbound\/Outbound<\/td>\\n<\/tr><tr><td height=\\\x2260\\\x22 width=\\\x2264\\\x22>JFK<\/td>\\n<td width=\\\x2264\\\x22>Inbound\/Outbound<\/td>\\n<td width=\\\x2264\\\x22>ORD<\/td>\\n<td width=\\\x2264\\\x22>Inbound\/Outbound<\/td>\\n<\/tr><tr><td height=\\\x2260\\\x22 width=\\\x2264\\\x22>LAX<\/td>\\n<td width=\\\x2264\\\x22>Inbound\/Outbound<\/td>\\n<td width=\\\x2264\\\x22>ICN<\/td>\\n<td width=\\\x2264\\\x22>Inbound\/Outbound<\/td>\\n<\/tr><tr><td height=\\\x2220\\\x22 width=\\\x2264\\\x22>BAH<\/td>\\n<td width=\\\x2264\\\x22>Inbound<\/td>\\n<td width=\\\x2264\\\x22>JNB<\/td>\\n<td width=\\\x2264\\\x22>Inbound<\/td>\\n<\/tr><tr><td height=\\\x2220\\\x22 width=\\\x2264\\\x22>CGK<\/td>\\n<td width=\\\x2264\\\x22>Inbound<\/td>\\n<td width=\\\x2264\\\x22>BNE<\/td>\\n<td width=\\\x2264\\\x22>Inbound<\/td>\\n<\/tr><tr><td height=\\\x2220\\\x22 width=\\\x2264\\\x22>YYZ<\/td>\\n<td width=\\\x2264\\\x22>Inbound<\/td>\\n<td width=\\\x2264\\\x22>SYD<\/td>\\n<td width=\\\x2264\\\x22>Inbound<\/td>\\n<\/tr><tr><td height=\\\x2220\\\x22 width=\\\x2264\\\x22>NRT<\/td>\\n<td width=\\\x2264\\\x22>Inbound<\/td>\\n<td width=\\\x2264\\\x22>NGO<\/td>\\n<td width=\\\x2264\\\x22>Inbound<\/td>\\n<\/tr><\/tbody><\/table>\\n<table border=\\\x220\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22412\\\x22>\\n<tbody><\/tbody><\/table>\\n<p><br>\\nFor PEK:\x26nbsp;The 3 SSR elements of the API i.e. passport information (DOCS), destination address (DOCA) and visa information (DOCO) are mandatory.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>For Japan:\x26nbsp;Authorities of Japan require APIS for all guests travelling to Nagoya (NGO) and Narita (NRT). Passport information (DOCS) is mandatory.<br>\\n<br>\\n<\/p>\\n<p>For Germany:\x26nbsp;DOCS SSR is mandatory and must be updated for all guests including infants travelling to Munich (MUC), Frankfurt (FRA) and Dusseldorf (DUS). Additional mandatory APIS data is required for nationals who require a visa to enter Germany.\x26nbsp;Incorrect or missing data may result in a fine of up to\x26nbsp;<b>EUR 50,000.<br>\\n<\/b><br>\\n<\/p>\\n<p>For India:\x26nbsp;Passport information (DOCS) and visa information (DOCO) is mandatory.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<table width=\\\x2270%\\\x22 border=\\\x221\\\x22 cellspacing=\\\x221\\\x22 cellpadding=\\\x221\\\x22 height=\\\x2270%\\\x22>\\n<tbody><tr><td><p>BOM<\/p>\\n<\/td>\\n<td width=\\\x22161\\\x22 valign=\\\x22top\\\x22><p>Inbound<\/p>\\n<\/td>\\n<td width=\\\x22150\\\x22 valign=\\\x22top\\\x22><p>DEL<\/p>\\n<\/td>\\n<td width=\\\x22161\\\x22 valign=\\\x22top\\\x22><p>Inbound<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22151\\\x22 valign=\\\x22top\\\x22><p>TRV<\/p>\\n<\/td>\\n<td width=\\\x22161\\\x22 valign=\\\x22top\\\x22><p>Inbound<\/p>\\n<\/td>\\n<td width=\\\x22150\\\x22 valign=\\\x22top\\\x22><p>COK<\/p>\\n<\/td>\\n<td width=\\\x22161\\\x22 valign=\\\x22top\\\x22><p>Inbound<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x22151\\\x22 valign=\\\x22top\\\x22><p>CCJ<\/p>\\n<\/td>\\n<td width=\\\x22161\\\x22 valign=\\\x22top\\\x22><p>Inbound<\/p>\\n<\/td>\\n<td width=\\\x22150\\\x22 valign=\\\x22top\\\x22><p>MAA<\/p>\\n<\/td>\\n<td width=\\\x22161\\\x22 valign=\\\x22top\\\x22><p>Inbound<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p><b>UAE \u002D name format<\/b><\/p>\\n<ul>\\n<li>If\x26nbsp;the passport\x26nbsp;has two fields, one for ‘first\x26nbsp;name’\x26nbsp;and\x26nbsp;one for ‘surname’,\x26nbsp;and one of them is blank\/FNU\/LNU, the other field must\x26nbsp;contain\x26nbsp;at least two words\x26nbsp;(names).\x26nbsp;<\/li>\\n<li>If a travel document\x26nbsp;contains\x26nbsp;‘XXX’ in one of the\x26nbsp;fields, it will not be accepted.\x26nbsp;<\/li>\\n<li>Travel documents with two names\x26nbsp;added as observations\/annotations or with a second name added on any page are accepted if the\x26nbsp;names belong to the guest or to the guest’s father\x26nbsp;<\/li>\\n<li>This requirement does not apply to guests with\x26nbsp;valid\x26nbsp;UAE Emirates ID.\x26nbsp;<\/li>\\n<\/ul>\\n<p>\x26nbsp;<\/p>\\n<p><b>UAE and Saudi Arabia \u002D date of birth format<\/b><\/p>\\n<p>Passports with incomplete date of birth not as per the standard ICAO Format (i.e., 01\/01\/2010 Date\/Month\/Year) will not be accepted for entry into the United Arab Emirates\x26nbsp;or Saudi Arabia. <\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2254%\\\x22 valign=\\\x22top\\\x22><p><b>Format on Passport<\/b><\/p>\\n<\/td>\\n<td width=\\\x2245%\\\x22 valign=\\\x22top\\\x22><p><b>Accepted for entry to UAE<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2254%\\\x22 valign=\\\x22top\\\x22><p>Day\/Month\/Year\x26nbsp;e.g.\x26nbsp;01 JAN 80\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x2245%\\\x22 valign=\\\x22top\\\x22><p>Yes\x26nbsp;<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2254%\\\x22 valign=\\\x22top\\\x22><p>Month\/Year\x26nbsp;e.g.\x26nbsp;XX\/XX or 00\/00\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x2245%\\\x22 valign=\\\x22top\\\x22><p>No\x26nbsp;<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2254%\\\x22 valign=\\\x22top\\\x22><p>Month\/Year\x26nbsp;e.g.\x26nbsp;JAN 80\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x2245%\\\x22 valign=\\\x22top\\\x22><p>No\x26nbsp;<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2254%\\\x22 valign=\\\x22top\\\x22><p>Year\x26nbsp;e.g.\x26nbsp;80\x26nbsp;<\/p>\\n<\/td>\\n<td width=\\\x2245%\\\x22 valign=\\\x22top\\\x22><p>No<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\x22,\x22lastmodified\x22:\x2202\u002D02\u002D2026\x22},{\x22heading\x22:\x22Animals and pets\x22,\x22description\x22:\x22<p><b>Live animals (restrictions apply) can be transported on Etihad Airways in the following ways:<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>1)\x26nbsp;\x26nbsp;\x26nbsp; Pet in Cabin (PETC)<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>2)\x26nbsp;\x26nbsp;\x26nbsp; Animal as checked baggage in cargo hold (AVIH)<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>3)\x26nbsp;\x26nbsp;\x26nbsp; Manifested cargo<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>1)\x26nbsp;\x26nbsp;\x26nbsp; Pet in Cabin (PETC)<\/b><\/p>\\n<p>Etihad Airways permits the carriage of following animals in cabin:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>a)\x26nbsp;\x26nbsp;\x26nbsp; Pet dogs or cats\x26nbsp;\x26nbsp;(To be booked via Contact Centre only)<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>b)\x26nbsp;\x26nbsp;\x26nbsp; Service animals (dogs only)<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>c)\x26nbsp;\x26nbsp;\x26nbsp; Falcons<\/p>\\n<h4>\x26nbsp;<\/h4>\\n<h4>Guests with allergies and live animals:<\/h4>\\n<p>Where a guest provides a medical report prior to the flight stating that they are allergic to animals, animals shall be accepted in the cabin according to the following specific conditions:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D In cases of a guest with an allergy statement and a guest with <b><u>a pet<\/u> <\/b>request travelling on the same flight, the request of the guest who made the first reservation shall be confirmed.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D In cases of a guest with an allergy statement and a guest with <b><u>a trained service animal<\/u> <\/b>on the travelling on the same flight, the trained service animal shall always take priority regardless of time of reservation.<\/p>\\n<h4>\x26nbsp;<\/h4>\\n<h4>Service animals and falcons:<\/h4>\\n<h4 style=\\\x22margin\u002Dleft: 40.0px;\\\x22><span style=\\\x22font\u002Dweight: normal;\\\x22>\u002D In cases of a guest wishing to travel with a trained service animal and a guest wishing to travel with a falcon in the same class on the same flight, the request of the guest wishing to travel with a trained service animal shall always take priority regardless of time of reservation.<\/span><\/h4>\\n<h4>Banned Breeds:<\/h4>\\n<p>Following breeds of animals are not accepted on the aircraft:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Pit Bulls<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>1.\x26nbsp;\x26nbsp;\x26nbsp; Staffordshire Bull Terrier breed of dog<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>2.\x26nbsp;\x26nbsp;\x26nbsp; American Pit Bull Terrier breed of dog<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>3.\x26nbsp;\x26nbsp;\x26nbsp; American Staffordshire Terrier breed of dog<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>4.\x26nbsp;\x26nbsp;\x26nbsp; American Bully<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Mastiff Dogs<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>1.\x26nbsp;\x26nbsp;\x26nbsp; Brazilian Mastiff (Fila Brasiliero)<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>2.\x26nbsp;\x26nbsp;\x26nbsp; Argentinian Mastiff (Dogo Argentino)<\/p>\\n<p style=\\\x22margin\u002Dleft: 80.0px;\\\x22>3.\x26nbsp;\x26nbsp;\x26nbsp; Any Mastiff or Hybrid<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Tosa \u002D Japanese Tosa\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Rottweilers breed\x26nbsp;<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Doberman Pinschers<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Canario Presa<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Boxer<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp;\x26nbsp; Any mixed breed of above breeds of dog or their hybrid<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>a)\x26nbsp;\x26nbsp;\x26nbsp; Pet dogs or cats in cabin (PETC)<\/b><\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Cats and Dogs are the only pets permitted to be carried on Etihad Airways flights.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;Pets are permitted to be carried in Economy and Business cabins only. Pets cannot be carried in the First cabin and The Residence.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;Pets are permitted on direct EY routes to, from or via Abu Dhabi on EY marketed (607 stock) and operated flights<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;These are only bookable through Etihad Contact Centres<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;Guests must be at least 18 years of age to be eligible to transport a pet.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;It is permitted for a guest to bring one (1) cat or one (1) dog as a pet in the cabin<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D\x26nbsp;The maximum number of pets in the cabin per flight is as per the table below:<\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x22100%\\\x22 colspan=\\\x225\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>MAXIMUM NUMBER OF PETS CAT\/DOG IN CABIN<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Aircraft Type<\/b><\/p>\\n<\/td>\\n<td width=\\\x2210%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>First<\/b><\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Business<\/b><\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Economy<\/b><\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Max per flight<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>A321LR<\/p>\\n<\/td>\\n<td width=\\\x2210%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>4<\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>4<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Narrow body (other)<\/p>\\n<\/td>\\n<td width=\\\x2210%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>1*<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>4<\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>4<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2232%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>Wide body<\/p>\\n<\/td>\\n<td width=\\\x2210%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>2**<\/p>\\n<\/td>\\n<td width=\\\x2216%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>8<\/p>\\n<\/td>\\n<td width=\\\x2224%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>8<\/p>\\n<\/td>\\n<\/tr><\/tbody><\/table>\\n<p><b>* <\/b>May be increased to a total of two (2) where two (2) passengers are travelling together and wish to bring one (1) pet each from the same household\/family.<\/p>\\n<p><b>** <\/b>May be increased to a total of three (3) where two (2) passengers are travelling together and wish to bring one (1) pet each from the same household\/family.<\/p>\\n<p><b>\x26nbsp;<\/b><\/p>\\n<p><b>Note: <\/b>Each pet must be in a separate travel kennel crate.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\u002D\x26nbsp;On a flight with falcons(s) travelling in the cabin, a pet (dog or cat) cannot travel in the same travel cabin as the falcon(s). If a guest is travelling with a pet dog or cat in the cabin and another guest is travelling with a falcon in the same class on the same flight, the request of the guest who made the first reservation shall be confirmed.<\/p>\\n<p>\u002D\x26nbsp;Where a guest with an allergy statement and a guest with <b><u>a pet<\/u><\/b> request are travelling on the same flight, the request of the guest who made the first reservation will be confirmed.<\/p>\\n<p>\u002D\x26nbsp;If a guest travelling with a pet dog or cat in the cabin and a guest travelling with a trained service animal is on the same flight, the request of the guest wishing to travel with a trained service animal will always take priority regardless of time of reservation.<\/p>\\n<p>\u002D\x26nbsp;The container (pet travel bag or kennel) must be within the maximum weight and dimension requirements for the applicable travel class (refer to sections 3.1 and 3.2) and must meet the following requirements:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The pet should be able to sit and stand in a natural position with its head fully erect (without touching the roof), turn around and lie down<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The carrier must be ventilated on at least three (3) surfaces<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The carrier must be escape\u002Dproof (rigid door for kennels \/ secure entrance for pet travel bag) and leak proof<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The container floor must contain absorbent material<\/p>\\n<p>\u002D\x26nbsp;The guest will provide:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Absorbent material for inside the container, including sufficient spares and disposal bags<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Dry food in a sealed container for the animal, sufficient for the duration of the journey.<\/p>\\n<p>\u002D\x26nbsp;The pet must not be allowed outside the pet travel bag or kennel whilst on board the aircraft.<\/p>\\n<p>\u002D\x26nbsp;The pet must be of a minimum of 16 weeks old.<\/p>\\n<p>\u002D In Economy Cabin,<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; For under\u002Dseat carriage, the pet must be able to fit in a pet travel bag or kennel with maximum dimensions of 40 x 40 x 22 cm (L x W x H) to fit safely under the seat.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; For carriage on an adjacent purchased seat, the pet must be able to fit in a pet travel bag or kennel with maximum dimensions of 50 x 43 x 50 cm (L x W x H).<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The pet travel bag or kennel shall be secured to the seat with extension seat belts.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The gross weight (pet and travel bag\/kennel combined) should be no more than 8 kg.<\/p>\\n<p>\u002D In Business Cabin,<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; It is not possible to stow pets under seats.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; An extra seat must be purchased adjacent to the accompanying guest and the pet shall be in a pet travel bag or kennel with maximum dimensions of 50 x 43 x 50 cm (L x W x H).<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Contact Centre agent must ensure that there are adjacent seats available on the aircraft and block them before accepting the carriage of pet request. If there are no adjacent seats, an alternate flight must be offered.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; The gross weight (pet and travel bag\/kennel combined) must not be more than 8 kg.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Where two (2) passengers travelling together wish to bring one (1) pet each (i.e., two (2) pets in total) in Business, an additional seat shall be purchased for each pet.<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Where an additional seat has been purchased, the passenger is entitled to the additional checked baggage allowance associated with the purchased seat.<\/p>\\n<p>\u002D Where possible, the guest travelling with a pet should be allocated a window seat. A guest travelling with a pet will not be seated in any of the following locations:<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Bulkhead rows<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; Emergency exit rows<\/p>\\n<p style=\\\x22margin\u002Dleft: 40.0px;\\\x22>o\x26nbsp;\x26nbsp; One row forward and aft of over\u002Dwing exit rows<\/p>\\n<p>\u002D\x26nbsp;Standard Seat will be provided free of charge for a guest travelling with a pet (SSR PETC) within 48 hours of departure.<\/p>\\n<p>\u002D Guests must submit the booking form at least 7 days in advance and provide all necessary documents to the Contact Centre no later than <b>72 hours<\/b> prior to intended travel. Where three (3) pets will be carried as permitted, a separate form must be completed for each pet<\/p>\\n<p>\u002D SSR PETC can be updated in the booking only by EY agents and it must be updated only after receiving all approvals<\/p>\\n<p>\u002D\x26nbsp;\x26nbsp; For guests using the Etihad Chauffeur service, or connecting Etihad Shuttle services in the UAE, pets are permitted on these services in accordance with this policy<\/p>\\n<div>\u002D\x26nbsp;\x26nbsp; For guests eligible to use premium lounges, pets may be taken into Etihad lounges in Abu Dhabi. For lounges in network airports, access is dependent upon the acceptance policy of the lounge operator. Pets must always remain inside the pet carrier or kennel<\/div>\\n<div>\x26nbsp;<\/div>\\n<div><b>Terms \x26amp; Conditions:<\/b><\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Etihad Airways will not be responsible if authorities in other countries refuse entry of your pet due to non\u002Dcompliance with local regulations. Etihad will in this case, not be liable for any resulting costs such as flight rebooking charges, hotel accommodation if Etihad have to refuse the carriage of your pet due to non\u002Dcompliance with the regulations<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D We assume no liability for the health or wellbeing of pets carried in the cabin<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The pet must be able to sit and stand in a natural position with its head fully erect (without touching the roof), turn around and lie down<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The carrier must be ventilated on at least three (3) surfaces<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The carrier must be escape\u002Dproof (rigid door for kennels or secure entrance for pet travel bag) and leak\u002Dproof<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The container floor must contain absorbent material<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D You are responsible for additional costs for import or export<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Pregnant pets cannot be accepted for travel<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guest must report 3 hours prior to departure at the airport<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guest must bring enough of absorbent sheets for their pet to relieve itself, including connecting flights and transit airport, if applicable<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guest can only carry dry pet food in your cabin baggage. Food should be carried in a sealed container so the smell does not disturb other guests<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D If there are guests travelling on\u002Dboard that are allergic to animals, our crew may be required to re\u002Dseat you and your pet. In rare occurrences, we may need to re\u002Dbook your flight<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Sedation of animals, except under certain conditions and carried out under veterinary supervision, is not recommended. Commonly used tranquilizers lower blood pressure, which also occurs at high altitude<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D The combination of high altitude and medicines could be dangerous for old, chronically sick or stressed animals. Keeping a container in a dark, cool, quiet place prior to flying will calm down most animals. If you have to sedate your pet per veterinarian’s instruction, the name of the drug and time of intake must be clearly marked on the container<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Pets must always remain in their carriers<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Guests must complete all formalities upon arrival at Abu Dhabi airport according to UAE regulations, including an inspection by the Ministry of Climate Change and Environment (MOCCAE) veterinary officer, performed in the Customs clearance area<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D For all other destinations, guests must complete all arrival formalities according to local regulations<\/div>\\n<div style=\\\x22margin\u002Dleft: 40.0px;\\\x22>\u002D Inspection and clearance areas may vary from airport to airport, guests must check with the applicable authority at their destination for specific requirements<\/div>\\n<p>\x26nbsp;<\/p>\\n<p><b><u>Changes and Refunds:<\/u><\/b><\/p>\\n<p><b>Voluntary changes: <\/b>The guest can change the request anytime up to 3 hours to departure time. However, if the guest wishes to take the pet on the new dates\/flight, they’d need to inform Etihad Airways and go through the approval process again. The guest will still be liable of ensuring that the required documents, certificates, permits allow for the pet to travel on the rebooked flight.\x26nbsp;\x26nbsp;The same process applies to guests who wish to upgrade their ticket to a higher class of travel.\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Involuntary changes: <\/b>Etihad Airways will coordinate with the guest and provide the best available options in cases where the flight has been re\u002Dbooked or cancelled. For delays or flight cancellations, the guest may utilize the original animal documentation.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Refunds: <\/b>A full refund is only given for cases where Etihad had an irregular operation and was not able to transport the pet. In this case, the guest can reach out to our contact centers and request for a refund to the fees that were paid. The guest can request for a full refund for the fees that were paid for transporting the pet if the options that Etihad Airways have provided does not meet their needs, provided that the pet was not transported from the country of origin. If Etihad Airways was able to transport the pet on another flight\/date or even airline after obtaining the guest’s consent, then refund is not allowed.<\/p>\\n<p>\x26nbsp;<\/p>\\n<p>\x26nbsp;<\/p>\\n<p><b>Country restrictions<\/b><\/p>\\n<p>Due to government or operational restrictions, guests cannot travel with their pet, falcon, or service dog on the following routes:<\/p>\\n<p>\x26nbsp;<\/p>\\n<table border=\\\x221\\\x22 cellspacing=\\\x220\\\x22 cellpadding=\\\x220\\\x22 width=\\\x22100%\\\x22>\\n<tbody><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Countries<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Falcons<\/b><\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Pets (PETC)<\/b><\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Service Animals (SVAN)<\/b><\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Australia<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To Melbourne (MEL)<br>\\nTo\/from Sydney (SYD)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To Sydney (SYD)<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22><b>Cambodia<\/b><\/p>\\n<\/td>\\n<td width=\\\x2213%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>To\/from Phnom Penh (KTI)<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<td width=\\\x2237%\\\x22 valign=\\\x22top\\\x22><p style=\\\x22text\u002Dalign: center;\\\x22>\u002D<\/p>\\n<\/td>\\n<\/tr><tr><td width=\\\x2211%\\\x22 valign=\\\x22top\\\x2
